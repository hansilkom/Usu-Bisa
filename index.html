<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>USU BISA — Academic Personal Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ============================================================
           ROOT — Design System v4.1 (Final Polish)
           ============================================================ */
        :root {
            --color-primary: #0a2e24;
            --color-primary-light: #14532d;
            --color-primary-lighter: #1a6e3e;
            --color-primary-bg: #e8f5e9;
            --color-gold: #f5b300;
            --color-gold-light: #ffd54f;
            --color-gold-bg: #fef8e7;
            --color-white: #ffffff;
            --color-bg: #f4f6f9;
            --color-card: #ffffff;
            --color-text: #0f172a;
            --color-text-secondary: #334155;
            --color-text-muted: #94a3b8;
            --color-border: #e9edf2;
            --color-danger: #dc2626;
            --color-danger-hover: #b91c1c;
            --color-success: #16a34a;
            --color-info: #2563eb;
            --color-warning: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.16);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --header-h: 56px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--color-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            padding-bottom: calc(12px + var(--safe-bottom));
            color: var(--color-white);
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        /* ============================================================
           LANDING — Unified Logo
           ============================================================ */
        .landing {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeUp 0.8s ease both;
            padding: 16px 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(32px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landing-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--color-white);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        .landing-logo:hover {
            transform: scale(1.04);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .landing-logo svg {
            width: 100px;
            height: 100px;
        }

        .landing-title {
            font-size: 3.6rem;
            font-weight: 800;
            color: var(--color-gold-light);
            letter-spacing: -2px;
            margin-bottom: 0;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
            line-height: 1.05;
        }

        .landing-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
            letter-spacing: 1px;
            font-weight: 400;
        }
        .landing-sub span {
            display: block;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            margin-top: 1px;
        }

        .landing-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: 28px auto 24px;
        }
        .landing-stat {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 12px 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }
        .landing-stat:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .landing-stat .num {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--color-gold-light);
            line-height: 1.2;
        }
        .landing-stat .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .landing-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .landing-menu .menu-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(245, 179, 0, 0.35);
            color: var(--color-gold);
            padding: 11px 6px;
            border-radius: var(--radius-md);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 46px;
            letter-spacing: 0.2px;
            font-family: var(--font);
        }
        .landing-menu .menu-btn i {
            font-size: 0.95rem;
        }
        .landing-menu .menu-btn:hover,
        .landing-menu .menu-btn:focus-visible {
            background: var(--color-gold);
            color: var(--color-primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(245, 179, 0, 0.3);
            border-color: var(--color-gold);
        }
        .landing-menu .menu-btn:active {
            transform: translateY(0) scale(0.97);
        }

        /* ============================================================
           MAIN CONTAINER
           ============================================================ */
        .main-container {
            width: 100%;
            max-width: 1120px;
            min-height: 88vh;
            max-height: 96vh;
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            display: none;
            flex-direction: column;
            color: var(--color-text);
            position: relative;
        }
        .main-container.active {
            display: flex;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--color-white);
            padding: 0 18px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: var(--header-h);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .header-back {
            background: none;
            border: none;
            color: var(--color-text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 4px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header-back:hover {
            background: var(--color-border);
        }
        .header-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-title .brand-badge {
            font-size: 0.55rem;
            font-weight: 500;
            color: var(--color-text-muted);
            background: var(--color-bg);
            padding: 1px 10px;
            border-radius: var(--radius-full);
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .header-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-family: var(--font);
            min-height: 34px;
        }
        .header-btn i {
            font-size: 0.9rem;
        }
        .header-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .header-btn:active {
            transform: scale(0.96);
        }
        .header-btn.outline {
            background: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-border);
        }
        .header-btn.outline:hover {
            background: var(--color-border);
            transform: none;
            box-shadow: none;
        }
        .header-btn.danger {
            background: var(--color-danger);
        }
        .header-btn.danger:hover {
            background: var(--color-danger-hover);
        }
        .header-btn .btn-label {
            display: inline;
        }

        .io-dropdown {
            position: relative;
            display: inline-block;
        }
        .io-dropdown .io-toggle {
            background: transparent;
            border: none;
            color: var(--color-text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
            display: flex;
            align-items: center;
        }
        .io-dropdown .io-toggle:hover {
            background: var(--color-border);
        }
        .io-dropdown .io-menu {
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--color-white);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            min-width: 160px;
            padding: 4px 0;
            display: none;
            z-index: 40;
            border: 1px solid var(--color-border);
        }
        .io-dropdown .io-menu.open {
            display: block;
        }
        .io-dropdown .io-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 16px;
            border: none;
            background: none;
            font-family: var(--font);
            font-size: 0.75rem;
            color: var(--color-text);
            cursor: pointer;
            transition: background 0.15s;
            text-align: left;
        }
        .io-dropdown .io-menu button:hover {
            background: var(--color-bg);
        }
        .io-dropdown .io-menu button i {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            width: 20px;
            text-align: center;
        }
        .io-dropdown .io-menu .divider {
            height: 1px;
            background: var(--color-border);
            margin: 4px 12px;
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        .search-wrap {
            background: var(--color-white);
            padding: 6px 18px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            display: none;
        }
        .search-wrap.visible {
            display: block;
        }
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--color-bg);
            border-radius: var(--radius-full);
            padding: 0 14px;
            border: 2px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(11, 61, 46, 0.06);
        }
        .search-bar .search-icon {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-right: 6px;
            display: flex;
            align-items: center;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 0.8rem;
            font-family: var(--font);
            outline: none;
            min-width: 0;
            color: var(--color-text);
        }
        .search-bar input::placeholder {
            color: var(--color-text-muted);
        }
        .search-bar .clear-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 4px;
            display: none;
            line-height: 1;
        }
        .search-bar .clear-btn.visible {
            display: block;
        }
        .search-bar .search-submit {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            padding: 4px 14px;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 3px;
            min-height: 28px;
        }
        .search-bar .search-submit:hover {
            background: var(--color-primary-light);
        }
        .search-result-info {
            font-size: 0.65rem;
            color: var(--color-text-muted);
            padding: 4px 4px 0;
        }

        /* ============================================================
           CONTENT
           ============================================================ */
        .content {
            flex: 1;
            padding: 16px 18px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 6px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ============================================================
           DASHBOARD
           ============================================================ */
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .dash-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 14px 8px;
            box-shadow: var(--shadow-sm);
            border-left: 3px solid var(--color-gold);
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .dash-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .dash-card .num {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--color-primary);
            line-height: 1.2;
        }
        .dash-card .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-text-muted);
            margin-top: 2px;
        }

        .dash-section {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 14px;
            transition: box-shadow 0.2s;
        }
        .dash-section:hover {
            box-shadow: var(--shadow-md);
        }
        .dash-section h3 {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 8px;
        }
        .dash-section h3 .badge {
            background: var(--color-gold-bg);
            color: var(--color-primary);
            font-size: 0.5rem;
            padding: 1px 10px;
            border-radius: var(--radius-full);
            margin-left: auto;
            font-weight: 600;
        }

        .dash-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 12px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f1f3f6;
        }
        .dash-item:last-child {
            border-bottom: none;
        }
        .dash-item .dash-label {
            font-size: 0.78rem;
            color: var(--color-text-secondary);
            word-break: break-word;
            min-width: 0;
        }
        .dash-item .dash-label .sub {
            display: block;
            font-size: 0.62rem;
            color: var(--color-text-muted);
            font-weight: 400;
            margin-top: 1px;
        }
        .dash-item .dash-value {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--color-text);
            text-align: right;
            white-space: nowrap;
        }
        .dash-item .dash-value.highlight {
            color: var(--color-danger);
        }
        .dash-item .dash-value.success {
            color: var(--color-success);
        }

        .dash-empty {
            color: var(--color-text-muted);
            font-size: 0.78rem;
            text-align: center;
            padding: 16px 0;
        }

        .briefing-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            box-shadow: var(--shadow-md);
            margin-bottom: 18px;
            border-left: 4px solid var(--color-gold);
            transition: all 0.2s;
        }
        .briefing-card .greeting {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 0;
        }
        .briefing-card .date {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            margin-bottom: 10px;
        }
        .briefing-card .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }
        .briefing-card .summary-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            color: var(--color-text-secondary);
        }
        .briefing-card .summary-item .num {
            font-weight: 700;
            color: var(--color-text);
        }
        .briefing-card .summary-item i {
            font-size: 0.75rem;
        }

        .reminder-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .reminder-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 12px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--color-info);
            transition: background 0.15s;
        }
        .reminder-item:hover {
            background: #e8ecf1;
        }
        .reminder-item.urgent {
            border-left-color: var(--color-danger);
        }
        .reminder-item.important {
            border-left-color: var(--color-warning);
        }
        .reminder-item.reminder {
            border-left-color: var(--color-info);
        }
        .reminder-item .icon {
            font-size: 0.9rem;
            flex-shrink: 0;
            margin-top: 1px;
            display: flex;
            align-items: center;
        }
        .reminder-item .r-content {
            flex: 1;
            padding: 0;
            background: transparent;
            box-shadow: none;
            overflow: hidden;
        }
        .reminder-item .r-content .title {
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--color-text);
        }
        .reminder-item .r-content .desc {
            font-size: 0.68rem;
            color: var(--color-text-secondary);
            margin-top: 0;
            word-break: break-word;
        }
        .reminder-item .r-content .meta {
            font-size: 0.55rem;
            color: var(--color-text-muted);
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .reminder-item .r-content .meta .tag {
            background: var(--color-white);
            padding: 0 6px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-border);
        }
        .reminder-item .action-link {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--color-primary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
            flex-shrink: 0;
            font-family: var(--font);
            white-space: nowrap;
        }
        .reminder-item .action-link:hover {
            background: var(--color-gold-bg);
        }
        .reminder-empty {
            color: var(--color-text-muted);
            font-size: 0.75rem;
            padding: 6px 0;
            text-align: center;
        }

        .briefing-dismiss {
            text-align: right;
            margin-top: 8px;
        }
        .briefing-dismiss button {
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 0.6rem;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
            font-family: var(--font);
        }
        .briefing-dismiss button:hover {
            background: var(--color-border);
        }

        .ipk-tracker {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .ipk-tracker .ipk-input {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .ipk-tracker .ipk-input label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--color-text-secondary);
        }
        .ipk-tracker .ipk-input input {
            width: 56px;
            padding: 3px 6px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-family: var(--font);
            text-align: center;
            font-weight: 600;
            color: var(--color-text);
            transition: border-color 0.2s;
        }
        .ipk-tracker .ipk-input input:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .ipk-tracker .ipk-bar-wrap {
            flex: 1;
            min-width: 80px;
        }
        .ipk-tracker .ipk-bar {
            height: 5px;
            background: var(--color-border);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
        }
        .ipk-tracker .ipk-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-success), var(--color-gold));
            border-radius: var(--radius-full);
            transition: width 0.6s ease;
            width: 0%;
        }
        .ipk-tracker .ipk-label {
            font-size: 0.6rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }
        .ipk-tracker .ipk-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 3px 12px;
            border-radius: var(--radius-full);
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: var(--font);
            min-height: 26px;
        }
        .ipk-tracker .ipk-btn:hover {
            background: var(--color-primary-light);
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }
        .note-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .note-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--color-gold);
        }
        .note-card .note-title {
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--color-text);
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-card .note-title .del-note {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 0.65rem;
            padding: 0 2px;
            transition: color 0.15s;
        }
        .note-card .note-title .del-note:hover {
            color: var(--color-danger);
        }
        .note-card .note-preview {
            font-size: 0.68rem;
            color: var(--color-text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-card .note-date {
            font-size: 0.5rem;
            color: var(--color-text-muted);
            margin-top: 4px;
        }
        .note-add-btn {
            background: var(--color-white);
            border: 2px dashed var(--color-primary);
            color: var(--color-primary);
            padding: 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-size: 0.7rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
        }
        .note-add-btn:hover {
            background: var(--color-gold-bg);
            border-style: solid;
        }

        /* ============================================================
           LIST VIEW
           ============================================================ */
        .module-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .list-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .list-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-sm);
            opacity: 0;
            background: linear-gradient(135deg, rgba(245, 179, 0, 0.04), transparent);
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .list-card:hover::after {
            opacity: 1;
        }
        .list-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--color-gold);
        }
        .list-card:active {
            transform: scale(0.98);
        }
        .list-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--color-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--color-gold);
        }
        .list-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .list-info {
            flex: 1;
            min-width: 0;
        }
        .list-info .primary {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-info .secondary {
            font-size: 0.62rem;
            color: var(--color-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-badge {
            font-size: 0.5rem;
            background: var(--color-gold-bg);
            color: var(--color-primary);
            padding: 0 10px;
            border-radius: var(--radius-full);
            font-weight: 600;
            flex-shrink: 0;
            border: 1px solid rgba(245, 179, 0, 0.15);
            white-space: nowrap;
        }
        .list-empty {
            text-align: center;
            padding: 32px 16px;
            color: var(--color-text-muted);
            grid-column: 1 / -1;
        }
        .list-empty .icon {
            font-size: 2rem;
            margin-bottom: 8px;
            opacity: 0.3;
        }
        .list-empty p {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .list-empty .sub {
            font-size: 0.7rem;
            color: var(--color-text-muted);
        }
        .list-back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 16px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: var(--font);
            font-size: 0.7rem;
        }
        .list-back-btn:hover {
            background: var(--color-primary-light);
        }

        /* ============================================================
           DETAIL VIEW
           ============================================================ */
        .detail-view {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .detail-view.active {
            display: block;
        }

        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--color-border);
            text-align: center;
        }
        .detail-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--color-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            overflow: hidden;
            border: 3px solid var(--color-gold);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
            position: relative;
        }
        .detail-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-name h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--color-text);
        }
        .detail-name .sub {
            font-size: 0.68rem;
            color: var(--color-text-muted);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .detail-item {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
        }
        .detail-item .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .detail-item .value {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--color-text);
            word-break: break-word;
        }
        .detail-item .value a {
            color: var(--color-primary);
            text-decoration: none;
        }
        .detail-item .value a:hover {
            text-decoration: underline;
        }

        .detail-relations {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border);
        }
        .detail-relations h4 {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
        }
        .relation-chip {
            display: inline-block;
            background: var(--color-gold-bg);
            color: var(--color-primary);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 0.65rem;
            font-weight: 500;
            margin: 2px 4px 2px 0;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .relation-chip:hover {
            background: var(--color-primary);
            color: #fff;
        }

        .detail-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--color-border);
            flex-wrap: wrap;
        }
        .detail-actions button {
            padding: 6px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font);
        }
        .btn-edit {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-edit:hover {
            background: var(--color-primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-delete {
            background: #fff;
            color: var(--color-danger);
            border: 1.5px solid var(--color-danger);
        }
        .btn-delete:hover {
            background: var(--color-danger);
            color: #fff;
        }

        /* ============================================================
           FORM VIEW
           ============================================================ */
        .form-view {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .form-view.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 2px;
            letter-spacing: 0.2px;
        }
        .form-group label .required {
            color: var(--color-danger);
            margin-left: 2px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-family: var(--font);
            background: var(--color-white);
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--color-text);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 61, 46, 0.06);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 44px;
        }
        .form-group input[readonly] {
            background: var(--color-bg);
            cursor: not-allowed;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--color-border);
        }
        .form-section h4 {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .form-section h4 .toggle-icon {
            transition: transform 0.2s;
            font-size: 0.8rem;
            margin-left: auto;
        }
        .form-section h4 .toggle-icon.open {
            transform: rotate(180deg);
        }
        .form-section .section-body {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.25s ease;
            max-height: 0;
            opacity: 0;
        }
        .form-section .section-body.open {
            max-height: 2000px;
            opacity: 1;
        }

        .photo-upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            border: 2px dashed var(--color-border);
            transition: border-color 0.2s;
            position: relative;
        }
        .photo-upload-area.dragover {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }
        .photo-upload-area .photo-preview-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--color-gold);
            box-shadow: var(--shadow-sm);
            background: var(--color-white);
            flex-shrink: 0;
        }
        .photo-upload-area .photo-preview-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-upload-area .photo-preview-wrap .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--color-text-muted);
            font-size: 2.2rem;
            background: var(--color-bg);
        }
        .photo-upload-area .photo-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            width: 100%;
        }
        .photo-upload-area .photo-controls button,
        .photo-upload-area .photo-controls label {
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--color-border);
            background: var(--color-white);
            color: var(--color-text-secondary);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .photo-upload-area .photo-controls button:hover,
        .photo-upload-area .photo-controls label:hover {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }
        .photo-upload-area .photo-controls button.danger:hover {
            background: var(--color-danger);
            border-color: var(--color-danger);
        }
        .photo-upload-area .photo-controls input[type="file"] {
            display: none;
        }
        .photo-upload-area .photo-filename {
            font-size: 0.55rem;
            color: var(--color-text-muted);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .crop-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 16px;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease;
        }
        .crop-overlay.active {
            display: flex;
        }
        .crop-modal {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: 16px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.25s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .crop-modal h3 {
            font-size: 0.85rem;
            color: var(--color-text);
            margin-bottom: 6px;
            text-align: center;
        }
        .crop-modal .crop-canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background: #1a1a2e;
            border-radius: var(--radius-sm);
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }
        .crop-modal .crop-canvas-wrap:active {
            cursor: grabbing;
        }
        .crop-modal .crop-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .crop-modal .crop-canvas-wrap .crop-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .crop-modal .crop-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            padding: 8px 0 4px;
        }
        .crop-modal .crop-controls label {
            font-size: 0.55rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .crop-modal .crop-controls input[type="range"] {
            width: 80px;
            accent-color: var(--color-primary);
        }
        .crop-modal .crop-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            padding-top: 8px;
            border-top: 1px solid var(--color-border);
        }
        .crop-modal .crop-actions button {
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.68rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: var(--font);
        }
        .crop-modal .crop-actions .crop-cancel {
            background: var(--color-white);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }
        .crop-modal .crop-actions .crop-cancel:hover {
            background: var(--color-bg);
        }
        .crop-modal .crop-actions .crop-apply {
            background: var(--color-primary);
            color: #fff;
        }
        .crop-modal .crop-actions .crop-apply:hover {
            background: var(--color-primary-light);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .form-actions button {
            padding: 6px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.76rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            flex: 1;
            min-width: 80px;
            font-family: var(--font);
        }
        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--color-primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-secondary {
            background: var(--color-white);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }
        .btn-secondary:hover {
            background: var(--color-bg);
        }

        .dynamic-fields {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--color-border);
        }
        .dynamic-fields h4 {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
        }
        .dynamic-field {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .dynamic-field:hover {
            border-color: var(--color-primary-lighter);
        }
        .dynamic-field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .dynamic-field-header strong {
            font-size: 0.65rem;
            color: var(--color-text-secondary);
        }
        .dynamic-field-header .delete-field {
            background: none;
            border: none;
            color: var(--color-danger);
            font-weight: 600;
            font-size: 0.6rem;
            cursor: pointer;
            padding: 0 6px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, color 0.15s;
            font-family: var(--font);
        }
        .dynamic-field-header .delete-field:hover {
            background: var(--color-danger);
            color: #fff;
        }
        .add-field-btn {
            background: var(--color-white);
            border: 2px dashed var(--color-primary);
            color: var(--color-primary);
            padding: 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-size: 0.7rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .add-field-btn:hover {
            background: var(--color-gold-bg);
            border-style: solid;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: 20px 18px;
            max-width: 380px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.25s ease;
        }
        @keyframes scaleIn {
            from {
                transform: scale(0.92);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal h3 {
            font-size: 0.9rem;
            color: var(--color-text);
            margin-bottom: 4px;
        }
        .modal p {
            color: var(--color-text-secondary);
            margin-bottom: 14px;
            line-height: 1.5;
            font-size: 0.78rem;
        }
        .modal-buttons {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        .modal-buttons button {

    <!-- ============================================================
