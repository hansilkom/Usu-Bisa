                    const tomorrow = new Date(now.getTime() + 86400000);
                    const tomorrowDateStr = getLocalDateString(tomorrow);
                    const reminders = [];

                    const allMatkul = this.get('matkul');
                    allMatkul.forEach(m => {
                        if (!m.hari) return;
                        const hariIdx = DAY_NAMES.indexOf(m.hari);
                        if (hariIdx === -1) return;
                        const todayIdx = now.getDay();
                        const diff = (hariIdx - todayIdx + 7) % 7;

                        if (diff === 0 || diff === 1) {
                            const namaMatkul = escapeHTML(m.nama || 'Mata Kuliah');
                            const jam = m.jamMasuk ? `pukul ${escapeHTML(m.jamMasuk)}` : '';
                            const selesai = m.jamSelesai ? `–${escapeHTML(m.jamSelesai)}` : '';
                            const dosenId = m.dosenId;
                            const dosenNama = dosenId ? escapeHTML(this.getDosenName(dosenId)) : '';
                            const desc = `${dosenNama ? 'Dosen: '+dosenNama : ''} ${jam} ${selesai}`.trim();
                            const priority = diff === 0 ? 0 : 1;
                            const tag = diff === 0 ? 'Hari Ini' : 'Besok';
                            const dateStr = diff === 0 ? todayDateStr : tomorrowDateStr;
                            reminders.push({
                                id: 'matkul-' + m.id + (diff === 0 ? '' : '-tomorrow'),
                                priority: priority,
                                sortKey: m.jamMasuk || '00:00',
                                type: 'matkul',
                                icon: 'bi-calendar-event',
                                iconColor: diff === 0 ? 'var(--color-danger)' : 'var(--color-warning)',
                                title: diff === 0 ? `Hari ini ada ${namaMatkul}` : `Besok ada ${namaMatkul}`,
                                description: desc,
                                module: 'matkul',
                                sourceId: m.id,
                                tag: tag,
                                tanggalKejadian: dateStr
                            });
                        }
                    });

                    const allTugas = this.get('tugas');
                    allTugas.forEach(t => {
                        if (!t.deadline) return;
                        const deadline = t.deadline;
                        const matkul = this.find('matkul', t.matkulId);
                        const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(t.matkul || 'Mata Kuliah');

                        const deadlineDate = getLocalDate(deadline);
                        if (!deadlineDate) return;
                        const today = new Date(now);
                        today.setHours(0,0,0,0);
                        const tomorrow = new Date(today.getTime() + 86400000);

                        const isToday = isSameDay(deadlineDate, today);
                        const isTomorrow = isSameDay(deadlineDate, tomorrow);
                        const isPast = deadlineDate < today;

                        if (isToday) {
                            reminders.push({
                                id: 'tugas-' + t.id,
                                priority: 0,
                                sortKey: '00:00',
                                type: 'tugas',
                                icon: 'bi-exclamation-triangle-fill',
                                iconColor: 'var(--color-danger)',
                                title: `Deadline tugas: ${escapeHTML(t.nama || 'Tugas')}`,
                                description: `${namaMatkul} — deadline hari ini`,
                                module: 'tugas',
                                sourceId: t.id,
                                tag: 'Hari Ini',
                                tanggalKejadian: todayDateStr
                            });
                        } else if (isTomorrow) {
                            reminders.push({
                                id: 'tugas-' + t.id + '-tomorrow',
                                priority: 1,
                                sortKey: '00:00',
                                type: 'tugas',
                                icon: 'bi-exclamation-circle-fill',
                                iconColor: 'var(--color-warning)',
                                title: `Deadline tugas: ${escapeHTML(t.nama || 'Tugas')}`,
                                description: `${namaMatkul} — deadline besok`,
                                module: 'tugas',
                                sourceId: t.id,
                                tag: 'Besok',
                                tanggalKejadian: tomorrowDateStr
                            });
                        } else if (isPast) {
                            reminders.push({
                                id: 'tugas-' + t.id + '-past',
                                priority: 2,
                                sortKey: '00:00',
                                type: 'tugas',
                                icon: 'bi-check-circle',
                                iconColor: 'var(--color-text-muted)',
                                title: `Tugas ${escapeHTML(t.nama || 'Tugas')} telah lewat`,
                                description: `${namaMatkul} — deadline ${escapeHTML(deadline)}`,
                                module: 'tugas',
                                sourceId: t.id,
                                tag: 'Lewat',
                                tanggalKejadian: deadline
                            });
                        }
                    });

                    const allDosen = this.get('dosen');
                    allDosen.forEach(d => {
                        if (!d.tanggalLahir) return;
                        const tgl = getLocalDate(d.tanggalLahir);
                        if (!tgl) return;
                        const today = new Date(now);
                        today.setHours(0,0,0,0);
                        const tomorrow = new Date(today.getTime() + 86400000);

                        const isBirthdayToday = tgl.getMonth() === today.getMonth() && tgl.getDate() === today
                            .getDate();
                        const isBirthdayTomorrow = tgl.getMonth() === tomorrow.getMonth() && tgl.getDate() ===
                            tomorrow.getDate();
                        const nama = escapeHTML(d.nama || 'Dosen');
                        const tglStr = d.tanggalLahir;
                        if (isBirthdayToday) {
                            reminders.push({
                                id: 'ultah-' + d.id,
                                priority: 0,
                                sortKey: '00:00',
                                type: 'ultah',
                                icon: 'bi-gift',
                                iconColor: 'var(--color-gold)',
                                title: `🎂 Hari ini ulang tahun ${nama}`,
                                description: `Selamat ulang tahun, ${nama}!`,
                                module: 'dosen',
                                sourceId: d.id,
                                tag: 'Hari Ini',
                                tanggalKejadian: todayDateStr
                            });
                        } else if (isBirthdayTomorrow) {
                            reminders.push({
                                id: 'ultah-' + d.id + '-tomorrow',
                                priority: 1,
                                sortKey: '00:00',
                                type: 'ultah',
                                icon: 'bi-gift',
                                iconColor: 'var(--color-gold)',
                                title: `🎂 Besok ulang tahun ${nama}`,
                                description: `Jangan lupa ucapkan selamat!`,
                                module: 'dosen',
                                sourceId: d.id,
                                tag: 'Besok',
                                tanggalKejadian: tomorrowDateStr
                            });
                        } else {
                            const diffDays = Math.floor((today.getTime() - tgl.getTime()) / (24 * 60 * 60 * 1000));
                            if (diffDays > 0 && diffDays <= 7) {
                                reminders.push({
                                    id: 'ultah-' + d.id + '-past',
                                    priority: 2,
                                    sortKey: '00:00',
                                    type: 'ultah',
                                    icon: 'bi-gift',
                                    iconColor: 'var(--color-text-muted)',
                                    title: `🎂 Ulang tahun ${nama} telah lewat`,
                                    description: `Semoga panjang umur dan sehat selalu!`,
                                    module: 'dosen',
                                    sourceId: d.id,
                                    tag: 'Lewat',
                                    tanggalKejadian: tglStr
                                });
                            }
                        }
                    });

                    return reminders;
                }

                _calculateEndTime(startTime, sks) {
                    if (!startTime || !sks) return null;
                    const parts = startTime.split(':');
                    if (parts.length !== 2) return null;
                    let hours = parseInt(parts[0]);
                    let minutes = parseInt(parts[1]);
                    if (isNaN(hours) || isNaN(minutes)) return null;
                    const totalMinutes = hours * 60 + minutes + sks * 50;
                    const endHours = Math.floor(totalMinutes / 60) % 24;
                    const endMinutes = totalMinutes % 60;
                    return `${String(endHours).padStart(2, '0')}:${String(endMinutes).padStart(2, '0')}`;
                }

                get(module) { return this.data[module] || []; }
                set(module, items) {
                    this.data[module] = items;
                    Storage.save(module, items);
                }
                push(module, item) {
                    const arr = this.get(module);
                    arr.push(item);
                    this.set(module, arr);
                    return item;
                }
                update(module, id, payload) {
                    const arr = this.get(module);
                    const idx = findIndexById(arr, id);
                    if (idx === -1) return null;
                    arr[idx] = { ...arr[idx], ...payload };
                    this.set(module, arr);
                    return arr[idx];
                }
                remove(module, id) {
                    const arr = this.get(module);
                    const idx = findIndexById(arr, id);
                    if (idx === -1) return null;
                    const removed = arr.splice(idx, 1)[0];
                    this.set(module, arr);
                    return removed;
                }
                find(module, id) { return findById(this.get(module), id); }

                // ---- RELATIONS ----
                getMatkulByDosen(dosenId) {
                    return this.get('matkul').filter(m => m.dosenId === dosenId);
                }
                getKontrakByMatkul(matkulId) {
                    return this.get('kontrak').filter(k => k.matkulId === matkulId);
                }
                getTugasByMatkul(matkulId) {
                    return this.get('tugas').filter(t => t.matkulId === matkulId);
                }
                getJadwalByMatkul(matkulId) {
                    return this.get('jadwal').filter(j => j.matkulId === matkulId);
                }
                getJadwalByHari(hari) {
                    return this.get('jadwal').filter(j => j.hari === hari);
                }
                getTugasByDosen(dosenId) {
                    const matkulIds = this.getMatkulByDosen(dosenId).map(m => m.id);
                    return this.get('tugas').filter(t => matkulIds.includes(t.matkulId));
                }
                getKontrakByDosen(dosenId) {
                    return this.get('kontrak').filter(k => k.dosenId === dosenId);
                }
                getJadwalByDosen(dosenId) {
                    const matkulIds = this.getMatkulByDosen(dosenId).map(m => m.id);
                    return this.get('jadwal').filter(j => matkulIds.includes(j.matkulId));
                }
                getMatkulByTugas(tugasId) {
                    const tugas = this.find('tugas', tugasId);
                    if (!tugas || !tugas.matkulId) return null;
                    return this.find('matkul', tugas.matkulId);
                }
                getDosenByTugas(tugasId) {
                    const matkul = this.getMatkulByTugas(tugasId);
                    if (!matkul) return null;
                    return this.find('dosen', matkul.dosenId);
                }
                getTugasByKontrak(kontrakId) {
                    const kontrak = this.find('kontrak', kontrakId);
                    if (!kontrak || !kontrak.matkulId) return [];
                    return this.getTugasByMatkul(kontrak.matkulId);
                }

                stats() {
                    return {
                        dosen: this.get('dosen').length,
                        matkul: this.get('matkul').length,
                        tugas: this.get('tugas').length,
                        kontrak: this.get('kontrak').length,
                        jadwal: this.get('jadwal').length,
                        notes: this.get('notes').length
                    };
                }

                getSettings() { return this.settings; }
                updateSettings(payload) {
                    this.settings = { ...this.settings, ...payload };
                    Storage.saveSettings(this.settings);
                    return this.settings;
                }

                // ---- ARCHIVE ----
                getArchive() { return this.archive; }
                setArchive(items) {
                    this.archive = items;
                    Storage.saveArchive(items);
                }
                pushArchive(item) {
                    const exists = this.archive.some(a => a.id === item.id);
                    if (!exists) {
                        this.archive.push(item);
                        Storage.saveArchive(this.archive);
                    }
                    return item;
                }
                removeArchive(id) {
                    const idx = findIndexById(this.archive, id);
                    if (idx === -1) return null;
                    const removed = this.archive.splice(idx, 1)[0];
                    Storage.saveArchive(this.archive);
                    return removed;
                }
                findArchive(id) {
                    return findById(this.archive, id);
                }

                // ---- EXPORT/IMPORT ----
                exportModule(module) {
                    return this.get(module);
                }

                importModule(module, data) {
                    if (!Array.isArray(data)) throw new Error('Data harus berupa array.');
                    const migrated = data.map(item => {
                        const newItem = { ...item };
                        if (module === 'matkul') {
                            if (!('jamMasuk' in newItem)) newItem.jamMasuk = null;
                            if (!('jamSelesai' in newItem)) newItem.jamSelesai = null;
                            if (!('hari' in newItem)) newItem.hari = null;
                            if (!('dosenId' in newItem)) newItem.dosenId = null;
                            if (newItem.jamMasuk && typeof newItem.jamMasuk === 'string' && newItem.jamMasuk
                                .includes('.')) {
                                newItem.jamMasuk = newItem.jamMasuk.replace('.', ':');
                            }
                            if (newItem.jamMasuk && newItem.sks) {
                                newItem.jamSelesai = this._calculateEndTime(newItem.jamMasuk, newItem.sks);
                            }
                        }
                        if (module === 'tugas' && !('dosenId' in newItem)) {
                            newItem.dosenId = null;
                        }
                        if (module === 'jadwal' && !('dosenId' in newItem)) {
                            newItem.dosenId = null;
                        }
                        if (module === 'kontrak' && !('dosenId' in newItem)) {
                            newItem.dosenId = null;
                        }
                        return newItem;
                    });
                    const valid = migrated.every(item => item && typeof item === 'object' && item.id);
                    if (!valid) {
                        throw new Error(
                            'Format data tidak valid. Setiap item harus memiliki properti "id".');
                    }
                    const existing = this.get(module);
                    const existingIds = new Set(existing.map(item => item.id));
                    let added = 0;
                    migrated.forEach(item => {
                        if (!existingIds.has(item.id)) {
                            existing.push(item);
                            added++;
                        }
                    });
                    this.set(module, existing);
                    return added;
                }

                // ---- FOTO DOSEN ----
                getDosenPhoto(dosenId) {
                    if (!dosenId) return null;
                    const dosen = this.find('dosen', dosenId);
                    return dosen && dosen.foto ? dosen.foto : null;
                }
                getDosenName(dosenId) {
                    if (!dosenId) return '';
                    const dosen = this.find('dosen', dosenId);
                    return dosen ? dosen.nama : '';
                }
                getDosenNip(dosenId) {
                    if (!dosenId) return '';
                    const dosen = this.find('dosen', dosenId);
                    return dosen ? dosen.nip || '' : '';
                }
                getDosenJabatan(dosenId) {
                    if (!dosenId) return '';
                    const dosen = this.find('dosen', dosenId);
                    return dosen ? dosen.jabatan || '' : '';
                }
                getDosenFakultas(dosenId) {
                    if (!dosenId) return '';
                    const dosen = this.find('dosen', dosenId);
                    return dosen ? dosen.fakultas || '' : '';
                }
                getDosenProdi(dosenId) {
                    if (!dosenId) return '';
                    const dosen = this.find('dosen', dosenId);
                    return dosen ? dosen.prodi || '' : '';
                }

                getDisplayName(module, id) {
                    if (!id) return 'Belum dipilih';
                    const item = this.find(module, id);
                    if (!item) return 'Data tidak ditemukan';
                    return item.nama || item.judul || item.matkul || item.title || item.label || 'Tanpa nama';
                }
            }

            // ================================================================
            //  NOTIF, MODAL, CROP, LIGHTBOX, LIHAT (minor perbaikan)
            // ================================================================
            const Notif = {
                container: document.getElementById('notifContainer'),
                show(message, type = 'info') {
                    const container = this.container;
                    while (container.children.length >= 3) container.removeChild(container.firstChild);
                    const el = document.createElement('div');
                    el.className = `notif ${type}`;
                    const icons = { success: 'bi-check-circle', error: 'bi-exclamation-circle',
                        info: 'bi-info-circle' };
                    const icon = icons[type] || 'bi-info-circle';
                    el.innerHTML =
                        `<i class="bi ${icon}"></i><span>${escapeHTML(message)}</span><button class="close" onclick="this.parentElement.remove()" aria-label="Tutup notifikasi"><i class="bi bi-x-lg"></i></button>`;
                    container.appendChild(el);
                    setTimeout(() => { if (el.parentElement) el.remove(); }, 3500);
                },
                success(msg) { this.show(msg, 'success'); },
                error(msg) { this.show(msg, 'error'); },
                info(msg) { this.show(msg, 'info'); }
            };

            const Modal = {
                overlay: document.getElementById('modalOverlay'),
                title: document.getElementById('modalTitle'),
                message: document.getElementById('modalMessage'),
                confirmBtn: document.getElementById('modalConfirm'),
                cancelBtn: document.getElementById('modalCancel'),
                _callback: null,

                open(title, message, onConfirm) {
                    this.title.textContent = title || 'Konfirmasi';
                    this.message.textContent = message || 'Apakah Anda yakin?';
                    this._callback = onConfirm || null;
                    this.overlay.classList.add('active');
                    setTimeout(() => this.confirmBtn.focus(), 50);
                },
                close() {
                    this.overlay.classList.remove('active');
                    this._callback = null;
                    document.getElementById('actionBtn')?.focus();
                },
                confirm() {
                    if (this._callback) this._callback();
                    this.close();
                },
                init() {
                    this.cancelBtn.addEventListener('click', () => this.close());
                    this.confirmBtn.addEventListener('click', () => this.confirm());
                    this.overlay.addEventListener('click', (e) => {
                        if (e.target === this.overlay) this.close();
                    });
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.overlay.classList.contains('active')) {
                            this.close();
                        }
                    });
                }
            };

            // ================================================================
            //  LIHAT MODAL (v6.0)
            // ================================================================
            const LihatModal = {
                overlay: document.getElementById('lihatModalOverlay'),
                grid: document.getElementById('lihatGrid'),
                actions: document.getElementById('lihatActions'),
                _callback: null,
                _reminderId: null,
                _isFromReminder: false,

                init() {
                    this.overlay.addEventListener('click', (e) => {
                        if (e.target === this.overlay) this.close();
                    });
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.overlay.classList.contains('active')) {
                            this.close();
                        }
                    });
                },

                openForReminder(activeModules, callback, reminderId) {
                    this._isFromReminder = true;
                    this._callback = callback || null;
                    this._reminderId = reminderId || null;

                    const currentModule = window.app ? window.app.currentModule : null;
                    const filtered = activeModules.filter(mod => mod.key !== currentModule);

                    this._renderGrid(filtered);
                    this._renderActions(true);
                    this.overlay.classList.add('active');
                    setTimeout(() => this.actions.querySelector('.lihat-close')?.focus(), 50);
                },

                openForRelation(relationData) {
                    this._isFromReminder = false;
                    this._callback = null;
                    this._reminderId = null;

                    const currentModule = window.app ? window.app.currentModule : null;

                    const allModules = [
                        { key: 'dosen', label: 'Dosen', icon: 'bi-person-badge' },
                        { key: 'matkul', label: 'Mata Kuliah', icon: 'bi-book' },
                        { key: 'kontrak', label: 'Kontrak Kuliah', icon: 'bi-clipboard' },
                        { key: 'tugas', label: 'Tugas', icon: 'bi-file-text' },
                        { key: 'jadwal', label: 'Jadwal', icon: 'bi-calendar' }
                    ];

                    const filteredModules = allModules.filter(def => def.key !== currentModule);

                    const merged = filteredModules.map(def => {
                        const found = relationData.find(r => r.key === def.key);
                        return {
                            ...def,
                            count: found ? found.count : 0,
                            items: found ? found.items : [],
                            active: found ? found.count > 0 : false
                        };
                    });

                    this._renderGrid(merged);
                    this._renderActions(false);
                    this.overlay.classList.add('active');
                    setTimeout(() => this.actions.querySelector('.lihat-close')?.focus(), 50);
                },

                _renderGrid(mods) {
                    this.grid.innerHTML = '';
                    mods.forEach(mod => {
                        const item = document.createElement('button');
                        const isActive = mod.count > 0;
                        item.className = `lihat-item ${isActive ? 'active' : 'inactive'}`;
                        const countBadge = `<span class="count-badge">${mod.count}</span>`;
                        item.innerHTML = `<i class="bi ${mod.icon}"></i> ${mod.label} ${countBadge}`;
                        item.disabled = !isActive;
                        if (isActive) {
                            item.addEventListener('click', () => {
                                this.close();
                                const listItems = mod.items.map(it => ({
                                    id: it.id,
                                    label: it.nama || it.judul || it.matkul || it.label || 'Tanpa nama',
                                    icon: MODULE_ICONS[mod.key] || 'bi-file-text'
                                }));
                                requestAnimationFrame(() => {
                                    LihatPilihan.open(`Pilih ${mod.label}`, listItems, (id) => {
                                        if (this._isFromReminder && this._callback) {
                                            this._callback(mod.key, id);
                                        } else {
                                            if (window.app) {
                                                window.app.openDetail(mod.key, id);
                                                Notif.success(`Membuka ${MODULE_LABELS[mod.key]}`);
                                            }
                                        }
                                    });
                                });
                            });
                        }
                        this.grid.appendChild(item);
                    });
                },

                _renderActions(showArchiveAndDelete) {
                    this.actions.innerHTML = '';
                    if (showArchiveAndDelete) {
                        const archiveBtn = document.createElement('button');
                        archiveBtn.className = 'lihat-archive';
                        archiveBtn.innerHTML = '<i class="bi bi-archive"></i> Arsip';
                        archiveBtn.addEventListener('click', () => {
                            if (this._reminderId) {
                                window.app.archiveReminder(this._reminderId);
                                this.close();
                            }
                        });
                        this.actions.appendChild(archiveBtn);

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'lihat-delete';
                        deleteBtn.innerHTML = '<i class="bi bi-trash"></i> Hapus';
                        deleteBtn.addEventListener('click', () => {
                            this.close();
                            setTimeout(() => {
                                if (this._reminderId) {
                                    Modal.open('Hapus Permanen',
                                        'Apakah Anda yakin ingin menghapus pemberitahuan ini?',
                                        () => {
                                            window.app.deleteReminderPermanen(this
                                                ._reminderId);
                                        }
                                    );
                                }
                            }, 100);
                        });
                        this.actions.appendChild(deleteBtn);
                    }

                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'lihat-close';
                    closeBtn.textContent = 'Tutup';
                    closeBtn.addEventListener('click', () => this.close());
                    this.actions.appendChild(closeBtn);
                },

                close() {
                    this.overlay.classList.remove('active');
                    this._callback = null;
                    this._reminderId = null;
                    this._isFromReminder = false;
                }
            };

            // ================================================================
            //  LIHAT PILIHAN (v6.0)
            // ================================================================
            const LihatPilihan = {
                overlay: document.getElementById('lihatPilihanOverlay'),
                list: document.getElementById('pilihanList'),
                sub: document.getElementById('pilihanSub'),
                closeBtn: document.getElementById('pilihanClose'),
                _callback: null,

                init() {
                    this.closeBtn.addEventListener('click', () => this.close());
                    this.overlay.addEventListener('click', (e) => {
                        if (e.target === this.overlay) this.close();
                    });
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.overlay.classList.contains('active')) {
                            this.close();
                        }
                    });
                },

                open(title, items, callback) {
                    this._callback = null;
                    this._callback = callback || null;
                    this.sub.textContent = title || 'Beberapa item tersedia:';

                    this.list.innerHTML = '';
                    items.forEach(item => {
                        const el = document.createElement('div');
                        el.className = 'pilihan-item';
                        el.innerHTML =
                            `<i class="bi ${item.icon || 'bi-file-text'}"></i> <span>${escapeHTML(item.label)}</span>`;
                        el.addEventListener('click', () => {
                            const cb = this._callback;
                            this.close();
                            if (cb) {
                                cb(item.id);
                            }
                        });
                        this.list.appendChild(el);
                    });

                    this.overlay.classList.add('active');
                    setTimeout(() => this.closeBtn.focus(), 50);
                },

                close() {
                    this.overlay.classList.remove('active');
                    this._callback = null;
                }
            };

            // ================================================================
            //  CROP TOOL (tidak berubah)
            // ================================================================
            const CropTool = {
                overlay: document.getElementById('cropOverlay'),
                canvas: document.getElementById('cropCanvas'),
                wrap: document.getElementById('cropWrap'),
                zoomSlider: document.getElementById('cropZoom'),
                cancelBtn: document.getElementById('cropCancel'),
                applyBtn: document.getElementById('cropApply'),
                _image: null,
                _zoom: 1,
                _offsetX: 0,
                _offsetY: 0,
                _isDragging: false,
                _dragStartX: 0,
                _dragStartY: 0,
                _startOffX: 0,
                _startOffY: 0,
                _callback: null,
                _ctx: null,

                init() {
                    this._ctx = this.canvas.getContext('2d');
                    this.zoomSlider.addEventListener('input', () => {
                        this._zoom = parseFloat(this.zoomSlider.value);
                        this._render();
                    });
                    this.cancelBtn.addEventListener('click', () => this.close());
                    this.applyBtn.addEventListener('click', () => this.apply());

                    const startDrag = (cx, cy) => {
                        if (!this._image) return;
                        const rect = this.canvas.getBoundingClientRect();
                        this._isDragging = true;
                        this._dragStartX = cx;
                        this._dragStartY = cy;
                        this._startOffX = this._offsetX;
                        this._startOffY = this._offsetY;
                        this.canvas.style.cursor = 'grabbing';
                    };
                    const moveDrag = (cx, cy) => {
                        if (!this._isDragging) return;
                        const dx = cx - this._dragStartX;
                        const dy = cy - this._dragStartY;
                        const rect = this.canvas.getBoundingClientRect();
                        const scale = this._zoom;
                        this._offsetX = this._startOffX + dx / (rect.width / 2) / scale;
                        this._offsetY = this._startOffY + dy / (rect.height / 2) / scale;
                        this._render();
                    };
                    const endDrag = () => {
                        this._isDragging = false;
                        this.canvas.style.cursor = 'grab';
                    };

                    this.canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
                    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
                    window.addEventListener('mouseup', endDrag);

                    this.canvas.addEventListener('touchstart', (e) => {
                        const t = e.touches[0];
                        startDrag(t.clientX, t.clientY);
                    }, { passive: true });
                    this.canvas.addEventListener('touchmove', (e) => {
                        if (this._isDragging) {
                            const t = e.touches[0];
                            moveDrag(t.clientX, t.clientY);
                        }
                    }, { passive: true });
                    this.canvas.addEventListener('touchend', endDrag, { passive: true });

                    this.canvas.addEventListener('wheel', (e) => {
                        e.preventDefault();
                        const delta = e.deltaY > 0 ? -0.05 : 0.05;
                        let newZoom = this._zoom + delta;
                        newZoom = Math.max(0.5, Math.min(3, newZoom));
                        this.zoomSlider.value = newZoom;
                        this._zoom = newZoom;
                        this._render();
                    }, { passive: false });

                    this.canvas.addEventListener('dblclick', () => {
                        this.zoomSlider.value = 1;
                        this._zoom = 1;
                        this._offsetX = 0;
                        this._offsetY = 0;
                        this._render();
                    });

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.overlay.classList.contains('active')) {
                            this.close();
                        }
                    });
                },

                _render() {
                    if (!this._image || !this._ctx) return;
                    const canvas = this.canvas;
                    const rect = canvas.parentElement.getBoundingClientRect();
                    const size = Math.min(rect.width - 2, rect.height - 2);
                    canvas.width = size * window.devicePixelRatio;
                    canvas.height = size * window.devicePixelRatio;
                    canvas.style.width = size + 'px';
                    canvas.style.height = size + 'px';

                    const ctx = this._ctx;
                    const w = canvas.width;
                    const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);

                    const imgW = this._image.width;
                    const imgH = this._image.height;
                    const zoom = this._zoom;
                    const scale = Math.min(w / imgW, h / imgH) * zoom;
                    const drawW = imgW * scale;
                    const drawH = imgH * scale;
                    const ox = (w - drawW) / 2 + this._offsetX * w / 2;
                    const oy = (h - drawH) / 2 + this._offsetY * h / 2;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(w / 2, h / 2, w / 2 * 0.7, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this._image, ox, oy, drawW, drawH);
                    ctx.restore();
                },

                open(imageData, callback) {
                    const img = new Image();
                    img.onload = () => {
                        this._image = img;
                        this._zoom = 1;
                        this._offsetX = 0;
                        this._offsetY = 0;
                        this.zoomSlider.value = 1;
                        this._callback = callback;
                        this.overlay.classList.add('active');
                        this._render();
                        this.canvas.style.cursor = 'grab';
                        setTimeout(() => this.applyBtn.focus(), 50);
                    };
                    img.src = imageData;
                },

                close() {
                    this.overlay.classList.remove('active');
                    this._image = null;
                    this._callback = null;
                },

                async apply() {
                    if (!this._image || !this._callback) return;
                    const canvas = this.canvas;
                    const w = canvas.width;
                    const h = canvas.height;
                    const size = Math.min(w, h) * 0.7;
                    const cx = w / 2;
                    const cy = h / 2;
                    const half = size / 2;

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = size;
                    tempCanvas.height = size;
                    const tCtx = tempCanvas.getContext('2d');
                    tCtx.beginPath();
                    tCtx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    tCtx.clip();
                    tCtx.drawImage(canvas, cx - half, cy - half, size, size, 0, 0, size, size);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.85);
                    const compressed = await compressImage(dataUrl, 200);
                    this._callback(compressed);
                    this.close();
                }
            };

            const Lightbox = {
                overlay: document.getElementById('photoLightbox'),
                img: document.getElementById('lightboxImg'),
                closeBtn: document.getElementById('lightboxClose'),

                init() {
                    this.closeBtn.addEventListener('click', () => this.close());
                    this.overlay.addEventListener('click', (e) => {
                        if (e.target === this.overlay) this.close();
                    });
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.overlay.classList.contains('active')) {
                            this.close();
                        }
                    });
                },

                open(src, alt = 'Foto') {
                    this.img.src = src;
                    this.img.alt = alt || 'Foto';
                    this.overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    setTimeout(() => this.closeBtn.focus(), 50);
                },

                close() {
                    this.overlay.classList.remove('active');
                    document.body.style.overflow = '';
                    this.img.src = '';
                }
            };

            // ================================================================
            //  APP (v6.0)
            // ================================================================
            class App {
                constructor() {
                    this.state = new AppState();
                    this.currentModule = 'dashboard';
                    this.currentView = 'list';
                    this.selectedId = null;
                    this.editingId = null;
                    this.searchQuery = '';
                    this.searchResults = null;
                    this.navStack = [];
                    this.briefingDismissed = false;
                    this._photoData = null;
                    this._formChanged = false;
                    this._rootContext = null;
                    this._searchDebounceTimer = null;
                    this._init();
                }

                _init() {
                    document.querySelectorAll('.landing-menu .menu-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const mod = btn.dataset.module;
                            this._rootContext = mod;
                            this.navigate(mod, 'list');
                        });
                    });

                    document.getElementById('backBtn').addEventListener('click', () => this.goBack());
                    document.getElementById('homeBtn').addEventListener('click', () => this.goHome());
                    document.getElementById('actionBtn').addEventListener('click', () => this.handleAction());

                    // Search dengan debounce
                    const searchInput = document.getElementById('globalSearch');
                    const searchSubmit = document.getElementById('searchSubmit');
                    const clearSearchBtn = document.getElementById('clearSearch');

                    const doSearch = () => this.performSearch();
                    searchSubmit.addEventListener('click', doSearch);
                    searchInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            if (this._searchDebounceTimer) {
                                clearTimeout(this._searchDebounceTimer);
                                this._searchDebounceTimer = null;
                            }
                            doSearch();
                        }
                    });
                    searchInput.addEventListener('input', () => {
                        if (this._searchDebounceTimer) {
                            clearTimeout(this._searchDebounceTimer);
                        }
                        this._searchDebounceTimer = setTimeout(() => {
                            this._searchDebounceTimer = null;
                            const val = searchInput.value.trim();
                            if (val === '') {
                                this.clearSearch();
                            } else {
                                doSearch();
                            }
                        }, 350);
                    });
                    clearSearchBtn.addEventListener('click', () => this.clearSearch());

                    // IO Dropdown
                    const ioToggle = document.getElementById('ioToggle');
                    const ioMenu = document.getElementById('ioMenu');
                    ioToggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        ioMenu.classList.toggle('open');
                    });
                    document.addEventListener('click', () => { ioMenu.classList.remove('open'); });
                    document.getElementById('ioExport').addEventListener('click', () => this.exportCurrentModule());
                    document.getElementById('ioImport').addEventListener('click', () => {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = '.json';
                        input.onchange = (e) => this.importCurrentModule(e);
                        input.click();
                    });

                    window.addEventListener('popstate', (e) => {
                        if (this.navStack.length > 1) {
                            this.navStack.pop();
                            const prev = this.navStack[this.navStack.length - 1];
                            if (prev) {
                                this.currentModule = prev.module;
                                this.currentView = prev.view;
                                this.selectedId = prev.id || null;
                                this.editingId = null;
                                this.searchQuery = '';
                                this.searchResults = null;
                                document.getElementById('globalSearch').value = '';
                                document.getElementById('searchInfo').textContent = '';
                                document.getElementById('clearSearch').classList.remove('visible');
                                this.render();
                            }
                        } else {
                            this.goBack();
                        }
                    });

                    window.addEventListener('beforeunload', (e) => {
                        if (this._formChanged && this.currentView === 'form') {
                            e.preventDefault();
                            e.returnValue =
                                'Anda memiliki perubahan yang belum disimpan. Yakin ingin meninggalkan halaman?';
                            return e.returnValue;
                        }
                    });

                    this._checkBriefingDismiss();
                    this.updateLandingStats();
                    Modal.init();
                    CropTool.init();
                    Lightbox.init();
                    LihatModal.init();
                    LihatPilihan.init();
                    console.log('✅ USU BISA v6.0 (Premium) siap digunakan.');
                }

                // ---- NAVIGASI ----
                _checkBriefingDismiss() {
                    try {
                        const val = localStorage.getItem(STORE_PREFIX + 'briefing_dismiss');
                        if (val) {
                            const ts = parseInt(val);
                            const now = new Date();
                            const dismissDate = new Date(ts);
                            if (dismissDate.toDateString() === now.toDateString()) {
                                this.briefingDismissed = true;
                            } else {
                                localStorage.removeItem(STORE_PREFIX + 'briefing_dismiss');
                                this.briefingDismissed = false;
                            }
                        }
                    } catch { this.briefingDismissed = false; }
                }

                updateLandingStats() {
                    const s = this.state.stats();
                    document.getElementById('statDosen').textContent = s.dosen;
                    document.getElementById('statMatkul').textContent = s.matkul;
                    document.getElementById('statTugas').textContent = s.tugas;
                }

                navigate(module, view = 'list', id = null) {
                    const landing = document.getElementById('landing');
                    const main = document.getElementById('mainContainer');
                    if (!landing.classList.contains('hidden')) {
                        landing.classList.add('hidden');
                        main.classList.add('active');
                        this.navStack = [];
                        this._rootContext = module;
                    }

                    if (view !== 'list') {
                        this.searchQuery = '';
                        this.searchResults = null;
                        document.getElementById('globalSearch').value = '';
                        document.getElementById('searchInfo').textContent = '';
                        document.getElementById('clearSearch').classList.remove('visible');
                    }

                    this.currentModule = module;
                    this.currentView = view;
                    this.selectedId = id;
                    this.editingId = null;
                    this._formChanged = false;

                    const navState = { module, view, id };
                    const last = this.navStack[this.navStack.length - 1];
                    if (!last || last.module !== module || last.view !== view || last.id !== id) {
                        this.navStack.push(navState);
                        try { history.pushState(navState, ''); } catch {}
                    }

                    this.render();
                }

                goBack() {
                    if (this.navStack.length <= 1) {
                        this._goToLanding();
                        return;
                    }

                    this.navStack.pop();
                    const prev = this.navStack[this.navStack.length - 1];
                    if (prev) {
                        this.currentModule = prev.module;
                        this.currentView = prev.view;
                        this.selectedId = prev.id || null;
                        this.editingId = null;
                        this.searchQuery = '';
                        this.searchResults = null;
                        document.getElementById('globalSearch').value = '';
                        document.getElementById('searchInfo').textContent = '';
                        document.getElementById('clearSearch').classList.remove('visible');
                        this._formChanged = false;
                        this.render();
                    } else {
                        this._goToLanding();
                    }
                }

                goHome() {
                    if (!this._rootContext) {
                        this._goToLanding();
                        return;
                    }

                    this.currentView = 'list';
                    this.selectedId = null;
                    this.editingId = null;
                    this.searchQuery = '';
                    this.searchResults = null;
                    this._formChanged = false;
                    document.getElementById('globalSearch').value = '';
                    document.getElementById('searchInfo').textContent = '';
                    document.getElementById('clearSearch').classList.remove('visible');

                    this.navStack = [{ module: this._rootContext, view: 'list', id: null }];
                    this.currentModule = this._rootContext;
                    try { history.pushState({ module: this._rootContext, view: 'list', id: null }, ''); } catch {}

                    Modal.close();
                    LihatModal.close();
                    LihatPilihan.close();
                    document.getElementById('cropOverlay')?.classList.remove('active');
                    document.getElementById('photoLightbox')?.classList.remove('active');

                    Notif.success(`Kembali ke ${MODULE_LABELS[this._rootContext] || this._rootContext}`);
                    this.render();
                }

                _goToLanding() {
                    document.getElementById('mainContainer').classList.remove('active');
                    document.getElementById('landing').classList.remove('hidden');
                    this.navStack = [];
                    this._rootContext = null;
                    this.updateLandingStats();
                    Modal.close();
                    LihatModal.close();
                    LihatPilihan.close();
                    document.getElementById('cropOverlay')?.classList.remove('active');
                    document.getElementById('photoLightbox')?.classList.remove('active');
                }

                handleAction() {
                    const mod = this.currentModule;
                    const view = this.currentView;
                    if (mod === 'dashboard') {
                        Notif.info('Gunakan menu di bawah untuk mengelola data.');
                        return;
                    }
                    if (view === 'list') {
                        this.clearSearch();
                        this.currentView = 'form';
                        this.editingId = null;
                        this._formChanged = false;
                        this.pushNav(mod, 'form');
                        this.render();
                    } else if (view === 'detail') {
                        this.clearSearch();
                        this.currentView = 'form';
                        this.editingId = this.selectedId;
                        this._formChanged = false;
                        this.pushNav(mod, 'form', this.selectedId);
                        this.render();
                    } else if (view === 'form') {
                        if (this._formChanged) {
                            Modal.open('Perubahan Belum Disimpan',
                                'Anda memiliki perubahan yang belum disimpan. Yakin ingin membatalkan?',
                                () => this.cancelForm());
                        } else {
                            this.cancelForm();
                        }
                    }
                }

                pushNav(module, view, id) {
                    const state = { module, view, id: id || null };
                    const last = this.navStack[this.navStack.length - 1];
                    if (!last || last.module !== module || last.view !== view || last.id !== (id || null)) {
                        this.navStack.push(state);
                        try { history.pushState(state, ''); } catch {}
                    }
                }

                // ---- SEARCH ----
                performSearch() {
                    if (this._searchDebounceTimer) {
                        clearTimeout(this._searchDebounceTimer);
                        this._searchDebounceTimer = null;
                    }
                    const input = document.getElementById('globalSearch');
                    const query = input.value.trim();
                    if (!query) { this.clearSearch(); return; }
                    this.searchQuery = query;
                    const q = query.toLowerCase();
                    const results = [];
                    MODULES.forEach(mod => {
                        const items = this.state.get(mod);
                        items.forEach(item => {
                            if (JSON.stringify(item).toLowerCase().includes(q)) {
                                results.push({ ...item, _mod: mod });
                            }
                        });
                    });
                    this.searchResults = results;
                    document.getElementById('searchInfo').textContent =
                        `Ditemukan ${results.length} hasil untuk "${escapeHTML(query)}"`;
                    document.getElementById('clearSearch').classList.add('visible');

                    if (this.currentModule === 'dashboard') {
                        Notif.info('Pencarian hanya tersedia di modul data (Dosen, Mata Kuliah, dll).');
                        this.clearSearch();
                        return;
                    }
                    this.currentView = 'list';
                    this.pushNav(this.currentModule, 'list');
                    this.render();
                }

                clearSearch() {
                    if (this._searchDebounceTimer) {
                        clearTimeout(this._searchDebounceTimer);
                        this._searchDebounceTimer = null;
                    }
                    this.searchQuery = '';
                    this.searchResults = null;
                    document.getElementById('globalSearch').value = '';
                    document.getElementById('searchInfo').textContent = '';
                    document.getElementById('clearSearch').classList.remove('visible');
                }

                // ---- RENDER ----
                render() {
                    const container = document.getElementById('content');
                    const mod = this.currentModule;
                    const view = this.currentView;

                    let title = MODULE_LABELS[mod] || 'Module';
                    let actionLabel = 'Tambah';
                    let actionIcon = 'bi-plus-lg';
                    let actionClass = '';

                    if (view === 'detail') {
                        title = 'Detail';
                        actionLabel = 'Edit';
                        actionIcon = 'bi-pencil';
                    } else if (view === 'form') {
                        title = this.editingId ? 'Edit' : 'Tambah';
                        actionLabel = 'Batal';
                        actionIcon = 'bi-x-lg';
                        actionClass = 'danger';
                    }

                    document.getElementById('headerTitle').innerHTML =
                        `${title} <span class="brand-badge">USU BISA</span>`;
                    document.getElementById('actionLabel').textContent = actionLabel;
                    const actionBtn = document.getElementById('actionBtn');
                    actionBtn.querySelector('i').className = `bi ${actionIcon}`;
                    actionBtn.className = `header-btn ${actionClass}`;

                    const showSearch = mod !== 'dashboard' && view === 'list';
                    document.getElementById('searchWrap').classList.toggle('visible', showSearch);

                    if (mod === 'dashboard') {
                        actionBtn.style.display = 'none';
                    } else {
                        actionBtn.style.display = 'flex';
                    }

                    const ioDropdown = document.getElementById('ioDropdown');
                    if (mod === 'dashboard' || view !== 'list') {
                        ioDropdown.style.display = 'none';
                    } else {
                        ioDropdown.style.display = 'inline-block';
                    }

                    if (mod === 'dashboard') {
                        this._renderDashboard(container);
                        return;
                    }

                    const items = this.state.get(mod);
                    let listData = items;
                    const searchQ = this.searchQuery.trim().toLowerCase();

                    if (view === 'list' && searchQ) {
                        if (this.searchResults !== null) {
                            listData = this.searchResults;
                        } else {
                            listData = items.filter(item => JSON.stringify(item).toLowerCase().includes(searchQ));
                        }
                    }

                    if (view === 'list') {
                        this._renderList(container, mod, listData);
                    } else if (view === 'detail') {
                        this._renderDetail(container, mod);
                    } else if (view === 'form') {
                        this._renderForm(container, mod);
                    }
                }

                // ---- DASHBOARD (dengan microcopy lebih singkat) ----
                _renderDashboard(container) {
                    const now = new Date();
                    const todayName = DAY_NAMES[now.getDay()];
                    const todayDateStr = getLocalDateString(now);

                    const allReminders = this.state._generateAllReminders(todayDateStr);
                    const archive = this.state.getArchive();
                    const archivedIds = new Set(archive.map(a => a.id));
                    const activeReminders = allReminders.filter(r =>
                        (r.priority === 0 || r.priority === 1) &&
                        !archivedIds.has(r.id)
                    );

                    activeReminders.sort((a, b) => {
                        if (a.priority !== b.priority) return a.priority - b.priority;
                        return a.sortKey.localeCompare(b.sortKey);
                    });

                    const stats = this.state.stats();
                    const notes = this.state.get('notes');
                    const recentNotes = notes.slice(-3).reverse();
                    const greeting = this._getGreeting(now.getHours());
                    const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric',
                        month: 'long', year: 'numeric' });

                    let html = `
                        <div class="dash-grid">
                            <div class="dash-card"><div class="num">${stats.dosen}</div><div class="label">Dosen</div></div>
                            <div class="dash-card"><div class="num">${stats.matkul}</div><div class="label">Mata Kuliah</div></div>
                            <div class="dash-card"><div class="num">${stats.kontrak}</div><div class="label">Kontrak</div></div>
                            <div class="dash-card"><div class="num">${stats.tugas}</div><div class="label">Tugas</div></div>
                            <div class="dash-card"><div class="num">${activeReminders.filter(r=>r.priority===0).length}</div><div class="label">Hari Ini</div></div>
                            <div class="dash-card"><div class="num">${activeReminders.filter(r=>r.priority===1).length}</div><div class="label">Besok</div></div>
                        </div>
                        <div class="briefing-card" id="briefingCard">
                            <div class="briefing-header">
                                <div class="greeting">${escapeHTML(greeting)}</div>
                                <button class="archive-btn" onclick="app.showArchive()"><i class="bi bi-archive"></i> Arsip (${archive.length})</button>
                            </div>
                            <div class="date">${escapeHTML(dateStr)}</div>
                            <div class="summary">
                                <span class="summary-item"><i class="bi bi-calendar-event" style="color:var(--color-danger)"></i> <span class="num">${activeReminders.filter(r=>r.type==='matkul' && r.priority===0).length}</span> Kuliah</span>
                                <span class="summary-item"><i class="bi bi-file-text" style="color:var(--color-danger)"></i> <span class="num">${activeReminders.filter(r=>r.type==='tugas' && r.priority===0).length}</span> Tugas</span>
                                <span class="summary-item"><i class="bi bi-gift" style="color:var(--color-gold)"></i> <span class="num">${activeReminders.filter(r=>r.type==='ultah' && r.priority===0).length}</span> Ultah</span>
                            </div>
                            ${activeReminders.length === 0 ? '<div class="reminder-empty">Tidak ada pengingat hari ini atau besok.</div>' :
                            `<div class="reminder-list">${activeReminders.slice(0, 20).map(r => {
                                const cls = r.priority === 0 ? 'urgent' : 'important';
                                const iconHtml = `<i class="bi ${r.icon}" style="color:${r.iconColor}"></i>`;
                                const actionHtml = `<button class="action-link" onclick="app.openLihatModalFromReminder('${r.id}')">Lihat <i class="bi bi-chevron-right"></i></button>`;
                                return `<div class="reminder-item ${cls}">
                                    <span class="icon">${iconHtml}</span>
                                    <div class="r-content">
                                        <div class="title">${escapeHTML(r.title)}</div>
                                        <div class="desc">${escapeHTML(r.description)}</div>
                                        <div class="meta"><span class="tag">${escapeHTML(r.tag)}</span> <span class="tag">${r.type === 'matkul' ? 'Mata Kuliah' : r.type === 'tugas' ? 'Tugas' : 'Ulang Tahun'}</span></div>
                                    </div>
                                    <div class="action-group">
                                        ${actionHtml}
                                    </div>
                                </div>`;
                            }).join('')}</div>`}
                            ${activeReminders.length > 20 ? '<div style="text-align:center;font-size:0.6rem;color:var(--color-text-muted);margin-top:4px;">... dan '+(activeReminders.length-20)+' pengingat lainnya</div>' : ''}
                        </div>
                        <div class="dash-section"><h3><i class="bi bi-calendar"></i> Jadwal Hari Ini (${escapeHTML(todayName)}) <span class="badge">${this.state.getJadwalByHari(todayName).length}</span></h3>`;
                    const todaySchedule = this.state.getJadwalByHari(todayName);
                    if (todaySchedule.length === 0) {
                        html += `<div class="dash-empty">Tidak ada jadwal hari ini.</div>`;
                    } else {
                        todaySchedule.sort((a, b) => (a.jamMulai || '00:00').localeCompare(b.jamMulai || '00:00'));
                        todaySchedule.forEach(j => {
                            const matkul = this.state.find('matkul', j.matkulId);
                            const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(j.matkul ||
                                'Mata Kuliah');
                            const dosenId = matkul?.dosenId || j.dosenId;
                            const dosenNama = dosenId ? escapeHTML(this.state.getDosenName(dosenId)) : '';
                            const dosen = j.dosen || dosenNama;
                            const jamSelesai = matkul?.jamSelesai ? ` - ${escapeHTML(matkul.jamSelesai)}` :
                                '';
                            html += `
                                <div class="dash-item">
                                    <span class="dash-label">${namaMatkul}${dosen ? ' — '+dosen : ''}</span>
                                    <span class="dash-value">${escapeHTML(j.jamMulai || '')}${jamSelesai}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>
                        <div class="dash-section"><h3><i class="bi bi-pencil-square"></i> Catatan Cepat <span class="badge">${notes.length}</span></h3>
                            <div class="notes-grid">`;
                    if (recentNotes.length === 0) {
                        html += `<div class="dash-empty" style="grid-column:1/-1;">Belum ada catatan.</div>`;
                    } else {
                        recentNotes.forEach(n => {
                            const preview = n.content ? escapeHTML(n.content.slice(0, 50) + (n.content
                                .length > 50 ? '…' : '')) : '';
                            html += `
                                <div class="note-card" onclick="app.openDetail('notes','${n.id}')">
                                    <div class="note-title">
                                        <span>${escapeHTML(n.title || 'Catatan')}</span>
                                        <button class="del-note" onclick="event.stopPropagation();app.confirmDelete('notes','${n.id}')"><i class="bi bi-x-lg"></i></button>
                                    </div>
                                    <div class="note-preview">${preview || '(kosong)'}</div>
                                    <div class="note-date">${n.createdAt ? new Date(n.createdAt).toLocaleDateString('id-ID') : ''}</div>
                                </div>
                            `;
                        });
                    }
                    html += `
                            </div>
                            <button class="note-add-btn" onclick="app.navigate('notes','form')"><i class="bi bi-plus-lg"></i> Tambah</button>
                        </div>
                        <div class="dash-section"><h3><i class="bi bi-person-badge"></i> Dosen Terbaru</h3>`;
                    const recentDosen = [...this.state.get('dosen')].reverse().slice(0, 5);
                    if (recentDosen.length === 0) {
                        html += `<div class="dash-empty">Belum ada dosen.</div>`;
                    } else {
                        recentDosen.forEach(ds => {
                            const fakultas = escapeHTML(ds.fakultas || '');
                            const prodi = escapeHTML(ds.prodi || '');
                            html += `
                                <div class="dash-item">
                                    <span class="dash-label">
                                        ${escapeHTML(ds.nama || 'Tanpa nama')}
                                        ${fakultas ? `<span class="sub">${fakultas}${prodi ? ' · '+prodi : ''}</span>` : ''}
                                    </span>
                                    <span class="dash-value">${escapeHTML(ds.jabatan || '')}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>`;

                    container.innerHTML = html;
                }

                _getGreeting(hour) {
                    if (hour < 6) return 'Selamat malam';
                    if (hour < 10) return 'Selamat pagi';
                    if (hour < 14) return 'Selamat siang';
                    if (hour < 18) return 'Selamat sore';
                    return 'Selamat malam';
                }

                // ---- ARCHIVE ----
                showArchive() {
                    const archive = this.state.getArchive().filter(a => !a.deleted);
                    if (archive.length === 0) {
                        Notif.info('Belum ada pemberitahuan yang diarsipkan.');
                        return;
                    }
                    const container = document.getElementById('content');
                    let html = `
                        <div class="archive-view active">
                            <div class="dash-section">
                                <h3><i class="bi bi-archive"></i> Arsip Pemberitahuan <span class="badge">${archive.length}</span>
                                    <span class="section-actions">
                                        <button onclick="app.clearArchive()"><i class="bi bi-trash"></i> Kosongkan</button>
                                        <button onclick="app.navigate('dashboard','list')"><i class="bi bi-arrow-left"></i> Kembali</button>
                                    </span>
                                </h3>
                                <div class="archive-list">
                    `;
                    archive.forEach(a => {
                        const icon = a.icon || 'bi-info-circle';
                        const iconColor = a.iconColor || 'var(--color-text-muted)';
                        html += `
                            <div class="archive-item">
                                <span class="icon"><i class="bi ${icon}" style="color:${iconColor}"></i></span>
                                <div class="a-content">
                                    <div class="title">${escapeHTML(a.title || 'Pemberitahuan')}</div>
                                    <div class="desc">${escapeHTML(a.description || '')}</div>
                                    <div class="meta">${a.timestamp ? new Date(a.timestamp).toLocaleString('id-ID') : ''}</div>
                                </div>
                                <div class="a-actions">
                                    <button class="restore-link" onclick="app.restoreReminder('${a.id}')"><i class="bi bi-arrow-counterclockwise"></i> Pulihkan</button>
                                    <button class="delete-link" onclick="app.deleteArchiveItem('${a.id}')"><i class="bi bi-trash"></i> Hapus</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML = html;
                }

                archiveReminder(id) {
                    const now = new Date();
                    const todayDateStr = getLocalDateString(now);
                    const allReminders = this.state._generateAllReminders(todayDateStr);
                    const reminder = allReminders.find(r => r.id === id);
                    if (!reminder) {
                        Notif.error('Pemberitahuan tidak ditemukan.');
                        return;
                    }

                    const exists = this.state.getArchive().some(a => a.id === id);
                    if (exists) {
                        Notif.info('Pemberitahuan sudah diarsipkan.');
                        return;
                    }

                    const archivedItem = {
                        ...reminder,
                        timestamp: Date.now(),
                        deleted: false
                    };
                    this.state.pushArchive(archivedItem);
                    Notif.success('Pemberitahuan diarsipkan.');
                    this.render();
                }

                restoreReminder(id) {
                    const archive = this.state.getArchive();
                    const idx = archive.findIndex(a => a.id === id);
                    if (idx === -1) {
                        Notif.error('Pemberitahuan tidak ditemukan di arsip.');
                        return;
                    }
                    this.state.removeArchive(id);
                    Notif.success('Pemberitahuan dipulihkan (status: telah lewat).');
                    this.render();
                }

                deleteArchiveItem(id) {
                    Modal.open('Hapus Permanen', 'Apakah Anda yakin ingin menghapus pemberitahuan ini secara permanen?', () => {
                        const removed = this.state.removeArchive(id);
                        if (removed) {
                            Notif.success('Pemberitahuan dihapus permanen.');
                            this.render();
                        } else {
                            Notif.error('Gagal menghapus.');
                        }
                    });
                }

                deleteReminderPermanen(id) {
                    const archive = this.state.getArchive();
                    const idx = archive.findIndex(a => a.id === id);
                    if (idx !== -1) {
                        this.state.removeArchive(id);
                        Notif.success('Pemberitahuan dihapus permanen.');
                        this.render();
                    } else {
                        const now = new Date();
                        const todayDateStr = getLocalDateString(now);
                        const allReminders = this.state._generateAllReminders(todayDateStr);
                        const reminder = allReminders.find(r => r.id === id);
                        if (reminder) {
                            const archivedItem = {
                                ...reminder,
                                timestamp: Date.now(),
                                deleted: true
                            };
                            this.state.pushArchive(archivedItem);
                            this.state.removeArchive(id);
                            Notif.success('Pemberitahuan dihapus permanen.');
                            this.render();
                        } else {
                            Notif.error('Pemberitahuan tidak ditemukan.');
                        }
                    }
                }

                clearArchive() {
                    Modal.open('Kosongkan Arsip',
                        'Apakah Anda yakin ingin menghapus semua pemberitahuan yang diarsipkan? Tindakan ini tidak dapat dibatalkan.',
                        () => {
                            this.state.setArchive([]);
                            Notif.success('Arsip dikosongkan.');
                            this.render();
                        });
                }

                // ---- LIHAT MODAL ----
                openLihatModalFromReminder(id) {
                    const now = new Date();
                    const todayDateStr = getLocalDateString(now);
                    const allReminders = this.state._generateAllReminders(todayDateStr);
                    const reminder = allReminders.find(r => r.id === id);
                    if (!reminder) {
                        Notif.error('Pemberitahuan tidak ditemukan.');
                        return;
                    }

                    this._currentReminderId = id;

                    const activeModules = [];
                    const allModuleDefs = [
                        { key: 'dosen', label: 'Dosen', icon: 'bi-person-badge' },
                        { key: 'matkul', label: 'Mata Kuliah', icon: 'bi-book' },
