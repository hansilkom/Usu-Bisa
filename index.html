            _addDynamicField(label = '', value = '') {
                const container = document.getElementById('dynamicFieldsContainer');
                if (!container) return;
                const idx = container.children.length;
                const field = document.createElement('div');
                field.className = 'dynamic-field';
                field.innerHTML = `
                    <div class="dynamic-field-header">
                        <strong>Kolom ${idx+1}</strong>
                        <button type="button" class="delete-field">Hapus</button>
                    </div>
                    <div class="form-group">
                        <label>Judul/Kategori</label>
                        <input type="text" class="dynamic-label" value="${label}" placeholder="Contoh: Hobi" required>
                    </div>
                    <div class="form-group">
                        <label>Keterangan/Isi</label>
                        <input type="text" class="dynamic-value" value="${value}" placeholder="Isi keterangan">
                    </div>
                `;
                container.appendChild(field);
                field.querySelector('.delete-field').addEventListener('click', function() {
                    field.remove();
                    Router._updateFieldNumbers();
                });
                this._updateFieldNumbers();
            },

            _updateFieldNumbers() {
                document.querySelectorAll('.dynamic-field').forEach((f, i) => {
                    const strong = f.querySelector('strong');
                    if (strong) strong.textContent = `Kolom ${i+1}`;
                });
            },

            _calcAge() {
                const birth = document.getElementById('inputTanggalLahir')?.value;
                const umur = document.getElementById('inputUmur');
                if (birth && umur) {
                    const b = new Date(birth);
                    const today = new Date();
                    let age = today.getFullYear() - b.getFullYear();
                    const m = today.getMonth() - b.getMonth();
                    if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
                    umur.value = age;
                }
            },

            // ---- FORM ACTIONS ----
            saveForm(e) {
                e.preventDefault();
                const mod = this.state.module;
                const isEdit = this.state.editingId !== null;
                let payload = {};

                if (mod === 'dosen') payload = this._collectDosenForm();
                else if (mod === 'matkul') payload = this._collectMatkulForm();
                else if (mod === 'kontrak') payload = this._collectKontrakForm();
                else if (mod === 'tugas') payload = this._collectTugasForm();
                else if (mod === 'jadwal') payload = this._collectJadwalForm();

                if (!payload.nama && mod !== 'kontrak' && mod !== 'tugas') {
                    Notif.error('Nama harus diisi');
                    return;
                }
                if (mod === 'kontrak' && !payload.judul) {
                    Notif.error('Judul kontrak harus diisi');
                    return;
                }
                if (mod === 'tugas' && !payload.nama) {
                    Notif.error('Nama tugas harus diisi');
                    return;
                }

                if (isEdit) {
                    const updated = AppState.update(mod, this.state.editingId, payload);
                    if (updated) {
                        Notif.success('Data berhasil diperbarui');
                    } else {
                        Notif.error('Data tidak ditemukan');
                        return;
                    }
                } else {
                    payload.id = uid();
                    payload.createdAt = new Date().toISOString();
                    AppState.push(mod, payload);
                    Notif.success('Data berhasil ditambahkan');
                }

                this.state.view = 'list';
                this.state.editingId = null;
                this.pushNav(mod, 'list');
                this.render();
                this.updateLandingStats();
            },

            cancelForm() {
                const mod = this.state.module;
                this.state.view = 'list';
                this.state.editingId = null;
                this.pushNav(mod, 'list');
                this.render();
            },

            // ---- COLLECTORS ----
            _collectDosenForm() {
                const dyn = [];
                document.querySelectorAll('.dynamic-field').forEach(f => {
                    const label = f.querySelector('.dynamic-label')?.value || '';
                    const value = f.querySelector('.dynamic-value')?.value || '';
                    if (label) dyn.push({ label, value });
                });
                return {
                    nama: document.getElementById('inputNama')?.value || '',
                    gelar: document.getElementById('inputGelar')?.value || '',
                    tanggalLahir: document.getElementById('inputTanggalLahir')?.value || '',
                    umur: document.getElementById('inputUmur')?.value || '',
                    email: document.getElementById('inputEmail')?.value || '',
                    telepon: document.getElementById('inputTelepon')?.value || '',
                    fakultas: document.getElementById('inputFakultas')?.value || '',
                    prodi: document.getElementById('inputProdi')?.value || '',
                    jabatan: document.getElementById('inputJabatan')?.value || '',
                    nip: document.getElementById('inputNip')?.value || '',
                    keahlian: document.getElementById('inputKeahlian')?.value || '',
                    ruang: document.getElementById('inputRuang')?.value || '',
                    konsultasi: document.getElementById('inputKonsultasi')?.value || '',
                    catatan: document.getElementById('inputCatatan')?.value || '',
                    instagram: document.getElementById('inputInstagram')?.value || '',
                    twitter: document.getElementById('inputTwitter')?.value || '',
                    linkedIn: document.getElementById('inputLinkedIn')?.value || '',
                    foto: window._photoData || null,
                    dynamicFields: dyn
                };
            },

            _collectMatkulForm() {
                return {
                    nama: document.getElementById('inputNama')?.value || '',
                    kode: document.getElementById('inputKode')?.value || '',
                    sks: parseInt(document.getElementById('inputSks')?.value) || 0,
                    semester: document.getElementById('inputSemester')?.value || '',
                    dosenId: document.getElementById('inputDosenId')?.value || '',
                    kelas: document.getElementById('inputKelas')?.value || '',
                    ruangan: document.getElementById('inputRuangan')?.value || '',
                    deskripsi: document.getElementById('inputDeskripsi')?.value || '',
                    status: document.getElementById('inputStatus')?.value || ''
                };
            },

            _collectKontrakForm() {
                return {
                    judul: document.getElementById('inputJudul')?.value || '',
                    matkulId: document.getElementById('inputMatkulId')?.value || '',
                    dosenId: document.getElementById('inputDosenId')?.value || '',
                    kelas: document.getElementById('inputKelas')?.value || '',
                    tujuan: document.getElementById('inputTujuan')?.value || '',
                    materi: document.getElementById('inputMateri')?.value || '',
                    penilaian: document.getElementById('inputPenilaian')?.value || '',
                    referensi: document.getElementById('inputReferensi')?.value || '',
                    peraturan: document.getElementById('inputPeraturan')?.value || '',
                    catatanKhusus: document.getElementById('inputCatatan')?.value || ''
                };
            },

            _collectTugasForm() {
                return {
                    nama: document.getElementById('inputNama')?.value || '',
                    matkulId: document.getElementById('inputMatkulId')?.value || '',
                    dosen: document.getElementById('inputDosen')?.value || '',
                    tanggalDiberikan: document.getElementById('inputTanggalDiberikan')?.value || '',
                    deadline: document.getElementById('inputDeadline')?.value || '',
                    status: document.getElementById('inputStatus')?.value || 'Belum dikerjakan',
                    prioritas: document.getElementById('inputPrioritas')?.value || 'Sedang',
                    keterangan: document.getElementById('inputKeterangan')?.value || '',
                    link: document.getElementById('inputLink')?.value || ''
                };
            },

            _collectJadwalForm() {
                return {
                    matkulId: document.getElementById('inputMatkulId')?.value || '',
                    dosen: document.getElementById('inputDosen')?.value || '',
                    hari: document.getElementById('inputHari')?.value || '',
                    jamMulai: document.getElementById('inputJamMulai')?.value || '',
                    jamSelesai: document.getElementById('inputJamSelesai')?.value || '',
                    ruangan: document.getElementById('inputRuangan')?.value || '',
                    kelas: document.getElementById('inputKelas')?.value || '',
                    catatan: document.getElementById('inputCatatan')?.value || ''
                };
            },

            // ---- PUBLIC HELPERS ----
            openDetail(mod, id) {
                this.state.view = 'detail';
                this.state.selectedId = id;
                this.state.editingId = null;
                this.pushNav(mod, 'detail', id);
                this.render();
            },

            editItem(mod, id) {
                this.state.view = 'form';
                this.state.editingId = id;
                this.pushNav(mod, 'form', id);
                this.render();
            },

            confirmDelete(mod, id) {
                const item = AppState.find(mod, id);
                const name = item?.nama || item?.judul || item?.matkul || 'item';
                Modal.open(
                    'Konfirmasi Hapus',
                    `Apakah Anda yakin ingin menghapus "${name}"? Tindakan ini tidak dapat dibatalkan.`,
                    () => {
                        const removed = AppState.remove(mod, id);
                        if (removed) {
                            Notif.success(`"${name}" berhasil dihapus`);
                        } else {
                            Notif.error('Gagal menghapus data');
                        }
                        this.state.view = 'list';
                        this.state.selectedId = null;
                        this.state.editingId = null;
                        this.pushNav(mod, 'list');
                        this.render();
                        this.updateLandingStats();
                    }
                );
            }
        };

        // ---- INIT ----
        document.addEventListener('DOMContentLoaded', () => {
            // Migrasi data dari v2 jika ada
            const migrateV2 = () => {
                const v2Keys = {
                    dosen: 'apc_dosen_v2',
                    matkul: 'apc_matkul_v2',
                    kontrak: 'apc_kontrak_v2',
                    tugas: 'apc_tugas_v2',
                    jadwal: 'apc_jadwal_v2'
                };
                let migrated = false;
                for (const [k, oldKey] of Object.entries(v2Keys)) {
                    try {
                        const oldData = localStorage.getItem(oldKey);
                        if (oldData) {
                            const parsed = JSON.parse(oldData);
                            if (Array.isArray(parsed) && parsed.length > 0 && AppState.get(k).length === 0) {
                                AppState.set(k, parsed);
                                migrated = true;
                            }
                        }
                    } catch {}
                }
                if (migrated) {
                    console.log('🔄 Data dari V2 berhasil dimigrasi.');
                }
            };
            migrateV2();

            // Inisialisasi Router
            Router.init();

            // Ekspos Router ke global untuk inline onclick
            window.Router = Router;
            window.Notif = Notif;

            console.log('✅ Academic Personal Center V3 siap digunakan.');
        });
    </script>
</body>
</html>
