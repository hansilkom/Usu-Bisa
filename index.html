<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>USU Academic Personal Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ============================================================
           ROOT — Design System V4 (FIXED)
           ============================================================ */
        :root {
            --color-primary: #0a2e24;
            --color-primary-light: #14532d;
            --color-primary-lighter: #1a6e3e;
            --color-primary-bg: #e8f5e9;
            --color-gold: #f5b300;
            --color-gold-light: #ffd54f;
            --color-gold-bg: #fef8e7;
            --color-white: #ffffff;
            --color-bg: #f0f2f5;
            --color-card: #ffffff;
            --color-text: #0f172a;
            --color-text-secondary: #334155;
            --color-text-muted: #94a3b8;
            --color-border: #e2e8f0;
            --color-danger: #dc2626;
            --color-danger-hover: #b91c1c;
            --color-success: #16a34a;
            --color-info: #2563eb;
            --color-warning: #f59e0b;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 12px 48px rgba(0, 0, 0, 0.16);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --header-h: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: var(--color-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            padding-bottom: calc(10px + var(--safe-bottom));
            color: var(--color-white);
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        /* ============================================================
           LANDING
           ============================================================ */
        .landing {
            width: 100%;
            max-width: 720px;
            text-align: center;
            animation: fadeUp 0.7s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(32px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landing-brand {
            display: inline-block;
            margin-bottom: 4px;
        }
        .landing-brand svg {
            width: 104px;
            height: 104px;
            filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.35));
            transition: transform 0.3s ease;
        }
        .landing-brand:hover svg {
            transform: scale(1.04);
        }

        .landing-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-gold-light);
            letter-spacing: -0.5px;
            margin-bottom: 2px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }
        .landing-sub {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 26px;
            letter-spacing: 0.3px;
        }

        .landing-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 420px;
            margin: 0 auto 28px;
        }
        .landing-stat {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 12px 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.2s;
        }
        .landing-stat:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        .landing-stat .num {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--color-gold-light);
        }
        .landing-stat .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 2px;
        }

        .landing-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        .landing-menu .menu-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid var(--color-gold);
            color: var(--color-gold);
            padding: 12px 8px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 52px;
            letter-spacing: 0.2px;
            font-family: var(--font);
        }
        .landing-menu .menu-btn i {
            font-size: 1.2rem;
        }
        .landing-menu .menu-btn:hover,
        .landing-menu .menu-btn:focus-visible {
            background: var(--color-gold);
            color: var(--color-primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(245, 179, 0, 0.3);
        }
        .landing-menu .menu-btn:active {
            transform: translateY(0) scale(0.97);
        }

        /* ============================================================
           MAIN CONTAINER
           ============================================================ */
        .main-container {
            width: 100%;
            max-width: 1150px;
            min-height: 90vh;
            max-height: 98vh;
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            display: none;
            flex-direction: column;
            color: var(--color-text);
            position: relative;
        }
        .main-container.active {
            display: flex;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--color-white);
            padding: 8px 18px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: var(--header-h);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .header-back {
            background: none;
            border: none;
            color: var(--color-text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-back:hover {
            background: var(--color-border);
        }
        .header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .header-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 7px 16px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-family: var(--font);
        }
        .header-btn i {
            font-size: 1rem;
        }
        .header-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .header-btn:active {
            transform: scale(0.96);
        }
        .header-btn.outline {
            background: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-border);
        }
        .header-btn.outline:hover {
            background: var(--color-border);
        }
        .header-btn.danger {
            background: var(--color-danger);
        }
        .header-btn.danger:hover {
            background: var(--color-danger-hover);
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        .search-wrap {
            background: var(--color-white);
            padding: 8px 18px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            display: none;
        }
        .search-wrap.visible {
            display: block;
        }
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--color-bg);
            border-radius: var(--radius-full);
            padding: 0 14px;
            border: 2px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(11, 61, 46, 0.08);
        }
        .search-bar .search-icon {
            color: var(--color-text-muted);
            font-size: 1rem;
            margin-right: 8px;
            display: flex;
            align-items: center;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 9px 0;
            font-size: 0.85rem;
            font-family: var(--font);
            outline: none;
            min-width: 0;
            color: var(--color-text);
        }
        .search-bar input::placeholder {
            color: var(--color-text-muted);
        }
        .search-bar .clear-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 6px;
            display: none;
            line-height: 1;
        }
        .search-bar .clear-btn.visible {
            display: block;
        }
        .search-bar .search-submit {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            padding: 6px 16px;
            font-weight: 600;
            font-size: 0.72rem;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .search-bar .search-submit:hover {
            background: var(--color-primary-light);
        }
        .search-result-info {
            font-size: 0.72rem;
            color: var(--color-text-muted);
            padding: 4px 4px 0;
        }

        /* ============================================================
           CONTENT
           ============================================================ */
        .content {
            flex: 1;
            padding: 16px 18px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 6px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ============================================================
           DASHBOARD
           ============================================================ */
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .dash-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 14px 10px;
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--color-gold);
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .dash-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .dash-card .num {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--color-primary);
            line-height: 1.2;
        }
        .dash-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--color-text-muted);
            margin-top: 2px;
        }

        .dash-section {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 14px;
            transition: box-shadow 0.2s;
        }
        .dash-section:hover {
            box-shadow: var(--shadow-md);
        }
        .dash-section h3 {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 8px;
        }
        .dash-section h3 .badge {
            background: var(--color-gold-bg);
            color: var(--color-primary);
            font-size: 0.6rem;
            padding: 1px 10px;
            border-radius: var(--radius-full);
            margin-left: auto;
            font-weight: 600;
        }
        .dash-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f1f3f6;
            gap: 10px;
        }
        .dash-item:last-child {
            border-bottom: none;
        }
        .dash-item .dash-label {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            flex: 1;
            word-break: break-word;
        }
        .dash-item .dash-value {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text);
            text-align: right;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .dash-item .dash-value.highlight {
            color: var(--color-danger);
        }
        .dash-item .dash-value.success {
            color: var(--color-success);
        }
        .dash-empty {
            color: var(--color-text-muted);
            font-size: 0.8rem;
            text-align: center;
            padding: 16px 0;
        }

        /* --- Briefing --- */
        .briefing-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            box-shadow: var(--shadow-md);
            margin-bottom: 18px;
            border-left: 5px solid var(--color-gold);
            transition: all 0.2s;
        }
        .briefing-card .greeting {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 1px;
        }
        .briefing-card .date {
            font-size: 0.78rem;
            color: var(--color-text-muted);
            margin-bottom: 10px;
        }
        .briefing-card .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }
        .briefing-card .summary-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
        }
        .briefing-card .summary-item .num {
            font-weight: 700;
            color: var(--color-text);
        }
        .briefing-card .summary-item i {
            font-size: 0.9rem;
        }

        .reminder-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .reminder-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 12px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--color-info);
            transition: background 0.15s;
        }
        .reminder-item:hover {
            background: #e8ecf1;
        }
        .reminder-item.urgent {
            border-left-color: var(--color-danger);
        }
        .reminder-item.important {
            border-left-color: var(--color-warning);
        }
        .reminder-item.reminder {
            border-left-color: var(--color-info);
        }
        .reminder-item .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 1px;
            display: flex;
            align-items: center;
        }
        .reminder-item .content {
            flex: 1;
            padding: 0;
            background: transparent;
            box-shadow: none;
            overflow: hidden;
        }
        .reminder-item .content .title {
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--color-text);
        }
        .reminder-item .content .desc {
            font-size: 0.74rem;
            color: var(--color-text-secondary);
            margin-top: 1px;
            word-break: break-word;
        }
        .reminder-item .content .meta {
            font-size: 0.65rem;
            color: var(--color-text-muted);
            margin-top: 3px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .reminder-item .content .meta .tag {
            background: var(--color-white);
            padding: 1px 8px;
            border-radius: var(--radius-full);
            border: 1px solid var(--color-border);
        }
        .reminder-item .action-link {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--color-primary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
            flex-shrink: 0;
            font-family: var(--font);
        }
        .reminder-item .action-link:hover {
            background: var(--color-gold-bg);
        }
        .reminder-empty {
            color: var(--color-text-muted);
            font-size: 0.82rem;
            padding: 8px 0;
            text-align: center;
        }

        .briefing-dismiss {
            text-align: right;
            margin-top: 10px;
        }
        .briefing-dismiss button {
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
            font-family: var(--font);
        }
        .briefing-dismiss button:hover {
            background: var(--color-border);
        }

        /* IPK Target */
        .ipk-tracker {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .ipk-tracker .ipk-input {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ipk-tracker .ipk-input label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-secondary);
        }
        .ipk-tracker .ipk-input input {
            width: 70px;
            padding: 4px 8px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: var(--font);
            text-align: center;
            font-weight: 600;
            color: var(--color-text);
            transition: border-color 0.2s;
        }
        .ipk-tracker .ipk-input input:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .ipk-tracker .ipk-bar-wrap {
            flex: 1;
            min-width: 100px;
        }
        .ipk-tracker .ipk-bar {
            height: 6px;
            background: var(--color-border);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
        }
        .ipk-tracker .ipk-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-success), var(--color-gold));
            border-radius: var(--radius-full);
            transition: width 0.6s ease;
            width: 0%;
        }
        .ipk-tracker .ipk-label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            white-space: nowrap;
        }

        /* Notes */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .note-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .note-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--color-gold);
        }
        .note-card .note-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--color-text);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-card .note-title .del-note {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 4px;
            transition: color 0.15s;
        }
        .note-card .note-title .del-note:hover {
            color: var(--color-danger);
        }
        .note-card .note-preview {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-card .note-date {
            font-size: 0.6rem;
            color: var(--color-text-muted);
            margin-top: 6px;
        }
        .note-add-btn {
            background: var(--color-white);
            border: 2px dashed var(--color-primary);
            color: var(--color-primary);
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .note-add-btn:hover {
            background: var(--color-gold-bg);
            border-style: solid;
        }

        /* ============================================================
           LIST VIEW
           ============================================================ */
        .module-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }
        .list-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .list-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-sm);
            opacity: 0;
            background: linear-gradient(135deg, rgba(245, 179, 0, 0.04), transparent);
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .list-card:hover::after {
            opacity: 1;
        }
        .list-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--color-gold);
        }
        .list-card:active {
            transform: scale(0.98);
        }
        .list-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--color-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--color-gold);
        }
        .list-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .list-info {
            flex: 1;
            min-width: 0;
        }
        .list-info .primary {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-info .secondary {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-badge {
            font-size: 0.6rem;
            background: var(--color-gold-bg);
            color: var(--color-primary);
            padding: 1px 12px;
            border-radius: var(--radius-full);
            font-weight: 600;
            flex-shrink: 0;
            border: 1px solid rgba(245, 179, 0, 0.2);
        }
        .list-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-muted);
        }
        .list-empty .icon {
            font-size: 2.4rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }
        .list-empty p {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }
        .list-empty .sub {
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }
        .list-back-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 20px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: var(--font);
            font-size: 0.8rem;
        }
        .list-back-btn:hover {
            background: var(--color-primary-light);
        }

        /* ============================================================
           DETAIL VIEW
           ============================================================ */
        .detail-view {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .detail-view.active {
            display: block;
        }

        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--color-border);
            text-align: center;
        }
        .detail-photo {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--color-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
            overflow: hidden;
            border: 3px solid var(--color-gold);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
            position: relative;
        }
        .detail-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-name h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--color-text);
        }
        .detail-name .sub {
            font-size: 0.78rem;
            color: var(--color-text-muted);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .detail-item {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
        }
        .detail-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--color-text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .detail-item .value {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--color-text);
            word-break: break-word;
        }

        .detail-relations {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--color-border);
        }
        .detail-relations h4 {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 8px;
        }
        .relation-chip {
            display: inline-block;
            background: var(--color-gold-bg);
            color: var(--color-primary);
            padding: 3px 16px;
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            font-weight: 500;
            margin: 2px 4px 2px 0;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .relation-chip:hover {
            background: var(--color-primary);
            color: #fff;
        }

        .detail-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--color-border);
            flex-wrap: wrap;
        }
        .detail-actions button {
            padding: 8px 22px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: var(--font);
        }
        .btn-edit {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-edit:hover {
            background: var(--color-primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-delete {
            background: #fff;
            color: var(--color-danger);
            border: 1.5px solid var(--color-danger);
        }
        .btn-delete:hover {
            background: var(--color-danger);
            color: #fff;
        }

        /* ============================================================
           FORM VIEW
           ============================================================ */
        .form-view {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .form-view.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 3px;
            letter-spacing: 0.2px;
        }
        .form-group label .required {
            color: var(--color-danger);
            margin-left: 2px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-family: var(--font);
            background: var(--color-white);
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--color-text);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(11, 61, 46, 0.08);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }
        .form-group input[readonly] {
            background: var(--color-bg);
            cursor: not-allowed;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--color-border);
        }
        .form-section h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 10px;
        }

        .photo-upload {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .photo-upload input[type="file"] {
            display: none;
        }
        .photo-upload .upload-btn {
            background: var(--color-primary);
            color: #fff;
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: background 0.2s;
            border: none;
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .photo-upload .upload-btn:hover {
            background: var(--color-primary-light);
        }
        .photo-upload .photo-name {
            font-size: 0.72rem;
            color: var(--color-text-muted);
        }
        .photo-upload .photo-actions {
            display: flex;
            gap: 6px;
        }
        .photo-upload .photo-actions button {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, color 0.15s;
            font-family: var(--font);
        }
        .photo-upload .photo-actions button:hover {
            background: var(--color-border);
        }
        .photo-upload .photo-actions .del-photo-btn {
            color: var(--color-danger);
        }
        .photo-upload .photo-actions .del-photo-btn:hover {
            background: var(--color-danger);
            color: #fff;
        }

        .dynamic-fields {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--color-border);
        }
        .dynamic-fields h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 10px;
        }
        .dynamic-field {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .dynamic-field:hover {
            border-color: var(--color-primary-lighter);
        }
        .dynamic-field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .dynamic-field-header strong {
            font-size: 0.74rem;
            color: var(--color-text-secondary);
        }
        .dynamic-field-header .delete-field {
            background: none;
            border: none;
            color: var(--color-danger);
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, color 0.15s;
            font-family: var(--font);
        }
        .dynamic-field-header .delete-field:hover {
            background: var(--color-danger);
            color: #fff;
        }
        .add-field-btn {
            background: var(--color-white);
            border: 2px dashed var(--color-primary);
            color: var(--color-primary);
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .add-field-btn:hover {
            background: var(--color-gold-bg);
            border-style: solid;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .form-actions button {
            padding: 8px 22px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            flex: 1;
            min-width: 90px;
            font-family: var(--font);
        }
        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--color-primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-secondary {
            background: var(--color-white);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }
        .btn-secondary:hover {
            background: var(--color-bg);
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: 22px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.25s ease;
        }
        @keyframes scaleIn {
            from {
                transform: scale(0.92);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal h3 {
            font-size: 1rem;
            color: var(--color-text);
            margin-bottom: 8px;
        }
        .modal p {
            color: var(--color-text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
            font-size: 0.85rem;
        }
        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 6px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: var(--font);
        }
        .modal-cancel {
            background: var(--color-white);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }
        .modal-cancel:hover {
            background: var(--color-bg);
        }
        .modal-confirm {
            background: var(--color-danger);
            color: #fff;
        }
        .modal-confirm:hover {
            background: var(--color-danger-hover);
        }

        /* ============================================================
           NOTIFICATIONS
           ============================================================ */
        .notif-container {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            max-width: 340px;
            width: calc(100% - 28px);
        }
        .notif {
            background: var(--color-text);
            color: #fff;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            pointer-events: auto;
            animation: slideRight 0.3s ease;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .notif.success {
            background: var(--color-success);
        }
        .notif.error {
            background: var(--color-danger);
        }
        .notif.info {
            background: var(--color-info);
        }
        .notif .close {
            cursor: pointer;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            padding: 0 4px;
            margin-left: auto;
            opacity: 0.7;
            transition: opacity 0.15s;
            line-height: 1;
        }
        .notif .close:hover {
            opacity: 1;
        }
        @keyframes slideRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .app-footer {
            text-align: center;
            padding: 14px 0 6px;
            border-top: 1px solid var(--color-border);
            margin-top: 12px;
            color: var(--color-text-muted);
            font-size: 0.7rem;
        }
        .app-footer a {
            color: var(--color-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .app-footer a:hover {
            color: var(--color-gold);
        }
        .app-footer a i {
            font-size: 1rem;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 4px;
            }
            .landing-title {
                font-size: 1.4rem;
            }
            .landing-stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .landing-stat .num {
                font-size: 1.1rem;
            }
            .landing-menu {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .landing-menu .menu-btn {
                font-size: 0.7rem;
                padding: 10px 4px;
                min-height: 44px;
            }
            .landing-menu .menu-btn i {
                font-size: 1rem;
            }
            .header {
                padding: 6px 12px;
                min-height: 50px;
            }
            .header-title {
                font-size: 0.85rem;
            }
            .header-btn {
                font-size: 0.65rem;
                padding: 5px 10px;
            }
            .header-btn .btn-label {
                display: none;
            }
            .header-btn i {
                font-size: 0.9rem;
            }
            .search-wrap {
                padding: 6px 12px;
            }
            .search-bar input {
                font-size: 0.8rem;
                padding: 8px 0;
            }
            .search-bar .search-submit {
                padding: 5px 12px;
                font-size: 0.68rem;
            }
            .content {
                padding: 10px 12px 18px;
            }
            .dash-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .dash-card .num {
                font-size: 1.2rem;
            }
            .module-list {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .detail-photo {
                width: 68px;
                height: 68px;
                font-size: 1.6rem;
            }
            .modal {
                padding: 16px 14px;
            }
            .list-card {
                padding: 10px 12px;
            }
            .briefing-card {
                padding: 12px 14px;
            }
            .reminder-item {
                padding: 6px 10px;
            }
            .notes-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 400px) {
            .landing-menu {
                grid-template-columns: 1fr 1fr;
            }
            .landing-menu .menu-btn {
                font-size: 0.65rem;
                padding: 8px 4px;
                min-height: 40px;
            }
            .dash-card {
                padding: 10px 6px;
            }
            .dash-card .num {
                font-size: 1rem;
            }
            .notes-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (min-width: 641px) {
            .landing-menu {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LANDING
    ============================================================ -->
    <div id="landing" class="landing">
        <div class="landing-brand">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFD54F"/>
                        <stop offset="100%" stop-color="#F5B300"/>
                    </linearGradient>
                    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1B5E20"/>
                        <stop offset="100%" stop-color="#0B3D2E"/>
                    </linearGradient>
                </defs>
                <circle cx="60" cy="60" r="56" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
                <circle cx="60" cy="60" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="5 5"/>
                <text x="60" y="72" font-size="32" fill="url(#goldGrad)" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800">USU</text>
            </svg>
        </div>
        <div class="landing-title">Academic Personal Center</div>
        <div class="landing-sub">Universitas Sumatera Utara</div>

        <div class="landing-stats" id="landingStats">
            <div class="landing-stat"><div class="num" id="statDosen">0</div><div class="label">Dosen</div></div>
            <div class="landing-stat"><div class="num" id="statMatkul">0</div><div class="label">Mata Kuliah</div></div>
            <div class="landing-stat"><div class="num" id="statTugas">0</div><div class="label">Tugas</div></div>
        </div>

        <div class="landing-menu">
            <button class="menu-btn" data-module="dashboard"><i class="bi bi-grid"></i> Dashboard</button>
            <button class="menu-btn" data-module="dosen"><i class="bi bi-person-badge"></i> Dosen</button>
            <button class="menu-btn" data-module="matkul"><i class="bi bi-book"></i> Mata Kuliah</button>
            <button class="menu-btn" data-module="kontrak"><i class="bi bi-clipboard"></i> Kontrak</button>
            <button class="menu-btn" data-module="tugas"><i class="bi bi-file-text"></i> Tugas</button>
            <button class="menu-btn" data-module="jadwal"><i class="bi bi-calendar"></i> Jadwal</button>
        </div>
    </div>

    <!-- ============================================================
    MAIN CONTAINER
    ============================================================ -->
    <div id="mainContainer" class="main-container">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <button class="header-back" id="backBtn" title="Kembali"><i class="bi bi-arrow-left"></i></button>
                <span class="header-title" id="headerTitle">Dashboard</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="actionBtn">
                    <i class="bi bi-plus-lg"></i>
                    <span class="btn-label" id="actionLabel">Tambah</span>
                </button>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-wrap" id="searchWrap">
            <div class="search-bar">
                <span class="search-icon"><i class="bi bi-search"></i></span>
                <input type="text" id="globalSearch" placeholder="Cari dosen, mata kuliah, kontrak..." />
                <button class="clear-btn" id="clearSearch"><i class="bi bi-x-lg"></i></button>
                <button class="search-submit" id="searchSubmit"><i class="bi bi-search"></i> Cari</button>
            </div>
            <div class="search-result-info" id="searchInfo"></div>
        </div>

        <!-- CONTENT -->
        <div class="content" id="content"></div>

        <!-- FOOTER -->
        <div class="app-footer" id="appFooter">
            <a href="https://www.instagram.com/hans_taf?igsi=MWVuZmo5MWlycDViZQ==" target="_blank" rel="noopener noreferrer">
                <i class="bi bi-instagram"></i> @hans_taf
            </a>
        </div>
    </div>

    <!-- ============================================================
    MODAL
    ============================================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Konfirmasi</h3>
            <p id="modalMessage">Apakah Anda yakin?</p>
            <div class="modal-buttons">
                <button class="modal-cancel" id="modalCancel">Batal</button>
                <button class="modal-confirm" id="modalConfirm">Ya, Hapus</button>
            </div>
