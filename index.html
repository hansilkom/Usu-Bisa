                        { key: 'kontrak', label: 'Kontrak Kuliah', icon: 'bi-clipboard' },
                        { key: 'tugas', label: 'Tugas', icon: 'bi-file-text' },
                        { key: 'jadwal', label: 'Jadwal', icon: 'bi-calendar' }
                    ];

                    const getRelatedItems = (modKey) => {
                        const sourceId = reminder.sourceId;
                        const sourceMod = reminder.module;
                        if (!sourceId || !sourceMod) return [];

                        if (modKey === sourceMod) {
                            const item = this.state.find(modKey, sourceId);
                            return item ? [item] : [];
                        }

                        if (sourceMod === 'matkul') {
                            const matkul = this.state.find('matkul', sourceId);
                            if (!matkul) return [];
                            if (modKey === 'dosen' && matkul.dosenId) {
                                const dosen = this.state.find('dosen', matkul.dosenId);
                                return dosen ? [dosen] : [];
                            }
                            if (modKey === 'tugas') return this.state.getTugasByMatkul(sourceId);
                            if (modKey === 'kontrak') return this.state.getKontrakByMatkul(sourceId);
                            if (modKey === 'jadwal') return this.state.getJadwalByMatkul(sourceId);
                        }

                        if (sourceMod === 'tugas') {
                            const tugas = this.state.find('tugas', sourceId);
                            if (!tugas) return [];
                            if (modKey === 'matkul' && tugas.matkulId) {
                                const matkul = this.state.find('matkul', tugas.matkulId);
                                return matkul ? [matkul] : [];
                            }
                            if (modKey === 'dosen') {
                                const matkul = tugas.matkulId ? this.state.find('matkul', tugas.matkulId) : null;
                                if (matkul && matkul.dosenId) {
                                    const dosen = this.state.find('dosen', matkul.dosenId);
                                    return dosen ? [dosen] : [];
                                }
                                if (tugas.dosenId) {
                                    const dosen = this.state.find('dosen', tugas.dosenId);
                                    return dosen ? [dosen] : [];
                                }
                            }
                        }

                        if (sourceMod === 'kontrak') {
                            const kontrak = this.state.find('kontrak', sourceId);
                            if (!kontrak) return [];
                            if (modKey === 'matkul' && kontrak.matkulId) {
                                const matkul = this.state.find('matkul', kontrak.matkulId);
                                return matkul ? [matkul] : [];
                            }
                            if (modKey === 'dosen' && kontrak.dosenId) {
                                const dosen = this.state.find('dosen', kontrak.dosenId);
                                return dosen ? [dosen] : [];
                            }
                            if (modKey === 'tugas') return this.state.getTugasByKontrak(sourceId);
                        }

                        if (sourceMod === 'jadwal') {
                            const jadwal = this.state.find('jadwal', sourceId);
                            if (!jadwal) return [];
                            if (modKey === 'matkul' && jadwal.matkulId) {
                                const matkul = this.state.find('matkul', jadwal.matkulId);
                                return matkul ? [matkul] : [];
                            }
                            if (modKey === 'dosen' && jadwal.dosenId) {
                                const dosen = this.state.find('dosen', jadwal.dosenId);
                                return dosen ? [dosen] : [];
                            }
                            if (modKey === 'tugas' && jadwal.matkulId) {
                                return this.state.getTugasByMatkul(jadwal.matkulId);
                            }
                        }

                        if (sourceMod === 'dosen') {
                            if (modKey === 'matkul') return this.state.getMatkulByDosen(sourceId);
                            if (modKey === 'tugas') return this.state.getTugasByDosen(sourceId);
                            if (modKey === 'kontrak') return this.state.getKontrakByDosen(sourceId);
                            if (modKey === 'jadwal') return this.state.getJadwalByDosen(sourceId);
                        }

                        return [];
                    };

                    allModuleDefs.forEach(def => {
                        const items = getRelatedItems(def.key);
                        const count = items.length;
                        activeModules.push({
                            ...def,
                            count: count,
                            items: items,
                            sourceId: reminder.sourceId,
                            active: count > 0
                        });
                    });

                    const hasActive = activeModules.some(m => m.active);
                    if (!hasActive) {
                        Notif.info('Tidak ada modul yang terkait dengan pemberitahuan ini.');
                        return;
                    }

                    LihatModal.openForReminder(activeModules, (moduleKey, sourceId) => {
                        if (sourceId) {
                            const item = this.state.find(moduleKey, sourceId);
                            if (item) {
                                this.openDetail(moduleKey, sourceId);
                                Notif.success(`Membuka ${MODULE_LABELS[moduleKey]}`);
                                return;
                            }
                        }
                        const modData = activeModules.find(m => m.key === moduleKey);
                        if (modData && modData.items.length > 0) {
                            if (modData.items.length === 1) {
                                const target = modData.items[0];
                                this.openDetail(moduleKey, target.id);
                                Notif.success(`Membuka ${MODULE_LABELS[moduleKey]}`);
                            } else {
                                const listItems = modData.items.map(it => ({
                                    id: it.id,
                                    label: it.nama || it.judul || it.matkul || it.label || 'Tanpa nama',
                                    icon: MODULE_ICONS[moduleKey] || 'bi-file-text'
                                }));
                                LihatPilihan.open(`Pilih ${MODULE_LABELS[moduleKey]}`, listItems, (id) => {
                                    this.openDetail(moduleKey, id);
                                    Notif.success(`Membuka ${MODULE_LABELS[moduleKey]}`);
                                });
                            }
                        } else {
                            this.navigate(moduleKey, 'list');
                            Notif.info(`Membuka ${MODULE_LABELS[moduleKey]}`);
                        }
                    }, id);
                }

                // ---- LIHAT UNTUK RELASI (Detail) ----
                openLihatForRelation(relationData) {
                    const hasActive = relationData.some(m => m.count > 0);
                    if (!hasActive) {
                        Notif.info('Tidak ada relasi yang tersedia.');
                        return;
                    }
                    LihatModal.openForRelation(relationData);
                }

                // ---- FOTO HELPERS ----
                _getDosenPhoto(dosenId) {
                    return this.state.getDosenPhoto(dosenId);
                }

                _getDosenName(dosenId) {
                    return this.state.getDosenName(dosenId);
                }

                _getDosenNip(dosenId) {
                    return this.state.getDosenNip(dosenId);
                }

                // ---- LIST ----
                _renderList(container, mod, items) {
                    const isSearch = this.searchQuery.trim() !== '' && this.searchResults !== null;
                    let html = `<div class="module-list">`;
                    if (!items || items.length === 0) {
                        const icon = MODULE_ICONS[mod] || 'bi-folder';
                        html += `
                            <div class="list-empty">
                                <div class="icon"><i class="bi ${icon}"></i></div>
                                <p>${isSearch ? 'Tidak ada hasil pencarian.' : 'Belum ada data.'}</p>
                                <div class="sub">${isSearch ? 'Coba kata kunci lain.' : 'Tambahkan data baru melalui tombol + di atas.'}</div>
                                ${isSearch ? `<button class="list-back-btn" onclick="app.clearSearch();app.render()">Kembali ke daftar</button>` : ''}
                            </div>
                        `;
                        html += `</div>`;
                        container.innerHTML = html;
                        return;
                    }

                    items.forEach(item => {
                        let primary = escapeHTML(item.nama || item.judul || item.matkul || item.title ||
                            'Tanpa nama');
                        let secondary = '';
                        let badge = '';

                        if (mod === 'dosen') {
                            secondary = item.nip ? escapeHTML(item.nip) : '';
                            badge = '';
                        } else {
                            let dosenId = null;
                            let dosenNama = '';

                            if (mod === 'matkul' && item.dosenId) {
                                dosenId = item.dosenId;
                                dosenNama = this._getDosenName(dosenId);
                            } else if (mod === 'tugas' && item.dosenId) {
                                dosenId = item.dosenId;
                                dosenNama = this._getDosenName(dosenId);
                            } else if (mod === 'kontrak' && item.dosenId) {
                                dosenId = item.dosenId;
                                dosenNama = this._getDosenName(dosenId);
                            } else if (mod === 'jadwal' && item.dosenId) {
                                dosenId = item.dosenId;
                                dosenNama = this._getDosenName(dosenId);
                            }

                            if (dosenNama) {
                                secondary = escapeHTML(dosenNama);
                            } else {
                                secondary = escapeHTML(item.kode || item.fakultas || (item.content ? (item.content
                                    .slice(0, 40) + (item.content.length > 40 ? '…' : '')) : ''));
                            }
                            badge = escapeHTML(item.sks ? `${item.sks} SKS` : (item.status || (item.priority ?
                                item.priority : '')));
                        }

                        let avatarImg = '';
                        let avatarFallback = '';
                        let avatarClick = '';

                        let dosenId = null;
                        if (mod === 'matkul' && item.dosenId) {
                            dosenId = item.dosenId;
                        } else if (mod === 'tugas' && item.dosenId) {
                            dosenId = item.dosenId;
                        } else if (mod === 'kontrak' && item.dosenId) {
                            dosenId = item.dosenId;
                        } else if (mod === 'jadwal' && item.dosenId) {
                            dosenId = item.dosenId;
                        }

                        if (dosenId) {
                            const dosenNama = this._getDosenName(dosenId);
                            const foto = this._getDosenPhoto(dosenId);
                            if (foto) {
                                avatarImg = `<img src="${escapeHTML(foto)}" alt="${escapeHTML(dosenNama || primary)}" loading="lazy">`;
                            } else {
                                const initial = dosenNama ? dosenNama.charAt(0).toUpperCase() : primary.charAt(0)
                                    .toUpperCase();
                                avatarFallback =
                                    `<span class="avatar-fallback">${escapeHTML(initial)}</span>`;
                            }
                            if (dosenNama && !secondary) {
                                secondary = escapeHTML(dosenNama);
                            }
                            avatarClick = `onclick="event.stopPropagation();app._openPhoto('${foto ? escapeHTML(foto) : ''}','${escapeHTML(dosenNama || primary)}')"`;
                        } else if (mod === 'dosen') {
                            const foto = item.foto;
                            if (foto) {
                                avatarImg = `<img src="${escapeHTML(foto)}" alt="${escapeHTML(primary)}" loading="lazy">`;
                            } else {
                                avatarFallback =
                                    `<span class="avatar-fallback">${primary.charAt(0).toUpperCase()}</span>`;
                            }
                            avatarClick = `onclick="event.stopPropagation();app._openPhoto('${foto ? escapeHTML(foto) : ''}','${escapeHTML(primary)}')"`;
                        } else if (mod === 'notes') {
                            html += `
                                <div class="list-card" onclick="app.openDetail('notes','${item.id}')">
                                    <div class="list-avatar"><i class="bi bi-pencil-square" style="font-size:0.9rem;"></i></div>
                                    <div class="list-info">
                                        <div class="primary">${primary}</div>
                                        <div class="secondary">${item.content ? escapeHTML(item.content.slice(0, 40) + (item.content.length > 40 ? '…' : '')) : ''}</div>
                                    </div>
                                    ${item.createdAt ? `<span class="list-badge">${new Date(item.createdAt).toLocaleDateString('id-ID')}</span>` : ''}
                                </div>
                            `;
                            return;
                        } else {
                            const iconMap = {
                                kontrak: 'bi-clipboard',
                                tugas: 'bi-file-text',
                                jadwal: 'bi-calendar'
                            };
                            const icon = iconMap[mod] || 'bi-folder';
                            avatarFallback = `<span class="avatar-fallback"><i class="bi ${icon}"></i></span>`;
                            avatarClick = '';
                        }

                        let avatarHtml = '';
                        if (avatarImg) {
                            avatarHtml = avatarImg;
                        } else if (avatarFallback) {
                            avatarHtml = avatarFallback;
                        } else {
                            avatarHtml = `<span class="avatar-fallback">${primary.charAt(0).toUpperCase()}</span>`;
                        }

                        html += `
                            <div class="list-card" onclick="app.openDetail('${mod}','${item.id}')">
                                <div class="list-avatar" ${avatarClick} role="button" tabindex="0" aria-label="Foto profil">
                                    ${avatarHtml}
                                </div>
                                <div class="list-info">
                                    <div class="primary">${primary}</div>
                                    <div class="secondary">${secondary}</div>
                                </div>
                                ${badge ? `<span class="list-badge">${badge}</span>` : ''}
                            </div>
                        `;
                    });
                    html += `</div>`;

                    if (isSearch) {
                        html +=
                            `<div style="text-align:center;margin-top:10px;"><button class="list-back-btn" onclick="app.clearSearch();app.render()">Kembali ke daftar</button></div>`;
                    }

                    container.innerHTML = html;
                }

                // ---- DETAIL ----
                _renderDetail(container, mod) {
                    const item = this.state.find(mod, this.selectedId);
                    if (!item) {
                        this.currentView = 'list';
                        this.render();
                        return;
                    }

                    if (mod === 'notes') {
                        container.innerHTML = `
                            <div class="detail-view active">
                                <div class="detail-header">
                                    <div class="detail-name">
                                        <h2>${escapeHTML(item.title || 'Tanpa judul')}</h2>
                                        <div class="sub">${item.createdAt ? new Date(item.createdAt).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}) : ''}</div>
                                    </div>
                                </div>
                                <div style="background:var(--color-card);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow-sm);white-space:pre-wrap;font-size:0.85rem;line-height:1.7;color:var(--color-text);">
                                    ${escapeHTML(item.content || '(kosong)')}
                                </div>
                                <div class="detail-actions">
                                    <button class="btn-edit" onclick="app.editItem('notes','${item.id}')"><i class="bi bi-pencil"></i> Edit</button>
                                    <button class="btn-delete" onclick="app.confirmDelete('notes','${item.id}')"><i class="bi bi-trash"></i> Hapus</button>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    const humanFields = ['nama', 'judul', 'matkul', 'title', 'kode', 'sks', 'semester', 'kelas', 'ruangan',
                        'deskripsi', 'status', 'hari', 'jamMasuk', 'jamSelesai', 'nip', 'jabatan', 'fakultas', 'prodi',
                        'keahlian', 'email', 'telepon', 'linkedIn', 'ruang', 'konsultasi', 'catatan', 'tujuan', 'materi',
                        'penilaian', 'referensi', 'peraturan', 'catatanKhusus', 'tanggalDiberikan', 'deadline',
                        'prioritas', 'keterangan', 'link', 'jamMulai', 'tanggalLahir', 'umur'
                    ];

                    let infoHtml = '';
                    const keys = Object.keys(item).filter(k =>
                        !['id', 'foto', 'dynamicFields', 'createdAt', 'dosenId', 'matkulId', '_mod'].includes(k) &&
                        humanFields.includes(k) &&
                        item[k] !== undefined && item[k] !== null && item[k] !== ''
                    );

                    keys.sort();

                    if (mod === 'matkul' && item.dosenId) {
                        const dosenName = this._getDosenName(item.dosenId);
                        if (dosenName) {
                            infoHtml += `
                                <div class="detail-item">
                                    <div class="label">Dosen Pengampu</div>
                                    <div class="value">${escapeHTML(dosenName)}</div>
                                </div>
                            `;
                        }
                    } else if (mod === 'tugas' && item.dosenId) {
                        const dosenName = this._getDosenName(item.dosenId);
                        if (dosenName) {
                            infoHtml += `
                                <div class="detail-item">
                                    <div class="label">Dosen</div>
                                    <div class="value">${escapeHTML(dosenName)}</div>
                                </div>
                            `;
                        }
                    } else if (mod === 'kontrak' && item.dosenId) {
                        const dosenName = this._getDosenName(item.dosenId);
                        if (dosenName) {
                            infoHtml += `
                                <div class="detail-item">
                                    <div class="label">Dosen</div>
                                    <div class="value">${escapeHTML(dosenName)}</div>
                                </div>
                            `;
                        }
                    } else if (mod === 'jadwal' && item.dosenId) {
                        const dosenName = this._getDosenName(item.dosenId);
                        if (dosenName) {
                            infoHtml += `
                                <div class="detail-item">
                                    <div class="label">Dosen</div>
                                    <div class="value">${escapeHTML(dosenName)}</div>
                                </div>
                            `;
                        }
                    }

                    keys.forEach(key => {
                        let val = item[key];
                        if (typeof val === 'object') val = JSON.stringify(val);
                        if (val === '' || val === null || val === undefined) return;
                        const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
                        let displayVal = escapeHTML(val);
                        if (key === 'linkedIn' && val && val.includes('linkedin.com')) {
                            displayVal =
                                `<a href="${escapeHTML(val)}" target="_blank" rel="noopener noreferrer">${escapeHTML(val)}</a>`;
                        }
                        if (key === 'email' && val) {
                            displayVal = `<a href="mailto:${escapeHTML(val)}">${escapeHTML(val)}</a>`;
                        }
                        if (key === 'telepon' && val) {
                            displayVal = `<a href="tel:${escapeHTML(val)}">${escapeHTML(val)}</a>`;
                        }
                        infoHtml += `
                            <div class="detail-item">
                                <div class="label">${escapeHTML(label)}</div>
                                <div class="value">${displayVal}</div>
                            </div>
                        `;
                    });

                    if (item.dynamicFields && item.dynamicFields.length > 0) {
                        item.dynamicFields.forEach(df => {
                            if (df.label && df.value) {
                                infoHtml += `
                                    <div class="detail-item">
                                        <div class="label">${escapeHTML(df.label)}</div>
                                        <div class="value">${escapeHTML(df.value)}</div>
                                    </div>
                                `;
                            }
                        });
                    }

                    // ---- RELATION BLOCK ----
                    const relationMap = {};

                    const addRelation = (module, itemRel) => {
                        if (!itemRel) return;
                        if (!relationMap[module]) {
                            relationMap[module] = { key: module, label: MODULE_LABELS[module] || module,
                                icon: MODULE_ICONS[module] || 'bi-folder', items: [] };
                        }
                        relationMap[module].items.push(itemRel);
                    };

                    if (mod === 'dosen') {
                        this.state.getMatkulByDosen(item.id).forEach(m => addRelation('matkul', m));
                        this.state.getKontrakByDosen(item.id).forEach(k => addRelation('kontrak', k));
                        this.state.getTugasByDosen(item.id).forEach(t => addRelation('tugas', t));
                        this.state.getJadwalByDosen(item.id).forEach(j => addRelation('jadwal', j));
                    } else if (mod === 'matkul') {
                        if (item.dosenId) {
                            const dosen = this.state.find('dosen', item.dosenId);
                            if (dosen) addRelation('dosen', dosen);
                        }
                        this.state.getKontrakByMatkul(item.id).forEach(k => addRelation('kontrak', k));
                        this.state.getTugasByMatkul(item.id).forEach(t => addRelation('tugas', t));
                        this.state.getJadwalByMatkul(item.id).forEach(j => addRelation('jadwal', j));
                    } else if (mod === 'tugas') {
                        const matkul = this.state.getMatkulByTugas(item.id);
                        if (matkul) {
                            addRelation('matkul', matkul);
                            if (matkul.dosenId) {
                                const dosen = this.state.find('dosen', matkul.dosenId);
                                if (dosen) addRelation('dosen', dosen);
                            }
                        }
                    } else if (mod === 'kontrak') {
                        if (item.matkulId) {
                            const matkul = this.state.find('matkul', item.matkulId);
                            if (matkul) addRelation('matkul', matkul);
                        }
                        if (item.dosenId) {
                            const dosen = this.state.find('dosen', item.dosenId);
                            if (dosen) addRelation('dosen', dosen);
                        }
                        this.state.getTugasByKontrak(item.id).forEach(t => addRelation('tugas', t));
                    } else if (mod === 'jadwal') {
                        if (item.matkulId) {
                            const matkul = this.state.find('matkul', item.matkulId);
                            if (matkul) {
                                addRelation('matkul', matkul);
                                if (matkul.dosenId) {
                                    const dosen = this.state.find('dosen', matkul.dosenId);
                                    if (dosen) addRelation('dosen', dosen);
                                }
                            }
                        }
                        if (item.dosenId) {
                            const dosen = this.state.find('dosen', item.dosenId);
                            if (dosen) addRelation('dosen', dosen);
                        }
                    }

                    const relationData = Object.values(relationMap).map(entry => ({
                        ...entry,
                        count: entry.items.length
                    }));

                    let relHtml = '';
                    if (relationData.length > 0) {
                        const totalItems = relationData.reduce((sum, r) => sum + r.count, 0);
                        relHtml = `
                            <div class="relation-block">
                                <button class="lihat-terkait-btn" onclick="app.openLihatForRelation(${JSON.stringify(relationData).replace(/"/g, '&quot;')})">
                                    <i class="bi bi-link-45deg"></i> Lihat Terkait (${totalItems})
                                </button>
                            </div>
                        `;
                    }

                    // FOTO HEADER
                    let photoHtml = '';
                    let fallbackChar = '?';
                    let fotoSrc = '';

                    if (mod === 'dosen') {
                        fotoSrc = item.foto || '';
                        fallbackChar = item.nama ? item.nama.charAt(0).toUpperCase() : '?';
                    } else if (mod === 'matkul' && item.dosenId) {
                        const dosenNama = this._getDosenName(item.dosenId);
                        fotoSrc = this._getDosenPhoto(item.dosenId) || '';
                        fallbackChar = dosenNama ? dosenNama.charAt(0).toUpperCase() : (item.nama ? item.nama.charAt(0)
                            .toUpperCase() : '?');
                    } else if (mod === 'tugas' && item.dosenId) {
                        const dosenNama = this._getDosenName(item.dosenId);
                        fotoSrc = this._getDosenPhoto(item.dosenId) || '';
                        fallbackChar = dosenNama ? dosenNama.charAt(0).toUpperCase() : '?';
                    } else if (mod === 'kontrak' && item.dosenId) {
                        const dosenNama = this._getDosenName(item.dosenId);
                        fotoSrc = this._getDosenPhoto(item.dosenId) || '';
                        fallbackChar = dosenNama ? dosenNama.charAt(0).toUpperCase() : '?';
                    } else if (mod === 'jadwal' && item.dosenId) {
                        const dosenNama = this._getDosenName(item.dosenId);
                        fotoSrc = this._getDosenPhoto(item.dosenId) || '';
                        fallbackChar = dosenNama ? dosenNama.charAt(0).toUpperCase() : '?';
                    } else {
                        fotoSrc = '';
                        fallbackChar = item.nama ? item.nama.charAt(0).toUpperCase() : '?';
                    }

                    if (fotoSrc) {
                        photoHtml =
                            `<img src="${escapeHTML(fotoSrc)}" alt="Foto profil" loading="lazy" onclick="app._openPhoto('${escapeHTML(fotoSrc)}','${escapeHTML(item.nama || 'Foto')}')">`;
                    } else {
                        photoHtml = `<span class="detail-fallback">${escapeHTML(fallbackChar)}</span>`;
                    }

                    let headerName = '';
                    let headerSub = '';
                    if (mod === 'dosen') {
                        headerName = escapeHTML(item.nama || 'Tanpa nama');
                        headerSub = escapeHTML(item.jabatan || '') + (item.fakultas ? ' · ' + escapeHTML(item
                            .fakultas) : '');
                    } else if (mod === 'matkul') {
                        headerName = escapeHTML(item.nama || 'Mata Kuliah');
                        const dosenNama = this._getDosenName(item.dosenId);
                        headerSub = (dosenNama ? 'Dosen: ' + escapeHTML(dosenNama) : '') +
                            (item.kode ? ' · ' + escapeHTML(item.kode) : '');
                    } else if (mod === 'tugas') {
                        headerName = escapeHTML(item.nama || 'Tugas');
                        const dosenNama = this._getDosenName(item.dosenId);
                        headerSub = (dosenNama ? 'Dosen: ' + escapeHTML(dosenNama) : '') +
                            (item.deadline ? ' · Deadline: ' + escapeHTML(item.deadline) : '');
                    } else if (mod === 'kontrak') {
                        headerName = escapeHTML(item.judul || 'Kontrak');
                        const dosenNama = this._getDosenName(item.dosenId);
                        headerSub = (dosenNama ? 'Dosen: ' + escapeHTML(dosenNama) : '');
                    } else if (mod === 'jadwal') {
                        headerName = escapeHTML(item.matkul || 'Jadwal');
                        const dosenNama = this._getDosenName(item.dosenId);
                        headerSub = (dosenNama ? 'Dosen: ' + escapeHTML(dosenNama) : '') +
                            (item.hari ? ' · ' + escapeHTML(item.hari) : '');
                    } else {
                        headerName = escapeHTML(item.nama || item.judul || item.matkul || 'Detail');
                        headerSub = escapeHTML(item.kode || item.dosen || item.fakultas || '');
                    }

                    container.innerHTML = `
                        <div class="detail-view active">
                            <div class="detail-header">
                                <div class="detail-photo" onclick="app._openPhoto('${escapeHTML(fotoSrc)}','${escapeHTML(headerName)}')" role="button" tabindex="0" aria-label="Foto profil">
                                    ${photoHtml}
                                </div>
                                <div class="detail-name">
                                    <h2>${headerName}</h2>
                                    <div class="sub">${headerSub}</div>
                                </div>
                            </div>
                            <div class="detail-grid">${infoHtml}</div>
                            ${relHtml}
                            <div class="detail-actions">
                                <button class="btn-edit" onclick="app.editItem('${mod}','${item.id}')"><i class="bi bi-pencil"></i> Edit</button>
                                <button class="btn-delete" onclick="app.confirmDelete('${mod}','${item.id}')"><i class="bi bi-trash"></i> Hapus</button>
                            </div>
                        </div>
                    `;
                }

                // ---- FORM ----
                _renderForm(container, mod) {
                    const isEdit = this.editingId !== null;
                    const item = isEdit ? this.state.find(mod, this.editingId) : null;

                    if (mod === 'notes') {
                        const v = (key) => item ? escapeHTML(item[key] || '') : '';
                        container.innerHTML = `
                            <div class="form-view active">
                                <form id="moduleForm" onsubmit="app.saveForm(event)">
                                    <div class="form-group">
                                        <label>Judul <span class="required">*</span></label>
                                        <input type="text" id="inputTitle" value="${v('title')}" placeholder="Judul catatan..." required>
                                    </div>
                                    <div class="form-group">
                                        <label>Isi Catatan</label>
                                        <textarea id="inputContent" rows="5" placeholder="Tulis catatan Anda di sini...">${v('content')}</textarea>
                                    </div>
                                    <div class="form-actions">
                                        <button type="submit" class="btn-primary">${isEdit ? 'Simpan' : 'Tambah'}</button>
                                        <button type="button" class="btn-secondary" onclick="app.cancelForm()">Batal</button>
                                    </div>
                                </form>
                            </div>
                        `;
                        return;
                    }

                    let fieldsHtml = '';
                    let dynamicHtml = '';

                    if (mod === 'dosen') {
                        fieldsHtml = this._buildDosenForm(item);
                        dynamicHtml = this._buildDynamicFields(item);
                    } else if (mod === 'matkul') {
                        fieldsHtml = this._buildMatkulForm(item);
                    } else if (mod === 'kontrak') {
                        fieldsHtml = this._buildKontrakForm(item);
                    } else if (mod === 'tugas') {
                        fieldsHtml = this._buildTugasForm(item);
                    } else if (mod === 'jadwal') {
                        fieldsHtml = this._buildJadwalForm(item);
                    }

                    const submitLabel = isEdit ? 'Simpan Perubahan' : 'Tambah';

                    container.innerHTML = `
                        <div class="form-view active">
                            <form id="moduleForm" onsubmit="app.saveForm(event)">
                                ${fieldsHtml}
                                ${dynamicHtml}
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">${submitLabel}</button>
                                    <button type="button" class="btn-secondary" onclick="app.cancelForm()">Batal</button>
                                </div>
                            </form>
                        </div>
                    `;

                    this._initPhotoUpload(item);

                    if (mod === 'matkul') {
                        const jamMasuk = document.getElementById('inputJamMasuk');
                        const sksInput = document.getElementById('inputSks');
                        const jamSelesai = document.getElementById('inputJamSelesai');
                        const updateJam = () => {
                            const start = jamMasuk ? jamMasuk.value : '';
                            const sks = parseInt(sksInput ? sksInput.value : 0) || 0;
                            const end = this._calculateEndTime(start, sks);
                            if (jamSelesai) jamSelesai.value = end || '';
                        };
                        if (jamMasuk) jamMasuk.addEventListener('input', updateJam);
                        if (sksInput) sksInput.addEventListener('input', updateJam);
                        setTimeout(updateJam, 50);
                    }

                    const tglInput = document.getElementById('inputTanggalLahir');
                    if (tglInput) {
                        tglInput.addEventListener('change', () => this._calcAge());
                        if (item && item.tanggalLahir) {
                            tglInput.value = item.tanggalLahir;
                            this._calcAge();
                        }
                    }

                    document.querySelectorAll('.delete-field').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const field = this.closest('.dynamic-field');
                            if (field) field.remove();
                            app._updateFieldNumbers();
                        });
                    });

                    const addBtn = document.getElementById('addDynamicBtn');
                    if (addBtn) {
                        addBtn.addEventListener('click', () => this._addDynamicField());
                    }

                    document.querySelectorAll('.section-toggle').forEach(el => {
                        el.addEventListener('click', function() {
                            const body = this.closest('.form-section').querySelector('.section-body');
                            const icon = this.querySelector('.toggle-icon');
                            if (body) {
                                body.classList.toggle('open');
                                if (icon) icon.classList.toggle('open');
                            }
                        });
                    });

                    const form = document.getElementById('moduleForm');
                    if (form) {
                        form.addEventListener('input', () => { this._formChanged = true; });
                        form.addEventListener('change', () => { this._formChanged = true; });
                    }
                }

                _calculateEndTime(startTime, sks) {
                    return this.state._calculateEndTime(startTime, sks);
                }

                // ---- FORM BUILDERS (singkat, tidak diubah) ----
                _buildDosenForm(item) {
                    const v = (key) => item ? escapeHTML(item[key] || '') : '';
                    const hasPhoto = item && item.foto;
                    const photoSrc = hasPhoto ? escapeHTML(item.foto) : '';

                    return `
                        <div class="form-group">
                            <label>Foto Profil</label>
                            <div class="photo-upload-area">
                                <div class="photo-preview-wrap">
                                    <img id="photoPreviewImg" src="${photoSrc}" style="${hasPhoto ? 'display:block' : 'display:none'}" alt="Foto profil">
                                    <div class="placeholder" id="photoPlaceholder" style="${hasPhoto ? 'display:none' : 'display:flex'}">
                                        <i class="bi bi-person-circle"></i>
                                    </div>
                                </div>
                                <div class="photo-controls">
                                    <label for="inputFoto"><i class="bi bi-upload"></i> Upload</label>
                                    <input type="file" id="inputFoto" accept="image/*">
                                    <button type="button" id="photoCropBtn"><i class="bi bi-crop"></i> Atur</button>
                                    <button type="button" id="photoResetBtn"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
                                    <button type="button" class="danger" id="photoRemoveBtn"><i class="bi bi-trash"></i> Hapus</button>
                                </div>
                                <span class="photo-filename" id="photoFileName">${hasPhoto ? 'Foto siap' : 'Belum ada foto'}</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Nama Lengkap &amp; Gelar <span class="required">*</span></label>
                            <input type="text" id="inputNama" value="${v('nama')}" placeholder="Dr. Budi Santoso, S.T., M.Kom." required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Tanggal Lahir</label>
                                <input type="date" id="inputTanggalLahir" value="${v('tanggalLahir')}">
                            </div>
                            <div class="form-group">
                                <label>Umur</label>
                                <input type="text" id="inputUmur" value="${v('umur')}" readonly placeholder="Otomatis">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>NIP</label>
                                <input type="text" id="inputNip" value="${v('nip')}" placeholder="196501011990031001">
                            </div>
                            <div class="form-group">
                                <label>Jabatan</label>
                                <input type="text" id="inputJabatan" value="${v('jabatan')}" placeholder="Dosen">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Fakultas</label>
                                <input type="text" id="inputFakultas" value="${v('fakultas')}" placeholder="Fakultas Ilmu Komputer">
                            </div>
                            <div class="form-group">
                                <label>Program Studi</label>
                                <input type="text" id="inputProdi" value="${v('prodi')}" placeholder="Ilmu Komputer">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Bidang Keahlian</label>
                            <input type="text" id="inputKeahlian" value="${v('keahlian')}" placeholder="Machine Learning, NLP">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="inputEmail" value="${v('email')}" placeholder="nama@example.com">
                            </div>
                            <div class="form-group">
                                <label>Nomor Telepon</label>
                                <input type="tel" id="inputTelepon" value="${v('telepon')}" placeholder="081234567890">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>LinkedIn</label>
                            <input type="text" id="inputLinkedIn" value="${v('linkedIn')}" placeholder="linkedin.com/in/username">
                        </div>

                        <div class="form-section">
                            <h4 class="section-toggle" style="cursor:pointer;">
                                <i class="bi bi-plus-circle"></i> Tambahkan Informasi Lain
                                <span class="toggle-icon" style="margin-left:auto;"><i class="bi bi-chevron-down"></i></span>
                            </h4>
                            <div class="section-body">
                                <div class="form-group">
                                    <label>Ruang Kerja</label>
                                    <input type="text" id="inputRuang" value="${v('ruang')}" placeholder="Gedung A Lt.3 Ruang 301">
                                </div>
                                <div class="form-group">
                                    <label>Jadwal Konsultasi</label>
                                    <input type="text" id="inputKonsultasi" value="${v('konsultasi')}" placeholder="Senin 10:00-12:00">
                                </div>
                                <div class="form-group">
                                    <label>Catatan Pribadi</label>
                                    <textarea id="inputCatatan" rows="2" placeholder="Catatan penting...">${v('catatan')}</textarea>
                                </div>
                            </div>
                        </div>
                    `;
                }

                _buildMatkulForm(item) {
                    const v = (key) => item ? escapeHTML(item[key] || '') : '';
                    const dosenOpts = this.state.get('dosen').map(d =>
                        `<option value="${d.id}" ${d.id === v('dosenId') ? 'selected' : ''}>${escapeHTML(d.nama)}</option>`
                    ).join('');
                    const hariOpts = DAY_NAMES.map(h =>
                        `<option value="${h}" ${h === v('hari') ? 'selected' : ''}>${h}</option>`
                    ).join('');
                    return `
                        <div class="form-row">
                            <div class="form-group">
                                <label>Nama Mata Kuliah <span class="required">*</span></label>
                                <input type="text" id="inputNama" value="${v('nama')}" placeholder="Algoritma dan Pemrograman" required>
                            </div>
                            <div class="form-group">
                                <label>Kode MK</label>
                                <input type="text" id="inputKode" value="${v('kode')}" placeholder="IF1234">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>SKS <span class="required">*</span></label>
                                <input type="number" id="inputSks" value="${v('sks')}" placeholder="3" min="1" max="6" required>
                            </div>
                            <div class="form-group">
                                <label>Semester</label>
                                <input type="text" id="inputSemester" value="${v('semester')}" placeholder="Ganjil 2024/2025">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Hari Kuliah <span class="required">*</span></label>
                            <select id="inputHari" required>
                                <option value="">-- Pilih Hari --</option>
                                ${hariOpts}
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Jam Masuk</label>
                                <input type="time" id="inputJamMasuk" value="${v('jamMasuk')}" step="600">
                            </div>
                            <div class="form-group">
                                <label>Jam Selesai (Otomatis)</label>
                                <input type="text" id="inputJamSelesai" value="${v('jamSelesai')}" readonly placeholder="Otomatis">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Dosen Pengampu</label>
                            <select id="inputDosenId">
                                <option value="">-- Pilih Dosen --</option>
                                ${dosenOpts}
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Kelas</label>
                                <input type="text" id="inputKelas" value="${v('kelas')}" placeholder="A">
                            </div>
                            <div class="form-group">
                                <label>Ruangan</label>
                                <input type="text" id="inputRuangan" value="${v('ruangan')}" placeholder="Gedung A Lt.2 Ruang 201">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Deskripsi</label>
                            <textarea id="inputDeskripsi" rows="2" placeholder="Deskripsi mata kuliah...">${v('deskripsi')}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <input type="text" id="inputStatus" value="${v('status')}" placeholder="Aktif">
                        </div>
                    `;
                }

                _buildKontrakForm(item) {
                    const v = (key) => item ? escapeHTML(item[key] || '') : '';
                    const matkulOpts = this.state.get('matkul').map(m =>
                        `<option value="${m.id}" ${m.id === v('matkulId') ? 'selected' : ''}>${escapeHTML(m.nama || m.kode || 'Mata Kuliah')}</option>`

                _calcAge() {
                    const birth = document.getElementById('inputTanggalLahir')?.value;
                    const umur = document.getElementById('inputUmur');
                    if (birth && umur) {
                        const b = new Date(birth);
                        const today = new Date();
                        let age = today.getFullYear() - b.getFullYear();
                        const m = today.getMonth() - b.getMonth();
                        if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
                        umur.value = age > 0 ? age + ' tahun' : '';
                    }
                }

                // ---- FORM ACTIONS ----
                saveForm(e) {
                    e.preventDefault();
                    const mod = this.currentModule;
                    const isEdit = this.editingId !== null;

                    if (mod === 'notes') {
                        const title = document.getElementById('inputTitle')?.value?.trim() || '';
                        const content = document.getElementById('inputContent')?.value || '';
                        if (!title) {
                            Notif.error('Judul catatan harus diisi.');
                            return;
                        }
                        const payload = { title, content };
                        if (isEdit) {
                            const updated = this.state.update(mod, this.editingId, payload);
                            if (updated) Notif.success('Catatan diperbarui.');
                            else { Notif.error('Gagal memperbarui.'); return; }
                        } else {
                            payload.id = uid();
                            payload.createdAt = new Date().toISOString();
                            this.state.push(mod, payload);
                            Notif.success('Catatan ditambahkan.');
                        }
                        this.clearSearch();
                        this.currentView = 'list';
                        this.editingId = null;
                        this._formChanged = false;
                        this.pushNav(mod, 'list');
                        this.render();
                        this.updateLandingStats();
                        return;
                    }

                    let payload = {};

                    if (mod === 'dosen') {
                        payload = this._collectDosenForm();
                        payload.foto = this._photoData;
                    } else if (mod === 'matkul') {
                        payload = this._collectMatkulForm();
                    } else if (mod === 'kontrak') {
                        payload = this._collectKontrakForm();
                    } else if (mod === 'tugas') {
                        payload = this._collectTugasForm();
                    } else if (mod === 'jadwal') {
                        payload = this._collectJadwalForm();
                    }

                    if (mod === 'dosen' && !payload.nama) {
                        Notif.error('Nama dosen harus diisi');
                        return;
                    }
                    if (mod === 'matkul' && !payload.nama) {
                        Notif.error('Nama mata kuliah harus diisi');
                        return;
                    }
                    if (mod === 'kontrak' && !payload.judul) {
                        Notif.error('Judul kontrak harus diisi');
                        return;
                    }
                    if (mod === 'tugas' && !payload.nama) {
                        Notif.error('Nama tugas harus diisi');
                        return;
                    }
                    if (mod === 'matkul' && !payload.hari) {
                        Notif.error('Hari kuliah harus dipilih');
                        return;
                    }
                    if (mod === 'jadwal' && !payload.hari) {
                        Notif.error('Hari jadwal harus dipilih');
                        return;
                    }

                    if (isEdit) {
                        const updated = this.state.update(mod, this.editingId, payload);
                        if (updated) {
                            Notif.success('Data berhasil diperbarui');
                        } else {
                            Notif.error('Data tidak ditemukan');
                            return;
                        }
                    } else {
                        payload.id = uid();
                        payload.createdAt = new Date().toISOString();
                        this.state.push(mod, payload);
                        Notif.success('Data berhasil ditambahkan');
                    }

                    this.clearSearch();
                    this.currentView = 'list';
                    this.editingId = null;
                    this._formChanged = false;
                    this.navStack = this.navStack.filter(s => !(s.module === mod && s.view === 'form'));
                    this.pushNav(mod, 'list');
                    this.render();
                    this.updateLandingStats();
                }

                // ---- EXPORT/IMPORT ----
                exportCurrentModule() {
                    const mod = this.currentModule;
                    const data = this.state.exportModule(mod);
                    if (!data || data.length === 0) {
                        Notif.error(`Tidak ada data ${MODULE_LABELS[mod] || mod} untuk diekspor.`);
                        return;
                    }
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `usu_bisa_${mod}_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    Notif.success(`Data ${MODULE_LABELS[mod] || mod} diekspor.`);
                }

                importCurrentModule(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const content = e.target.result;
                            const data = safeJSON(content);
                            if (!Array.isArray(data)) throw new Error('Format JSON tidak valid.');
                            const mod = this.currentModule;
                            const added = this.state.importModule(mod, data);
                            Notif.success(`${added} item berhasil diimpor ke ${MODULE_LABELS[mod] || mod}.`);
                            this.render();
                            this.updateLandingStats();
                        } catch (err) {
                            Notif.error(`Gagal mengimpor: ${err.message}`);
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                }

                // ---- PHOTO ----
                _initPhotoUpload(item) {
                    const photoData = item && item.foto ? item.foto : null;
                    const previewImg = document.getElementById('photoPreviewImg');
                    const placeholder = document.getElementById('photoPlaceholder');
                    const fileName = document.getElementById('photoFileName');
                    const fileInput = document.getElementById('inputFoto');
                    const cropBtn = document.getElementById('photoCropBtn');
                    const resetBtn = document.getElementById('photoResetBtn');
                    const removeBtn = document.getElementById('photoRemoveBtn');

                    let currentFileData = photoData;

                    const updatePreview = (data) => {
                        if (data) {
                            previewImg.src = data;
                            previewImg.style.display = 'block';
                            if (placeholder) placeholder.style.display = 'none';
                            fileName.textContent = 'Foto siap';
                            currentFileData = data;
                            this._photoData = data;
                        } else {
                            previewImg.style.display = 'none';
                            if (placeholder) placeholder.style.display = 'flex';
                            fileName.textContent = 'Belum ada foto';
                            currentFileData = null;
                            this._photoData = null;
                        }
                    };

                    updatePreview(photoData);

                    if (fileInput) {
                        fileInput.addEventListener('change', (e) => {
                            const file = e.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = async (ev) => {
                                    CropTool.open(ev.target.result, async (cropped) => {
                                        const compressed = await compressImage(cropped, 200);
                                        updatePreview(compressed);
                                        Notif.success('Foto berhasil diatur.');
                                    });
                                };
                                reader.readAsDataURL(file);
                                fileInput.value = '';
                            }
                        });
                    }

                    if (cropBtn) {
                        cropBtn.addEventListener('click', () => {
                            if (currentFileData) {
                                CropTool.open(currentFileData, async (cropped) => {
                                    const compressed = await compressImage(cropped, 200);
                                    updatePreview(compressed);
                                    Notif.success('Foto berhasil diatur.');
                                });
                            } else {
                                Notif.error('Upload foto terlebih dahulu.');
                            }
                        });
                    }

                    if (resetBtn) {
                        resetBtn.addEventListener('click', () => {
                            updatePreview(null);
                            Notif.info('Foto direset.');
                        });
                    }

                    if (removeBtn) {
                        removeBtn.addEventListener('click', () => {
                            updatePreview(null);
                            Notif.info('Foto dihapus.');
                        });
                    }
                }

                _openPhoto(src, alt = 'Foto') {
                    if (!src) {
                        Notif.info('Tidak ada foto untuk ditampilkan.');
                        return;
                    }
                    Lightbox.open(src, alt);
                }
            }

            // ---- BOOT ----
            let app;
            document.addEventListener('DOMContentLoaded', () => {
                const oldKeys = ['usu_bisa_settings_v2', 'usu_bisa_settings_v3'];
                oldKeys.forEach(key => {
                    if (localStorage.getItem(key)) {
                        const data = safeJSON(localStorage.getItem(key));
                        if (data && Object.keys(data).length > 0) {
                            localStorage.setItem('usu_bisa_settings', JSON.stringify(data));
                        }
                        localStorage.removeItem(key);
                    }
                });

                app = new App();
                window.app = app;
                window.Notif = Notif;
                console.log('✅ USU BISA v6.0 (Premium) siap digunakan.');
            });
        })();
    </script>
</body>
</html>
