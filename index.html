    ============================================================ -->
    <div class="notif-container" id="notifContainer"></div>

    <!-- ============================================================
    JAVASCRIPT — APLIKASI V4 (FIXED)
    ============================================================ -->
    <script>
        /**
         * ================================================================
         *  ACADEMIC PERSONAL CENTER — V4 (FIXED)
         *  Arsitektur modular dengan state management terpusat
         *  ================================================================
         *  PERBAIKAN:
         *  1. Reset searchQuery saat navigasi list ↔ form
         *  2. NavStack tidak menumpuk duplikasi
         *  3. Tombol header di form berubah jadi "Batal"
         *  4. Konsistensi data antara dashboard dan daftar
         *  5. Perbaikan validasi dan error handling
         *  6. Audit seluruh alur CRUD
         *  ================================================================
         */

        // ---- STORE KEYS ----
        const STORE_KEYS = {
            dosen: 'apc_dosen_v4',
            matkul: 'apc_matkul_v4',
            kontrak: 'apc_kontrak_v4',
            tugas: 'apc_tugas_v4',
            jadwal: 'apc_jadwal_v4',
            notes: 'apc_notes_v4',
            settings: 'apc_settings_v4'
        };

        // ---- UTILITIES ----
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const findById = (arr, id) => arr.find(item => item.id === id);
        const findIndexById = (arr, id) => arr.findIndex(item => item.id === id);
        const isPlainObject = (obj) => obj && typeof obj === 'object' && obj.constructor === Object;

        // ---- STORAGE ----
        const Storage = {
            load(key) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : [];
                } catch { return []; }
            },
            save(key, data) {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) {
                    console.warn('Storage save error:', e);
                }
            },
            loadAll() {
                const result = {};
                for (const [k, v] of Object.entries(STORE_KEYS)) {
                    result[k] = this.load(v);
                }
                return result;
            },
            saveAll(data) {
                for (const [k, v] of Object.entries(STORE_KEYS)) {
                    this.save(v, data[k] || []);
                }
            },
            loadSettings() {
                try {
                    const raw = localStorage.getItem(STORE_KEYS.settings);
                    return raw ? JSON.parse(raw) : {};
                } catch { return {}; }
            },
            saveSettings(settings) {
                localStorage.setItem(STORE_KEYS.settings, JSON.stringify(settings));
            }
        };

        // ---- STATE ----
        const AppState = {
            data: Storage.loadAll(),
            settings: Storage.loadSettings(),

            get(module) { return this.data[module] || []; },
            set(module, items) {
                this.data[module] = items;
                Storage.save(STORE_KEYS[module], items);
            },
            push(module, item) {
                const arr = this.get(module);
                arr.push(item);
                this.set(module, arr);
                return item;
            },
            update(module, id, payload) {
                const arr = this.get(module);
                const idx = findIndexById(arr, id);
                if (idx === -1) return null;
                arr[idx] = { ...arr[idx], ...payload };
                this.set(module, arr);
                return arr[idx];
            },
            remove(module, id) {
                const arr = this.get(module);
                const idx = findIndexById(arr, id);
                if (idx === -1) return null;
                const removed = arr.splice(idx, 1)[0];
                this.set(module, arr);
                return removed;
            },
            find(module, id) {
                return findById(this.get(module), id);
            },
            getDosenByMatkul(matkulId) {
                const m = this.find('matkul', matkulId);
                if (!m) return null;
                return this.find('dosen', m.dosenId);
            },
            getMatkulByDosen(dosenId) {
                return this.get('matkul').filter(m => m.dosenId === dosenId);
            },
            getKontrakByMatkul(matkulId) {
                return this.get('kontrak').filter(k => k.matkulId === matkulId);
            },
            getTugasByMatkul(matkulId) {
                return this.get('tugas').filter(t => t.matkulId === matkulId);
            },
            getJadwalByHari(hari) {
                return this.get('jadwal').filter(j => j.hari === hari);
            },
            stats() {
                return {
                    dosen: this.get('dosen').length,
                    matkul: this.get('matkul').length,
                    tugas: this.get('tugas').length,
                    kontrak: this.get('kontrak').length,
                    jadwal: this.get('jadwal').length,
                    notes: this.get('notes').length
                };
            },
            getSettings() {
                return this.settings;
            },
            updateSettings(payload) {
                this.settings = { ...this.settings, ...payload };
                Storage.saveSettings(this.settings);
                return this.settings;
            }
        };

        // ---- NOTIFICATION ----
        const Notif = {
            container: document.getElementById('notifContainer'),
            show(message, type = 'info') {
                const container = this.container;
                while (container.children.length >= 3) container.removeChild(container.firstChild);
                const el = document.createElement('div');
                el.className = `notif ${type}`;
                const icons = { success: 'bi-check-circle', error: 'bi-exclamation-circle', info: 'bi-info-circle' };
                const icon = icons[type] || 'bi-info-circle';
                el.innerHTML =
                    `<i class="bi ${icon}"></i><span>${message}</span><button class="close" onclick="this.parentElement.remove()"><i class="bi bi-x-lg"></i></button>`;
                container.appendChild(el);
                setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
            },
            success(msg) { this.show(msg, 'success'); },
            error(msg) { this.show(msg, 'error'); },
            info(msg) { this.show(msg, 'info'); }
        };

        // ---- MODAL ----
        const Modal = {
            overlay: document.getElementById('modalOverlay'),
            title: document.getElementById('modalTitle'),
            message: document.getElementById('modalMessage'),
            confirmBtn: document.getElementById('modalConfirm'),
            cancelBtn: document.getElementById('modalCancel'),
            _callback: null,

            open(title, message, onConfirm) {
                this.title.textContent = title || 'Konfirmasi';
                this.message.textContent = message || 'Apakah Anda yakin?';
                this._callback = onConfirm || null;
                this.overlay.classList.add('active');
            },
            close() {
                this.overlay.classList.remove('active');
                this._callback = null;
            },
            confirm() {
                if (this._callback) this._callback();
                this.close();
            },
            init() {
                this.cancelBtn.addEventListener('click', () => this.close());
                this.confirmBtn.addEventListener('click', () => this.confirm());
                this.overlay.addEventListener('click', (e) => {
                    if (e.target === this.overlay) this.close();
                });
            }
        };

        // ---- ROUTER ----
        const Router = {
            state: {
                module: 'dashboard',
                view: 'list',
                selectedId: null,
                editingId: null,
                searchQuery: '',
                searchResults: null,
                navStack: [],
                briefingDismissed: false
            },

            moduleLabels: {
                dashboard: 'Dashboard',
                dosen: 'Dosen',
                matkul: 'Mata Kuliah',
                kontrak: 'Kontrak Kuliah',
                tugas: 'Tugas',
                jadwal: 'Jadwal',
                notes: 'Catatan'
            },

            // ---- INIT ----
            init() {
                document.querySelectorAll('.landing-menu .menu-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const mod = btn.dataset.module;
                        this.navigate(mod, 'list');
                    });
                });

                document.getElementById('backBtn').addEventListener('click', () => this.goBack());
                document.getElementById('actionBtn').addEventListener('click', () => this.handleAction());

                document.getElementById('searchSubmit').addEventListener('click', () => this.performSearch());
                document.getElementById('globalSearch').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault();
                        this.performSearch(); }
                });
                document.getElementById('clearSearch').addEventListener('click', () => this.clearSearch());

                window.addEventListener('popstate', (e) => {
                    if (this.state.navStack.length > 1) {
                        this.state.navStack.pop();
                        const prev = this.state.navStack[this.state.navStack.length - 1];
                        if (prev) {
                            this.state.module = prev.module;
                            this.state.view = prev.view;
                            this.state.selectedId = prev.id || null;
                            this.state.editingId = null;
                            this.state.searchQuery = '';
                            this.state.searchResults = null;
                            document.getElementById('globalSearch').value = '';
                            document.getElementById('searchInfo').textContent = '';
                            document.getElementById('clearSearch').classList.remove('visible');
                            this.render();
                        }
                    } else {
                        this.goBack();
                    }
                });

                this._checkBriefingDismiss();
                this.updateLandingStats();
                Modal.init();

                const settings = AppState.getSettings();
                if (settings.ipkTarget) {
                    this._ipkTarget = settings.ipkTarget;
                }

                console.log('✅ Academic Personal Center V4 (Fixed) siap.');
            },

            _checkBriefingDismiss() {
                try {
                    const val = localStorage.getItem('apc_briefing_dismissed_v4');
                    if (val) {
                        const ts = parseInt(val);
                        const now = new Date();
                        const dismissDate = new Date(ts);
                        if (dismissDate.toDateString() === now.toDateString()) {
                            this.state.briefingDismissed = true;
                        } else {
                            localStorage.removeItem('apc_briefing_dismissed_v4');
                            this.state.briefingDismissed = false;
                        }
                    }
                } catch { this.state.briefingDismissed = false; }
            },

            updateLandingStats() {
                const s = AppState.stats();
                document.getElementById('statDosen').textContent = s.dosen;
                document.getElementById('statMatkul').textContent = s.matkul;
                document.getElementById('statTugas').textContent = s.tugas;
            },

            // ---- NAVIGATION ----
            navigate(module, view = 'list', id = null) {
                const landing = document.getElementById('landing');
                const main = document.getElementById('mainContainer');
                if (!landing.classList.contains('hidden')) {
                    landing.classList.add('hidden');
                    main.classList.add('active');
                    this.state.navStack = [];
                }

                // Reset search when navigating
                if (view !== 'list') {
                    this.state.searchQuery = '';
                    this.state.searchResults = null;
                    document.getElementById('globalSearch').value = '';
                    document.getElementById('searchInfo').textContent = '';
                    document.getElementById('clearSearch').classList.remove('visible');
                }

                this.state.module = module;
                this.state.view = view;
                this.state.selectedId = id;
                this.state.editingId = null;

                const navState = { module, view, id };
                // Prevent duplicate nav entries
                const last = this.state.navStack[this.state.navStack.length - 1];
                if (!last || last.module !== module || last.view !== view || last.id !== id) {
                    this.state.navStack.push(navState);
                    try { history.pushState(navState, ''); } catch {}
                }

                this.render();
            },

            goBack() {
                if (this.state.navStack.length > 1) {
                    this.state.navStack.pop();
                    const prev = this.state.navStack[this.state.navStack.length - 1];
                    if (prev) {
                        this.state.module = prev.module;
                        this.state.view = prev.view;
                        this.state.selectedId = prev.id || null;
                        this.state.editingId = null;
                        // Reset search when going back
                        this.state.searchQuery = '';
                        this.state.searchResults = null;
                        document.getElementById('globalSearch').value = '';
                        document.getElementById('searchInfo').textContent = '';
                        document.getElementById('clearSearch').classList.remove('visible');
                        this.render();
                        return;
                    }
                }
                document.getElementById('mainContainer').classList.remove('active');
                document.getElementById('landing').classList.remove('hidden');
                this.state.navStack = [];
                this.updateLandingStats();
            },

            // ---- ACTION HANDLER ----
            handleAction() {
                const mod = this.state.module;
                const view = this.state.view;

                if (mod === 'dashboard') {
                    Notif.info('Gunakan menu di bawah untuk mengelola data.');
                    return;
                }

                if (view === 'list') {
                    // Clear search before going to form
                    this.clearSearch();
                    this.state.view = 'form';
                    this.state.editingId = null;
                    this.pushNav(mod, 'form');
                    this.render();
                } else if (view === 'detail') {
                    // Clear search before going to form
                    this.clearSearch();
                    this.state.view = 'form';
                    this.state.editingId = this.state.selectedId;
                    this.pushNav(mod, 'form', this.state.selectedId);
                    this.render();
                } else if (view === 'form') {
                    // In form view, header button acts as "Batal"
                    this.cancelForm();
                }
            },

            pushNav(module, view, id) {
                const state = { module, view, id: id || null };
                const last = this.state.navStack[this.state.navStack.length - 1];
                if (!last || last.module !== module || last.view !== view || last.id !== (id || null)) {
                    this.state.navStack.push(state);
                    try { history.pushState(state, ''); } catch {}
                }
            },

            // ---- SEARCH ----
            performSearch() {
                const input = document.getElementById('globalSearch');
                const query = input.value.trim();
                if (!query) { this.clearSearch(); return; }
                this.state.searchQuery = query;
                const q = query.toLowerCase();
                const results = [];
                const modules = ['dosen', 'matkul', 'kontrak', 'tugas', 'jadwal'];
                modules.forEach(mod => {
                    const items = AppState.get(mod);
                    items.forEach(item => {
                        if (JSON.stringify(item).toLowerCase().includes(q)) {
                            results.push({ ...item, _mod: mod });
                        }
                    });
                });
                this.state.searchResults = results;
                document.getElementById('searchInfo').textContent = `Ditemukan ${results.length} hasil untuk "${query}"`;
                document.getElementById('clearSearch').classList.add('visible');

                if (this.state.module === 'dashboard') this.state.module = 'dosen';
                this.state.view = 'list';
                this.pushNav(this.state.module, 'list');
                this.render();
            },

            clearSearch() {
                this.state.searchQuery = '';
                this.state.searchResults = null;
                document.getElementById('globalSearch').value = '';
                document.getElementById('searchInfo').textContent = '';
                document.getElementById('clearSearch').classList.remove('visible');
            },

            // ---- RENDER ----
            render() {
                const container = document.getElementById('content');
                const mod = this.state.module;
                const view = this.state.view;

                let title = this.moduleLabels[mod] || 'Module';
                let actionLabel = 'Tambah';
                let actionIcon = 'bi-plus-lg';
                let actionClass = '';

                if (view === 'detail') {
                    title = 'Detail';
                    actionLabel = 'Edit';
                    actionIcon = 'bi-pencil';
                } else if (view === 'form') {
                    title = this.state.editingId ? 'Edit' : 'Tambah';
                    // In form view, header button becomes "Batal"
                    actionLabel = 'Batal';
                    actionIcon = 'bi-x-lg';
                    actionClass = 'danger';
                }

                document.getElementById('headerTitle').textContent = title;
                document.getElementById('actionLabel').textContent = actionLabel;
                const actionBtn = document.getElementById('actionBtn');
                actionBtn.querySelector('i').className = `bi ${actionIcon}`;
                actionBtn.className = `header-btn ${actionClass}`;

                // Show search bar only on list view for data modules
                const showSearch = mod !== 'dashboard' && view === 'list';
                document.getElementById('searchWrap').classList.toggle('visible', showSearch);

                // Show/hide action button on dashboard
                if (mod === 'dashboard') {
                    actionBtn.style.display = 'none';
                } else {
                    actionBtn.style.display = 'flex';
                }

                if (mod === 'dashboard') {
                    this._renderDashboard(container);
                    return;
                }

                const items = AppState.get(mod);
                let listData = items;
                const searchQ = this.state.searchQuery.trim().toLowerCase();

                // Only filter if search is active and we're on list view
                if (view === 'list' && searchQ) {
                    if (this.state.searchResults !== null) {
                        listData = this.state.searchResults;
                    } else {
                        listData = items.filter(item => JSON.stringify(item).toLowerCase().includes(searchQ));
                    }
                }

                if (view === 'list') {
                    this._renderList(container, mod, listData);
                } else if (view === 'detail') {
                    this._renderDetail(container, mod);
                } else if (view === 'form') {
                    this._renderForm(container, mod);
                }
            },

            // ---- DASHBOARD ----
            _renderDashboard(container) {
                const d = AppState.data;
                const now = new Date();
                const todayName = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][now.getDay()];
                const todayDateStr = now.toISOString().slice(0, 10);

                const todaySchedule = AppState.getJadwalByHari(todayName);
                const tasks = AppState.get('tugas').filter(t => t.deadline);
                const todayTasks = tasks.filter(t => t.deadline === todayDateStr);
                const tomorrowTasks = tasks.filter(t => {
                    const d2 = new Date(t.deadline);
                    const diff = Math.ceil((d2 - now) / (1000 * 60 * 60 * 24));
                    return diff === 1;
                });
                const nearTasks = tasks.filter(t => {
                    if (t.status === 'Selesai') return false;
                    const diff = Math.ceil((new Date(t.deadline) - now) / (1000 * 60 * 60 * 24));
                    return diff >= 0 && diff <= 7;
                }).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

                // Reminder dari catatan
                const reminderKeywords = ['ingat', 'jangan', 'lupa', 'bawa', 'persiapan', 'presentasi', 'tugas', 'deadline',
                    'penting', 'catatan'
                ];
                let catatanReminders = [];
                AppState.get('dosen').forEach(ds => {
                    if (ds.catatan) {
                        const lower = ds.catatan.toLowerCase();
                        if (reminderKeywords.some(kw => lower.includes(kw))) {
                            catatanReminders.push({
                                type: 'dosen',
                                source: ds.nama || 'Dosen',
                                text: ds.catatan,
                                id: ds.id,
                                label: 'Catatan Dosen'
                            });
                        }
                    }
                });
                AppState.get('kontrak').forEach(k => {
                    if (k.catatanKhusus) {
                        const lower = k.catatanKhusus.toLowerCase();
                        if (reminderKeywords.some(kw => lower.includes(kw))) {
                            catatanReminders.push({
                                type: 'kontrak',
                                source: k.judul || 'Kontrak',
                                text: k.catatanKhusus,
                                id: k.id,
                                label: 'Catatan Kontrak'
                            });
                        }
                    }
                    if (k.peraturan) {
                        const lower = k.peraturan.toLowerCase();
                        if (reminderKeywords.some(kw => lower.includes(kw))) {
                            catatanReminders.push({
                                type: 'kontrak',
                                source: k.judul || 'Kontrak',
                                text: k.peraturan,
                                id: k.id,
                                label: 'Peraturan'
                            });
                        }
                    }
                });

                let reminders = [];
                todaySchedule.forEach(j => {
                    const matkul = AppState.find('matkul', j.matkulId);
                    const namaMatkul = matkul ? matkul.nama : (j.matkul || 'Mata Kuliah');
                    const dosen = j.dosen || (matkul ? AppState.find('dosen', matkul.dosenId)?.nama : '');
                    let desc = `${namaMatkul}${dosen ? ' — Dosen: '+dosen : ''}${j.ruangan ? ' Ruang: '+j.ruangan : ''}`;
                    reminders.push({
                        id: 'jadwal-' + j.id,
                        priority: 'urgent',
                        icon: 'bi-calendar-event',
                        title: `${j.jamMulai || ''} - ${j.jamSelesai || ''}`,
                        description: desc,
                        sourceType: 'jadwal',
                        sourceId: j.id,
                        module: 'jadwal'
                    });
                });
                todayTasks.forEach(t => {
                    const matkul = AppState.find('matkul', t.matkulId);
                    const namaMatkul = matkul ? matkul.nama : (t.matkul || 'Mata Kuliah');
                    reminders.push({
                        id: 'tugas-' + t.id,
                        priority: 'urgent',
                        icon: 'bi-exclamation-triangle-fill',
                        title: `${t.nama || 'Tugas'}`,
                        description: `Deadline hari ini — ${namaMatkul}`,
                        sourceType: 'tugas',
                        sourceId: t.id,
                        module: 'tugas'
                    });
                });
                tomorrowTasks.forEach(t => {
                    const matkul = AppState.find('matkul', t.matkulId);
                    const namaMatkul = matkul ? matkul.nama : (t.matkul || 'Mata Kuliah');
                    reminders.push({
                        id: 'tugas-' + t.id + '-tomorrow',
                        priority: 'important',
                        icon: 'bi-exclamation-circle-fill',
                        title: `${t.nama || 'Tugas'}`,
                        description: `Deadline besok — ${namaMatkul}`,
                        sourceType: 'tugas',
                        sourceId: t.id,
                        module: 'tugas'
                    });
                });
                nearTasks.forEach(t => {
                    const diff = Math.ceil((new Date(t.deadline) - now) / (1000 * 60 * 60 * 24));
                    if (diff > 1) {
                        const matkul = AppState.find('matkul', t.matkulId);
                        const namaMatkul = matkul ? matkul.nama : (t.matkul || 'Mata Kuliah');
                        reminders.push({
                            id: 'tugas-' + t.id + '-near',
                            priority: 'reminder',
                            icon: 'bi-clock',
                            title: `${t.nama || 'Tugas'}`,
                            description: `Deadline ${diff} hari lagi — ${namaMatkul}`,
                            sourceType: 'tugas',
                            sourceId: t.id,
                            module: 'tugas'
                        });
                    }
                });
                catatanReminders.slice(0, 5).forEach(c => {
                    reminders.push({
                        id: 'catatan-' + c.id + '-' + Date.now(),
                        priority: 'reminder',
                        icon: 'bi-lightbulb',
                        title: `Dari ${c.source}`,
                        description: c.text.length > 80 ? c.text.slice(0, 80) + '…' : c.text,
                        sourceType: c.type,
                        sourceId: c.id,
                        module: c.type === 'dosen' ? 'dosen' : 'kontrak'
                    });
                });

                reminders.sort((a, b) => {
                    const order = { urgent: 0, important: 1, reminder: 2 };
                    return (order[a.priority] || 3) - (order[b.priority] || 3);
                });
                if (reminders.length > 10) reminders = reminders.slice(0, 10);

                const stats = AppState.stats();

                const settings = AppState.getSettings();
                const ipkTarget = settings.ipkTarget || 3.5;
                const ipkCurrent = settings.ipkCurrent || 3.0;
                const ipkPercent = Math.min(100, Math.max(0, (ipkCurrent / ipkTarget) * 100));

                const notes = AppState.get('notes');
                const recentNotes = notes.slice(-3).reverse();

                let html = `
                    <div class="dash-grid">
                        <div class="dash-card"><div class="num">${stats.dosen}</div><div class="label">Dosen</div></div>
                        <div class="dash-card"><div class="num">${stats.matkul}</div><div class="label">Mata Kuliah</div></div>
                        <div class="dash-card"><div class="num">${stats.kontrak}</div><div class="label">Kontrak</div></div>
                        <div class="dash-card"><div class="num">${stats.tugas}</div><div class="label">Tugas</div></div>
                        <div class="dash-card"><div class="num">${nearTasks.length}</div><div class="label">Tugas < 7 hari</div></div>
                        <div class="dash-card"><div class="num">${todaySchedule.length}</div><div class="label">Jadwal Hari Ini</div></div>
                    </div>
                `;

                const greeting = this._getGreeting(now.getHours());
                const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long',
                    year: 'numeric' });

                html += `<div class="briefing-card" id="briefingCard">`;
                html += `<div class="greeting">${greeting}</div>`;
                html += `<div class="date">${dateStr}</div>`;

                const urgentCount = reminders.filter(r => r.priority === 'urgent').length;
                const importantCount = reminders.filter(r => r.priority === 'important').length;
                const reminderCount = reminders.filter(r => r.priority === 'reminder').length;

                html += `<div class="summary">`;
                html +=
                    `<span class="summary-item"><i class="bi bi-exclamation-triangle-fill" style="color:var(--color-danger)"></i> <span class="num">${urgentCount}</span> Urgent</span>`;
                html +=
                    `<span class="summary-item"><i class="bi bi-exclamation-circle-fill" style="color:var(--color-warning)"></i> <span class="num">${importantCount}</span> Penting</span>`;
                html +=
                    `<span class="summary-item"><i class="bi bi-clock" style="color:var(--color-info)"></i> <span class="num">${reminderCount}</span> Pengingat</span>`;
                if (todaySchedule.length > 0) {
                    html +=
                        `<span class="summary-item"><i class="bi bi-calendar-event"></i> <span class="num">${todaySchedule.length}</span> Kuliah</span>`;
                }
                html += `</div>`;

                if (reminders.length === 0) {
                    html += `<div class="reminder-empty">Tidak ada pengingat untuk hari ini.</div>`;
                } else {
                    html += `<div class="reminder-list">`;
                    reminders.forEach(r => {
                        const cls = r.priority === 'urgent' ? 'urgent' : (r.priority === 'important' ?
                            'important' : 'reminder');
                        let actionHtml = '';
                        if (r.module) {
                            actionHtml =
                                `<button class="action-link" onclick="Router.openDetail('${r.module}','${r.sourceId}')">Lihat <i class="bi bi-chevron-right"></i></button>`;
                        }
                        const iconMap = {
                            'bi-calendar-event': 'bi-calendar-event',
                            'bi-exclamation-triangle-fill': 'bi-exclamation-triangle-fill',
                            'bi-exclamation-circle-fill': 'bi-exclamation-circle-fill',
                            'bi-clock': 'bi-clock',
                            'bi-lightbulb': 'bi-lightbulb'
                        };
                        const iconClass = iconMap[r.icon] || 'bi-bell';
                        const colorMap = {
                            urgent: 'var(--color-danger)',
                            important: 'var(--color-warning)',
                            reminder: 'var(--color-info)'
                        };
                        html += `
                            <div class="reminder-item ${cls}">
                                <span class="icon"><i class="bi ${iconClass}" style="color:${colorMap[cls]||'var(--color-info)'}"></i></span>
                                <div class="content">
                                    <div class="title">${r.title}</div>
                                    <div class="desc">${r.description}</div>
                                    <div class="meta">
                                        <span class="tag">${cls === 'urgent' ? 'Urgent' : cls === 'important' ? 'Penting' : 'Pengingat'}</span>
                                    </div>
                                </div>
                                ${actionHtml}
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `
                    <div class="briefing-dismiss">
                        <button onclick="Router.dismissBriefing()">Sembunyikan briefing hari ini</button>
                    </div>
                </div>`;

                // IPK Tracker
                html += `
                    <div class="dash-section">
                        <h3><i class="bi bi-graph-up-arrow"></i> Target IPK</h3>
                        <div class="ipk-tracker">
                            <div class="ipk-input">
                                <label>Target</label>
                                <input type="number" id="ipkTargetInput" step="0.1" min="0" max="4" value="${ipkTarget}" />
                            </div>
                            <div class="ipk-input">
                                <label>Saat Ini</label>
                                <input type="number" id="ipkCurrentInput" step="0.1" min="0" max="4" value="${ipkCurrent}" />
                                <button class="header-btn" style="padding:4px 12px;font-size:0.65rem;" onclick="Router.updateIpk()">Update</button>
                            </div>
                            <div class="ipk-bar-wrap">
                                <div class="ipk-bar">
                                    <div class="fill" style="width:${ipkPercent}%;"></div>
                                </div>
                                <div class="ipk-label">${ipkCurrent} dari ${ipkTarget} (${Math.round(ipkPercent)}%)</div>
                            </div>
                        </div>
                    </div>
                `;

                // Jadwal hari ini
                html +=
                    `<div class="dash-section"><h3><i class="bi bi-calendar"></i> Jadwal Hari Ini (${todayName}) <span class="badge">${todaySchedule.length}</span></h3>`;
                if (todaySchedule.length === 0) {
                    html += `<div class="dash-empty">Tidak ada jadwal hari ini.</div>`;
                } else {
                    todaySchedule.sort((a, b) => (a.jamMulai || '00:00').localeCompare(b.jamMulai || '00:00'));
                    todaySchedule.forEach(j => {
                        const matkul = AppState.find('matkul', j.matkulId);
                        const namaMatkul = matkul ? matkul.nama : (j.matkul || 'Mata Kuliah');
                        const dosen = j.dosen || (matkul ? AppState.find('dosen', matkul.dosenId)?.nama : '');
                        html += `
                            <div class="dash-item">
                                <span class="dash-label">${namaMatkul}${dosen ? ' — '+dosen : ''}</span>
                                <span class="dash-value">${j.jamMulai || ''} - ${j.jamSelesai || ''}</span>
                            </div>
                        `;
                    });
                }
                html += `</div>`;

                // Tugas mendekati deadline
                html +=
                    `<div class="dash-section"><h3><i class="bi bi-file-text"></i> Tugas Mendekati Deadline <span class="badge">${nearTasks.length}</span></h3>`;
                if (nearTasks.length === 0) {
                    html += `<div class="dash-empty">Tidak ada tugas yang mendekati deadline.</div>`;
                } else {
                    nearTasks.forEach(t => {
                        const diff = Math.ceil((new Date(t.deadline) - now) / (1000 * 60 * 60 * 24));
                        const label = diff === 0 ? 'Hari ini' : (diff === 1 ? 'Besok' : `${diff} hari lagi`);
                        const cls = diff <= 2 ? 'highlight' : '';
                        const matkul = AppState.find('matkul', t.matkulId);
                        const namaMatkul = matkul ? matkul.nama : (t.matkul || 'Mata Kuliah');
                        html += `
                            <div class="dash-item">
                                <span class="dash-label">${t.nama || 'Tugas'} — ${namaMatkul}</span>
                                <span class="dash-value ${cls}">${label}</span>
                            </div>
                        `;
                    });
                }
                html += `</div>`;

                // Catatan cepat
                html += `
                    <div class="dash-section">
                        <h3><i class="bi bi-pencil-square"></i> Catatan Cepat <span class="badge">${notes.length}</span></h3>
                        <div class="notes-grid">
                `;
                if (recentNotes.length === 0) {
                    html += `<div class="dash-empty" style="grid-column:1/-1;">Belum ada catatan.</div>`;
                } else {
                    recentNotes.forEach(n => {
                        const preview = n.content ? n.content.slice(0, 60) + (n.content.length > 60 ? '…' : '') :
                            '';
                        html += `
                            <div class="note-card" onclick="Router.openDetail('notes','${n.id}')">
                                <div class="note-title">
                                    <span>${n.title || 'Catatan'}</span>
                                    <button class="del-note" onclick="event.stopPropagation();Router.confirmDelete('notes','${n.id}')"><i class="bi bi-x-lg"></i></button>
                                </div>
                                <div class="note-preview">${preview || '(kosong)'}</div>
                                <div class="note-date">${n.createdAt ? new Date(n.createdAt).toLocaleDateString('id-ID') : ''}</div>
                            </div>
                        `;
                    });
                }
                html += `
                        </div>
                        <button class="note-add-btn" onclick="Router.navigate('notes','form')"><i class="bi bi-plus-lg"></i> Tambah Catatan</button>
                    </div>
                `;

                // Dosen terbaru
                html += `<div class="dash-section"><h3><i class="bi bi-person-badge"></i> Dosen Terbaru</h3>`;
                const recentDosen = [...AppState.get('dosen')].reverse().slice(0, 5);
                if (recentDosen.length === 0) {
                    html += `<div class="dash-empty">Belum ada dosen.</div>`;
                } else {
                    recentDosen.forEach(ds => {
                        html += `
                            <div class="dash-item">
                                <span class="dash-label">${ds.nama || 'Tanpa nama'}</span>
                                <span class="dash-value">${ds.fakultas || ''} ${ds.prodi || ''}</span>
                            </div>
                        `;
                    });
                }
                html += `</div>`;

                container.innerHTML = html;

                if (this.state.briefingDismissed) {
                    const briefing = document.getElementById('briefingCard');
                    if (briefing) briefing.style.display = 'none';
                }
            },

            _getGreeting(hour) {
                if (hour < 6) return 'Selamat malam';
                if (hour < 10) return 'Selamat pagi';
                if (hour < 14) return 'Selamat siang';
                if (hour < 18) return 'Selamat sore';
                return 'Selamat malam';
            },

            dismissBriefing() {
                this.state.briefingDismissed = true;
                const briefing = document.getElementById('briefingCard');
                if (briefing) briefing.style.display = 'none';
                try { localStorage.setItem('apc_briefing_dismissed_v4', Date.now().toString()); } catch {}
            },

            updateIpk() {
                const target = parseFloat(document.getElementById('ipkTargetInput')?.value);
                const current = parseFloat(document.getElementById('ipkCurrentInput')?.value);
                if (isNaN(target) || target <= 0 || target > 4) {
                    Notif.error('Target IPK harus antara 0-4.');
                    return;
                }
                if (isNaN(current) || current < 0 || current > 4) {
                    Notif.error('IPK saat ini harus antara 0-4.');
                    return;
                }
                AppState.updateSettings({ ipkTarget: target, ipkCurrent: current });
                Notif.success('Target IPK diperbarui.');
                this.render();
            },

            // ---- LIST ----
            _renderList(container, mod, items) {
                const isSearch = this.state.searchQuery.trim() !== '' && this.state.searchResults !== null;
                if (!items || items.length === 0) {
                    const iconMap = {
                        dosen: 'bi-person-badge',
                        matkul: 'bi-book',
                        kontrak: 'bi-clipboard',
                        tugas: 'bi-file-text',
                        jadwal: 'bi-calendar',
                        notes: 'bi-pencil-square'
                    };
                    container.innerHTML = `
                        <div class="list-empty">
                            <div class="icon"><i class="bi ${iconMap[mod] || 'bi-folder'}"></i></div>
                            <p>${isSearch ? 'Tidak ada hasil pencarian.' : 'Belum ada data.'}</p>
                            <div class="sub">${isSearch ? 'Coba kata kunci lain.' : 'Tambahkan data baru melalui tombol + di atas.'}</div>
                            ${isSearch ? `<button class="list-back-btn" onclick="Router.clearSearch();Router.render()">Kembali ke daftar</button>` : ''}
                        </div>
                    `;
                    return;
                }

                let html = `<div class="module-list">`;
                items.forEach(item => {
                    const primary = item.nama || item.judul || item.matkul || item.title || 'Tanpa nama';
                    const secondary = item.kode || item.dosen || item.fakultas || (item.content ? (item.content
                        .slice(0, 40) + (item.content.length > 40 ? '…' : '')) : '');
                    const badge = item.sks ? `${item.sks} SKS` : (item.status || (item.priority ? item.priority :
                        ''));
                    const avatarChar = primary.charAt(0).toUpperCase();
                    const avatarImg = item.foto ? `<img src="${item.foto}" alt="${primary}">` : avatarChar;

                    if (mod === 'notes') {
                        html += `
                            <div class="list-card" onclick="Router.openDetail('notes','${item.id}')">
                                <div class="list-avatar"><i class="bi bi-pencil-square" style="font-size:1.2rem;"></i></div>
                                <div class="list-info">
                                    <div class="primary">${item.title || 'Tanpa judul'}</div>
                                    <div class="secondary">${item.content ? item.content.slice(0, 40) + (item.content.length > 40 ? '…' : '') : ''}</div>
                                </div>
                                ${item.createdAt ? `<span class="list-badge">${new Date(item.createdAt).toLocaleDateString('id-ID')}</span>` : ''}
                            </div>
                        `;
                        return;
                    }

                    html += `
                        <div class="list-card" onclick="Router.openDetail('${mod}','${item.id}')">
                            <div class="list-avatar">${avatarImg}</div>
                            <div class="list-info">
                                <div class="primary">${primary}</div>
                                <div class="secondary">${secondary}</div>
                            </div>
                            ${badge ? `<span class="list-badge">${badge}</span>` : ''}
                        </div>
                    `;
                });
                html += `</div>`;

                if (isSearch) {
                    html +=
                        `<div style="text-align:center;margin-top:12px;"><button class="list-back-btn" onclick="Router.clearSearch();Router.render()">Kembali ke daftar</button></div>`;
                }

                container.innerHTML = html;
            },

            // ---- DETAIL ----
            _renderDetail(container, mod) {
                const item = AppState.find(mod, this.state.selectedId);
                if (!item) {
                    this.state.view = 'list';
                    this.render();
                    return;
                }

                if (mod === 'notes') {
                    container.innerHTML = `
                        <div class="detail-view active">
                            <div class="detail-header">
                                <div class="detail-name">
                                    <h2>${item.title || 'Tanpa judul'}</h2>
                                    <div class="sub">${item.createdAt ? new Date(item.createdAt).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}) : ''}</div>
                                </div>
                            </div>
                            <div style="background:var(--color-card);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);white-space:pre-wrap;font-size:0.9rem;line-height:1.7;color:var(--color-text);">
                                ${item.content || '(kosong)'}
                            </div>
                            <div class="detail-actions">
                                <button class="btn-edit" onclick="Router.editItem('notes','${item.id}')"><i class="bi bi-pencil"></i> Edit</button>
                                <button class="btn-delete" onclick="Router.confirmDelete('notes','${item.id}')"><i class="bi bi-trash"></i> Hapus</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                const exclude = ['id', 'foto', 'dynamicFields', 'createdAt'];
                let infoHtml = '';
                const keys = Object.keys(item).filter(k => !exclude.includes(k) && item[k] !== undefined && item[k] !==
                    null && item[k] !== '');
                const priority = ['nama', 'judul', 'kode', 'dosen', 'matkul', 'sks', 'semester', 'kelas', 'ruangan',
                    'hari', 'jamMulai', 'jamSelesai', 'status', 'deadline', 'prioritas', 'link'
                ];
                keys.sort((a, b) => {
                    const ia = priority.indexOf(a),
                        ib = priority.indexOf(b);
                    if (ia === -1 && ib === -1) return a.localeCompare(b);
                    if (ia === -1) return 1;
                    if (ib === -1) return -1;
                    return ia - ib;
                });

                keys.forEach(key => {
                    let val = item[key];
                    if (typeof val === 'object') val = JSON.stringify(val);
                    if (val === '' || val === null || val === undefined) return;
                    const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
                    infoHtml += `
                        <div class="detail-item">
                            <div class="label">${label}</div>
                            <div class="value">${val}</div>
                        </div>
                    `;
                });

                if (item.dynamicFields && item.dynamicFields.length > 0) {
                    item.dynamicFields.forEach(df => {
                        if (df.label && df.value) {
                            infoHtml += `
                                <div class="detail-item">
                                    <div class="label">${df.label}</div>
                                    <div class="value">${df.value}</div>
                                </div>
                            `;
                        }
                    });
                }

                let relHtml = '';
                if (mod === 'dosen') {
                    const matkulAmpu = AppState.getMatkulByDosen(item.id);
                    if (matkulAmpu.length > 0) {
                        relHtml += `
                            <div class="detail-relations">
                                <h4>Mata Kuliah yang Diampu</h4>
                                ${matkulAmpu.map(m => `<span class="relation-chip" onclick="Router.openDetail('matkul','${m.id}')">${m.nama || m.kode || 'Mata Kuliah'}</span>`).join('')}
                            </div>
                        `;
                    }
                }
                if (mod === 'matkul') {
                    const kontrakRel = AppState.getKontrakByMatkul(item.id);
                    if (kontrakRel.length > 0) {
                        relHtml += `
                            <div class="detail-relations">
                                <h4>Kontrak Kuliah</h4>
                                ${kontrakRel.map(k => `<span class="relation-chip" onclick="Router.openDetail('kontrak','${k.id}')">${k.judul || k.matkul || 'Kontrak'}</span>`).join('')}
                            </div>
                        `;
                    }
                }
                if (mod === 'tugas') {
                    if (item.matkulId) {
                        const matkul = AppState.find('matkul', item.matkulId);
                        if (matkul) {
                            relHtml += `
                                <div class="detail-relations">
                                    <h4>Mata Kuliah Terkait</h4>
                                    <span class="relation-chip" onclick="Router.openDetail('matkul','${matkul.id}')">${matkul.nama || matkul.kode || 'Mata Kuliah'}</span>
                                </div>
                            `;
                        }
                    }
                }

                const photoHtml = item.foto ? `<img src="${item.foto}" alt="${item.nama || 'Foto'}">` : (item.nama ? item
                    .nama.charAt(0).toUpperCase() : '?');

                container.innerHTML = `
                    <div class="detail-view active">
                        <div class="detail-header">
                            <div class="detail-photo">${photoHtml}</div>
                            <div class="detail-name">
                                <h2>${item.nama || item.judul || item.matkul || 'Detail'}</h2>
                                <div class="sub">${item.kode || item.fakultas || item.dosen || ''}</div>
                            </div>
                        </div>
                        <div class="detail-grid">${infoHtml}</div>
                        ${relHtml}
                        <div class="detail-actions">
                            <button class="btn-edit" onclick="Router.editItem('${mod}','${item.id}')"><i class="bi bi-pencil"></i> Edit</button>
                            <button class="btn-delete" onclick="Router.confirmDelete('${mod}','${item.id}')"><i class="bi bi-trash"></i> Hapus</button>
                        </div>
                    </div>
                `;
            },

            // ---- FORM ----
            _renderForm(container, mod) {
                const isEdit = this.state.editingId !== null;
                const item = isEdit ? AppState.find(mod, this.state.editingId) : null;

                if (mod === 'notes') {
                    const v = (key) => item ? (item[key] || '') : '';
                    container.innerHTML = `
                        <div class="form-view active">
                            <form id="moduleForm" onsubmit="Router.saveForm(event)">
                                <div class="form-group">
                                    <label>Judul <span class="required">*</span></label>
                                    <input type="text" id="inputTitle" value="${v('title')}" placeholder="Judul catatan..." required>
                                </div>
                                <div class="form-group">
                                    <label>Isi Catatan</label>
                                    <textarea id="inputContent" rows="6" placeholder="Tulis catatan Anda di sini...">${v('content')}</textarea>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">${isEdit ? 'Simpan' : 'Tambah'}</button>
                                    <button type="button" class="btn-secondary" onclick="Router.cancelForm()">Batal</button>
                                </div>
                            </form>
                        </div>
                    `;
                    return;
                }

                let fieldsHtml = '';
                let dynamicHtml = '';

                if (mod === 'dosen') {
                    fieldsHtml = this._buildDosenForm(item);
                    dynamicHtml = this._buildDynamicFields(item);
                } else if (mod === 'matkul') {
                    fieldsHtml = this._buildMatkulForm(item);
                } else if (mod === 'kontrak') {
                    fieldsHtml = this._buildKontrakForm(item);
                } else if (mod === 'tugas') {
                    fieldsHtml = this._buildTugasForm(item);
                } else if (mod === 'jadwal') {
                    fieldsHtml = this._buildJadwalForm(item);
                }

                const submitLabel = isEdit ? 'Simpan Perubahan' : 'Tambah';

                container.innerHTML = `
                    <div class="form-view active">
                        <form id="moduleForm" onsubmit="Router.saveForm(event)">
                            ${fieldsHtml}
                            ${dynamicHtml}
                            <div class="form-actions">
                                <button type="submit" class="btn-primary">${submitLabel}</button>
                                <button type="button" class="btn-secondary" onclick="Router.cancelForm()">Batal</button>
                            </div>
                        </form>
                    </div>
                `;

                if (item && item.foto) {
                    const nameSpan = document.getElementById('photoName');
                    if (nameSpan) nameSpan.textContent = 'Foto sudah diunggah';
                    window._photoData = item.foto;
                } else {
                    window._photoData = null;
                }

                const tglInput = document.getElementById('inputTanggalLahir');
                if (tglInput) {
                    tglInput.addEventListener('change', () => this._calcAge());
                    if (item && item.tanggalLahir) {
                        tglInput.value = item.tanggalLahir;
                        this._calcAge();
                    }
                }

                const fileInput = document.getElementById('inputFoto');
                if (fileInput) {
                    fileInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                window._photoData = ev.target.result;
                                const nameSpan = document.getElementById('photoName');
                                if (nameSpan) nameSpan.textContent = file.name;
                                const preview = document.getElementById('photoPreview');
                                if (preview) preview.src = ev.target.result;
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }

                const delPhotoBtn = document.getElementById('delPhotoBtn');
                if (delPhotoBtn) {
                    delPhotoBtn.addEventListener('click', () => {
                        window._photoData = null;
                        document.getElementById('photoName').textContent = 'Tidak ada file';
                        const preview = document.getElementById('photoPreview');
                        if (preview) preview.src = '';
                        const fileInput2 = document.getElementById('inputFoto');
                        if (fileInput2) fileInput2.value = '';
                    });
                }

                const resetPhotoBtn = document.getElementById('resetPhotoBtn');
                if (resetPhotoBtn) {
                    resetPhotoBtn.addEventListener('click', () => {
                        window._photoData = null;
                        document.getElementById('photoName').textContent = 'Tidak ada file';
                        const preview = document.getElementById('photoPreview');
                        if (preview) preview.src = '';
                        const fileInput2 = document.getElementById('inputFoto');
                        if (fileInput2) fileInput2.value = '';
                    });
                }

                document.querySelectorAll('.delete-field').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const field = this.closest('.dynamic-field');
                        if (field) field.remove();
                        Router._updateFieldNumbers();
                    });
                });

                const addBtn = document.getElementById('addDynamicBtn');
                if (addBtn) {
                    addBtn.addEventListener('click', () => this._addDynamicField());
                }
            },

            // ---- FORM BUILDERS ----
            _buildDosenForm(item) {

                const field = document.createElement('div');

                field.innerHTML = `

                    </div>

            _calcAge() {
                const birth = document.getElementById('inputTanggalLahir')?.value;
                const umur = document.getElementById('inputUmur');
                if (birth && umur) {
                    const b = new Date(birth);
                    const today = new Date();
                    let age = today.getFullYear() - b.getFullYear();
                    const m = today.getMonth() - b.getMonth();
                    if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
                    umur.value = age;
                }
            },

            // ---- FORM ACTIONS ----
            saveForm(e) {
                e.preventDefault();
                const mod = this.state.module;
                const isEdit = this.state.editingId !== null;

                if (mod === 'notes') {
                    const title = document.getElementById('inputTitle')?.value?.trim() || '';
                    const content = document.getElementById('inputContent')?.value || '';
                    if (!title) {
                        Notif.error('Judul catatan harus diisi.');
                        return;
                    }
                    const payload = { title, content };
                    if (isEdit) {
                        const updated = AppState.update(mod, this.state.editingId, payload);
                        if (updated) Notif.success('Catatan diperbarui.');
                        else { Notif.error('Gagal memperbarui.'); return; }
                    } else {
                        payload.id = uid();
                        payload.createdAt = new Date().toISOString();
                        AppState.push(mod, payload);
                        Notif.success('Catatan ditambahkan.');
                    }
                    // Clear search before going back to list
                    this.clearSearch();
                    this.state.view = 'list';
                    this.state.editingId = null;
                    this.pushNav(mod, 'list');
                    this.render();
                    this.updateLandingStats();
                    return;
                }

                let payload = {};

                if (mod === 'dosen') payload = this._collectDosenForm();
                else if (mod === 'matkul') payload = this._collectMatkulForm();
                else if (mod === 'kontrak') payload = this._collectKontrakForm();
                else if (mod === 'tugas') payload = this._collectTugasForm();
                else if (mod === 'jadwal') payload = this._collectJadwalForm();

                if (!payload.nama && mod !== 'kontrak' && mod !== 'tugas') {
                    Notif.error('Nama harus diisi');
                    return;
                }
                if (mod === 'kontrak' && !payload.judul) {
                    Notif.error('Judul kontrak harus diisi');
                    return;
                }
                if (mod === 'tugas' && !payload.nama) {
                    Notif.error('Nama tugas harus diisi');
                    return;
                }

                if (isEdit) {
                    const updated = AppState.update(mod, this.state.editingId, payload);
                    if (updated) {
                        Notif.success('Data berhasil diperbarui');
                    } else {
                        Notif.error('Data tidak ditemukan');
                        return;
                    }
                } else {
                    payload.id = uid();
                    payload.createdAt = new Date().toISOString();
                    AppState.push(mod, payload);
                    Notif.success('Data berhasil ditambahkan');
                }

                // Clear search before going back to list
                this.clearSearch();
                this.state.view = 'list';
                this.state.editingId = null;
                this.pushNav(mod, 'list');
                this.render();
                this.updateLandingStats();
            },

            cancelForm() {
                const mod = this.state.module;
                this.clearSearch();
                this.state.view = 'list';
                this.state.editingId = null;
                this.pushNav(mod, 'list');
                this.render();
            },

            _collectJadwalForm() {
                return {
                    matkulId: document.getElementById('inputMatkulId')?.value || '',
                    dosen: document.getElementById('inputDosen')?.value || '',
                    hari: document.getElementById('inputHari')?.value || '',
                    jamMulai: document.getElementById('inputJamMulai')?.value || '',
                    jamSelesai: document.getElementById('inputJamSelesai')?.value || '',
                    ruangan: document.getElementById('inputRuangan')?.value || '',
                    kelas: document.getElementById('inputKelas')?.value || '',
                    catatan: document.getElementById('inputCatatan')?.value || ''
                };
            },

            // ---- PUBLIC HELPERS ----
            openDetail(mod, id) {
                this.state.view = 'detail';
                this.state.selectedId = id;
                this.state.editingId = null;
                // Reset search when viewing detail
                this.clearSearch();
                this.pushNav(mod, 'detail', id);
                this.render();
            },

            editItem(mod, id) {
                this.state.view = 'form';
                this.state.editingId = id;
                // Reset search when editing
                this.clearSearch();
                this.pushNav(mod, 'form', id);
                this.render();
            },

            confirmDelete(mod, id) {
                const item = AppState.find(mod, id);
                const name = item?.nama || item?.judul || item?.matkul || item?.title || 'item';
                Modal.open(
                    'Konfirmasi Hapus',
                    `Apakah Anda yakin ingin menghapus "${name}"? Tindakan ini tidak dapat dibatalkan.`,
                    () => {
                        const removed = AppState.remove(mod, id);
                        if (removed) {
                            Notif.success(`"${name}" berhasil dihapus`);
                        } else {
                            Notif.error('Gagal menghapus data');
                        }
                        this.clearSearch();
                        this.state.view = 'list';
                        this.state.selectedId = null;
                        this.state.editingId = null;
                        this.pushNav(mod, 'list');
                        this.render();
                        this.updateLandingStats();
                    }
                );
            }
        };

        // ---- INIT ----
        document.addEventListener('DOMContentLoaded', () => {
            // Migrasi data dari V3 jika ada
            const migrateV3 = () => {
                const v3Keys = {
                    dosen: 'apc_dosen_v3',
                    matkul: 'apc_matkul_v3',
                    kontrak: 'apc_kontrak_v3',
                    tugas: 'apc_tugas_v3',
                    jadwal: 'apc_jadwal_v3'
                };
                let migrated = false;
                for (const [k, oldKey] of Object.entries(v3Keys)) {
                    try {
                        const oldData = localStorage.getItem(oldKey);
                        if (oldData) {
                            const parsed = JSON.parse(oldData);
                            if (Array.isArray(parsed) && parsed.length > 0 && AppState.get(k).length === 0) {
                                AppState.set(k, parsed);
                                migrated = true;
                            }
                        }
                    } catch {}
                }
                try {
                    const oldNotes = localStorage.getItem('apc_notes_v3');
                    if (oldNotes) {
                        const parsed = JSON.parse(oldNotes);
                        if (Array.isArray(parsed) && parsed.length > 0 && AppState.get('notes').length === 0) {
                            AppState.set('notes', parsed);
                            migrated = true;
                        }
                    }
                } catch {}
                if (migrated) {
                    console.log('🔄 Data dari V3 berhasil dimigrasi.');
                }
            };
            migrateV3();

            Router.init();
            window.Router = Router;
            window.Notif = Notif;

            console.log('✅ Academic Personal Center V4 (Fixed) siap digunakan.');
        });
    </script>
</body>
</html>
