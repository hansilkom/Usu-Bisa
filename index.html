<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>USU BISA — Academic Personal Center</title>
    <meta name="description" content="Platform manajemen akademik personal untuk dosen dan mahasiswa Universitas Sumatera Utara." />
    <meta property="og:title" content="USU BISA — Academic Personal Center" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://usu-bisa.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ============================================================
           ROOT — Design System v6.0 (Premium)
           ============================================================ */
        :root {
            --color-primary: #0a2e24;
            --color-primary-light: #14532d;
            --color-primary-lighter: #1a6e3e;
            --color-primary-bg: #e8f5e9;
            --color-gold: #f5b300;
            --color-gold-light: #ffd54f;
            --color-gold-bg: #fef8e7;
            --color-white: #ffffff;
            --color-bg: #f4f6f9;
            --color-card: #ffffff;
            --color-text: #0f172a;
            --color-text-secondary: #334155;
            --color-text-muted: #94a3b8;
            --color-border: #e9edf2;
            --color-danger: #dc2626;
            --color-danger-hover: #b91c1c;
            --color-success: #16a34a;
            --color-info: #2563eb;
            --color-warning: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --shadow-xl: 0 12px 48px rgba(0, 0, 0, 0.16);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --header-h: 56px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--color-primary);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            padding-bottom: calc(12px + var(--safe-bottom));
            color: var(--color-white);
            line-height: 1.5;
            overscroll-behavior: none;
        }

        .hidden {
            display: none !important;
        }

        /* ============================================================
           LANDING
           ============================================================ */
        .landing {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeUp 0.8s ease both;
            padding: 16px 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .landing-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--color-white);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
            transition: transform 0.3s var(--ease-spring), box-shadow 0.3s ease;
            position: relative;
        }
        .landing-logo:hover {
            transform: scale(1.04);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .landing-logo svg {
            width: 100px;
            height: 100px;
        }

        .landing-title {
            font-size: 3.6rem;
            font-weight: 800;
            color: var(--color-gold-light);
            letter-spacing: -2px;
            margin-bottom: 0;
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
            line-height: 1.05;
        }

        .landing-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
            letter-spacing: 1px;
            font-weight: 400;
        }
        .landing-sub span {
            display: block;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            margin-top: 1px;
        }

        .landing-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: 28px auto 24px;
        }
        .landing-stat {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 12px 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }
        .landing-stat:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .landing-stat .num {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--color-gold-light);
            line-height: 1.2;
        }
        .landing-stat .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .landing-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .landing-menu .menu-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(245, 179, 0, 0.35);
            color: var(--color-gold);
            padding: 11px 6px;
            border-radius: var(--radius-md);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s var(--ease-spring);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 46px;
            letter-spacing: 0.2px;
            font-family: var(--font);
            touch-action: manipulation;
        }
        .landing-menu .menu-btn i {
            font-size: 0.95rem;
            transition: transform 0.2s;
        }
        .landing-menu .menu-btn:hover {
            background: var(--color-gold);
            color: var(--color-primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(245, 179, 0, 0.3);
            border-color: var(--color-gold);
        }
        .landing-menu .menu-btn:hover i {
            transform: scale(1.1);
        }
        .landing-menu .menu-btn:active {
            transform: translateY(0) scale(0.97);
        }
        .landing-menu .menu-btn:focus-visible {
            outline: 3px solid var(--color-gold);
            outline-offset: 2px;
        }

        /* ============================================================
           MAIN CONTAINER
           ============================================================ */
        .main-container {
            width: 100%;
            max-width: 1120px;
            min-height: 88dvh;
            max-height: 96dvh;
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            display: none;
            flex-direction: column;
            color: var(--color-text);
            position: relative;
        }
        .main-container.active {
            display: flex;
        }

        /* fallback */
        @supports not (height: 100dvh) {
            .main-container {
                min-height: 88vh;
                max-height: 96vh;
            }
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--color-white);
            padding: 0 18px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: var(--header-h);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }
        .header-nav-group {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .header-back {
            background: none;
            border: none;
            color: var(--color-text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, transform 0.15s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            touch-action: manipulation;
        }
        .header-back:hover {
            background: var(--color-border);
        }
        .header-back:active {
            transform: scale(0.92);
        }
        .header-home {
            background: none;
            border: none;
            color: var(--color-gold);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, color 0.15s, transform 0.15s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            touch-action: manipulation;
            margin-left: 2px;
        }
        .header-home:hover {
            background: var(--color-gold-bg);
            color: var(--color-primary);
        }
        .header-home:active {
            transform: scale(0.92);
        }
        .header-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 6px;
        }
        .header-title .brand-badge {
            font-size: 0.55rem;
            font-weight: 500;
            color: var(--color-text-muted);
            background: var(--color-bg);
            padding: 1px 10px;
            border-radius: var(--radius-full);
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .header-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-family: var(--font);
            min-height: 34px;
            touch-action: manipulation;
        }
        .header-btn i {
            font-size: 0.9rem;
            transition: transform 0.2s;
        }
        .header-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .header-btn:hover i {
            transform: scale(1.1);
        }
        .header-btn:active {
            transform: scale(0.94);
        }
        .header-btn.outline {
            background: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-border);
        }
        .header-btn.outline:hover {
            background: var(--color-border);
            transform: none;
            box-shadow: none;
        }
        .header-btn.danger {
            background: var(--color-danger);
        }
        .header-btn.danger:hover {
            background: var(--color-danger-hover);
        }
        .header-btn .btn-label {
            display: inline;
        }

        .io-dropdown {
            position: relative;
            display: inline-block;
        }
        .io-dropdown .io-toggle {
            background: transparent;
            border: none;
            color: var(--color-text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            touch-action: manipulation;
        }
        .io-dropdown .io-toggle:hover {
            background: var(--color-border);
        }
        .io-dropdown .io-toggle:active {
            transform: scale(0.92);
        }
        .io-dropdown .io-menu {
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--color-white);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            min-width: 160px;
            padding: 4px 0;
            display: none;
            z-index: 40;
            border: 1px solid var(--color-border);
            animation: scaleIn 0.2s ease;
        }
        .io-dropdown .io-menu.open {
            display: block;
        }
        .io-dropdown .io-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 16px;
            border: none;
            background: none;
            font-family: var(--font);
            font-size: 0.75rem;
            color: var(--color-text);
            cursor: pointer;
            transition: background 0.15s;
            text-align: left;
            min-height: 44px;
            touch-action: manipulation;
        }
        .io-dropdown .io-menu button:hover {
            background: var(--color-bg);
        }
        .io-dropdown .io-menu button i {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            width: 20px;
            text-align: center;
        }
        .io-dropdown .io-menu .divider {
            height: 1px;
            background: var(--color-border);
            margin: 4px 12px;
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        .search-wrap {
            background: var(--color-white);
            padding: 6px 18px;
            border-bottom: 1px solid var(--color-border);
            flex-shrink: 0;
            display: none;
        }
        .search-wrap.visible {
            display: block;
        }
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--color-bg);
            border-radius: var(--radius-full);
            padding: 0 14px;
            border: 2px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(11, 61, 46, 0.06);
        }
        .search-bar .search-icon {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-right: 6px;
            display: flex;
            align-items: center;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 0.8rem;
            font-family: var(--font);
            outline: none;
            min-width: 0;
            color: var(--color-text);
        }
        .search-bar input::placeholder {
            color: var(--color-text-muted);
        }
        .search-bar .clear-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 8px 8px;
            display: none;
            line-height: 1;
            min-width: 44px;
            min-height: 44px;
            touch-action: manipulation;
            transition: opacity 0.2s;
        }
        .search-bar .clear-btn.visible {
            display: block;
        }
        .search-bar .search-submit {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            padding: 4px 14px;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 3px;
            min-height: 28px;
            touch-action: manipulation;
        }
        .search-bar .search-submit:hover {
            background: var(--color-primary-light);
        }
        .search-bar .search-submit:active {
            transform: scale(0.94);
        }
        .search-result-info {
            font-size: 0.65rem;
            color: var(--color-text-muted);
            padding: 4px 4px 0;
        }

        /* ============================================================
           CONTENT
           ============================================================ */
        .content {
            flex: 1;
            padding: 16px 18px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 6px;
        }
        .content::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ============================================================
           UTILITY CLASSES (Premium)
           ============================================================ */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .p-2 { padding: 8px; }
        .p-3 { padding: 12px; }
        .p-4 { padding: 16px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .text-sm { font-size: 0.7rem; }
        .text-base { font-size: 0.8rem; }
        .text-lg { font-size: 0.95rem; }
        .text-xl { font-size: 1.1rem; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .text-center { text-align: center; }
        .text-muted { color: var(--color-text-muted); }
        .text-secondary { color: var(--color-text-secondary); }
        .w-full { width: 100%; }

        /* ============================================================
           DASHBOARD
           ============================================================ */
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 18px;
        }
        .dash-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 14px 8px;
            box-shadow: var(--shadow-sm);
            border-left: 3px solid var(--color-gold);
            text-align: center;
            transition: transform 0.2s var(--ease-spring), box-shadow 0.2s;
        }
        .dash-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .dash-card .num {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--color-primary);
            line-height: 1.2;
        }
        .dash-card .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-text-muted);
            margin-top: 2px;
        }

        .dash-section {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 14px;
            transition: box-shadow 0.2s;
        }
        .dash-section:hover {
            box-shadow: var(--shadow-md);
        }
        .dash-section h3 {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 8px;
        }
        .dash-section h3 .badge {
            background: var(--color-gold-bg);
            color: var(--color-primary);
            font-size: 0.5rem;
            padding: 1px 10px;
            border-radius: var(--radius-full);
            margin-left: auto;
            font-weight: 600;
        }
        .dash-section h3 .section-actions {
            margin-left: auto;
            display: flex;
            gap: 4px;
        }
        .dash-section h3 .section-actions button {
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, color 0.15s;
            font-family: var(--font);
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .dash-section h3 .section-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }

        .dash-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 12px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f1f3f6;
        }
        .dash-item:last-child {
            border-bottom: none;
        }
        .dash-item .dash-label {
            font-size: 0.78rem;
            color: var(--color-text-secondary);
            word-break: break-word;
            min-width: 0;
        }
        .dash-item .dash-label .sub {
            display: block;
            font-size: 0.62rem;
            color: var(--color-text-muted);
            font-weight: 400;
            margin-top: 1px;
        }
        .dash-item .dash-value {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--color-text);
            text-align: right;
            white-space: nowrap;
        }
        .dash-item .dash-value.highlight {
            color: var(--color-danger);
        }
        .dash-item .dash-value.success {
            color: var(--color-success);
        }

        .dash-empty {
            color: var(--color-text-muted);
            font-size: 0.78rem;
            text-align: center;
            padding: 16px 0;
        }

        .briefing-card {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            box-shadow: var(--shadow-md);
            margin-bottom: 18px;
            border-left: 4px solid var(--color-gold);
            transition: all 0.2s;
            position: relative;
        }
        .briefing-card .briefing-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .briefing-card .briefing-header .greeting {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 0;
        }
        .briefing-card .briefing-header .archive-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 0.6rem;

        }
        .archive-item {

        .archive-item .delete-link {

            border: none;

            align-items: center;

        /* ============================================================
           LIHAT MODAL
           ============================================================ */
        .lihat-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            padding: 20px;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.2s ease;
        }
        .lihat-modal-overlay.active {
            display: flex;
        }
        .lihat-modal {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: 20px 18px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.25s var(--ease-spring);
        }
        .lihat-modal h3 {
            font-size: 0.9rem;
            color: var(--color-text);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lihat-modal h3 i {
            color: var(--color-gold);
        }
        .lihat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .lihat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 4px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--color-border);
            background: var(--color-white);
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            font-size: 0.55rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            gap: 4px;
            font-family: var(--font);
            min-height: 60px;
            position: relative;
            touch-action: manipulation;
        }
        .lihat-item i {
            font-size: 1.4rem;
            transition: transform 0.2s;
        }
        .lihat-item .count-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--color-primary);
            color: #fff;
            font-size: 0.5rem;
            padding: 0 6px;
            border-radius: var(--radius-full);
            min-width: 18px;
            text-align: center;
            font-weight: 700;
        }
        .lihat-item.active {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
            color: var(--color-primary);
        }
        .lihat-item.active:hover {
            background: var(--color-primary);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .lihat-item.active:hover i {
            transform: scale(1.1);
        }
        .lihat-item.inactive {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .lihat-item.inactive:hover {
            transform: none;
            box-shadow: none;
        }
        .lihat-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
            border-top: 1px solid var(--color-border);
            padding-top: 12px;
        }
        .lihat-actions button {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
            border: none;
            font-family: var(--font);
            transition: all 0.2s var(--ease-spring);
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .lihat-actions button:hover {
            transform: scale(1.02);
        }
        .lihat-actions button:active {
            transform: scale(0.94);
        }
        .lihat-archive {
            background: var(--color-primary);
            color: #fff;
        }
        .lihat-archive:hover {
            background: var(--color-primary-light);
        }
        .lihat-delete {
            background: var(--color-danger);
            color: #fff;
        }
        .lihat-delete:hover {
            background: var(--color-danger-hover);
        }
        .lihat-close {
            background: var(--color-border);
            color: var(--color-text-secondary);
        }
        .lihat-close:hover {
            background: var(--color-bg);
        }

        }

        .lihat-pilihan-modal .pilihan-list {
            display: flex;

            gap: 4px;
        }
        .lihat-pilihan-modal .pilihan-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;

        .lihat-pilihan-modal .pilihan-close {

            color: var(--color-text-secondary);

        .lihat-pilihan-modal .pilihan-close:hover {

        }
        .lihat-pilihan-modal .pilihan-close:active {
            transform: scale(0.94);
        }

        /* ============================================================
           RELATION BLOCK
           ============================================================ */
        .relation-block {
            background: var(--color-card);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            box-shadow: var(--shadow-sm);
            margin-top: 12px;
            border-top: 1px solid var(--color-border);
            text-align: center;
        }
        .relation-block .lihat-terkait-btn {
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            min-width: 44px;
            touch-action: manipulation;
        }
        .relation-block .lihat-terkait-btn:hover {
            background: var(--color-primary-light);
            transform: scale(1.02);
        }
        .relation-block .lihat-terkait-btn:active {
            transform: scale(0.94);
        }

        /* ============================================================
           NOTES
           ============================================================ */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }
        .note-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            transition: all 0.2s var(--ease-spring);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .note-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-4px);
            border-color: var(--color-gold);
        }
        .note-card .note-title {
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--color-text);
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .note-card .note-title .del-note {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 0.65rem;
            padding: 8px 8px;
            transition: color 0.15s, transform 0.15s;
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .note-card .note-title .del-note:hover {
            color: var(--color-danger);
            transform: scale(1.1);
        }
        .note-card .note-title .del-note:active {
            transform: scale(0.92);
        }
        .note-card .note-preview {
            font-size: 0.68rem;
            color: var(--color-text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-card .note-date {
            font-size: 0.5rem;
            color: var(--color-text-muted);
            margin-top: 4px;
        }
        .note-add-btn {
            background: var(--color-white);
            border: 2px dashed var(--color-primary);
            color: var(--color-primary);
            padding: 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-size: 0.7rem;
            font-weight: 500;
            transition: all 0.2s var(--ease-spring);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
            min-height: 44px;
            touch-action: manipulation;
        }
        .note-add-btn:hover {
            background: var(--color-gold-bg);
            border-style: solid;
        }
        .note-add-btn:active {
            transform: scale(0.96);
        }

        /* ============================================================
           LIST VIEW
           ============================================================ */
        .module-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .list-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }
        .list-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-sm);
            opacity: 0;
            background: linear-gradient(135deg, rgba(245, 179, 0, 0.06), transparent);
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .list-card:hover::after {
            opacity: 1;
        }
        .list-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
            border-color: var(--color-gold);
        }
        .list-card:active {
            transform: scale(0.97);
        }
        .list-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--color-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--color-gold);
            cursor: pointer;
            transition: transform 0.2s var(--ease-spring);
            position: relative;
        }
        .list-avatar:hover {
            transform: scale(1.05);
        }
        .list-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .list-avatar .avatar-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            background: var(--color-primary-light);
            text-transform: uppercase;
        }
        .list-info {
            flex: 1;
            min-width: 0;
        }
        .list-info .primary {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-info .secondary {
            font-size: 0.62rem;
            color: var(--color-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-badge {
            font-size: 0.5rem;
            background: var(--color-gold-bg);
            color: var(--color-primary);
            padding: 0 10px;
            border-radius: var(--radius-full);
            font-weight: 600;
            flex-shrink: 0;
            border: 1px solid rgba(245, 179, 0, 0.15);
            white-space: nowrap;
        }
        .list-empty {
            text-align: center;
            padding: 32px 16px;
            color: var(--color-text-muted);
            grid-column: 1 / -1;
        }
        .list-empty .icon {
            font-size: 2rem;
            margin-bottom: 8px;
            opacity: 0.3;
        }
        .list-empty p {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .list-empty .sub {
            font-size: 0.7rem;
            color: var(--color-text-muted);
        }
        .list-back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            font-family: var(--font);
            font-size: 0.7rem;
            min-height: 44px;
            touch-action: manipulation;
        }
        .list-back-btn:hover {
            background: var(--color-primary-light);
        }
        .list-back-btn:active {
            transform: scale(0.94);
        }

            animation: fadeUp 0.3s ease;
        }
        .detail-view.active {
            display: block;
        }

        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--color-border);
            text-align: center;

        .detail-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--color-primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 700;
            overflow: hidden;
            border: 3px solid var(--color-gold);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s var(--ease-spring);
        }
        .detail-photo:hover {
            transform: scale(1.04);
        }
        .detail-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .detail-photo .detail-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            background: var(--color-primary-light);
            text-transform: uppercase;
        }
        .detail-name h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--color-text);
        }
        .detail-name .sub {
            font-size: 0.68rem;
            color: var(--color-text-muted);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .detail-item {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s;
        }
        .detail-item:hover {
            box-shadow: var(--shadow-md);
        }
        .detail-item .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .detail-item .value {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--color-text);
            word-break: break-word;
        }
        .detail-item .value a {
            color: var(--color-primary);
            text-decoration: none;
        }
        .detail-item .value a:hover {
            text-decoration: underline;
        }

        .detail-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--color-border);
            flex-wrap: wrap;
        }
        .detail-actions button {
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font);
            min-height: 44px;
            touch-action: manipulation;
        }
        .btn-edit {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-edit:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-edit:active {
            transform: scale(0.94);
        }
        .btn-delete {
            background: #fff;
            color: var(--color-danger);
            border: 1.5px solid var(--color-danger);
        }
        .btn-delete:hover {
            background: var(--color-danger);
            color: #fff;
        }
        .btn-delete:active {
            transform: scale(0.94);
        }

        /* ============================================================
           FORM VIEW
           ============================================================ */
        .form-view {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .form-view.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 2px;
            letter-spacing: 0.2px;
        }
        .form-group label .required {
            color: var(--color-danger);
            margin-left: 2px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-family: var(--font);
            background: var(--color-white);
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--color-text);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 61, 46, 0.06);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 44px;
        }
        .form-group input[readonly] {
            background: var(--color-bg);
            cursor: not-allowed;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--color-border);
        }
        .form-section h4 {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .form-section h4 .toggle-icon {
            transition: transform 0.2s;
            font-size: 0.8rem;
            margin-left: auto;
        }
        .form-section h4 .toggle-icon.open {
            transform: rotate(180deg);
        }
        .form-section .section-body {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.25s ease;
            max-height: 0;
            opacity: 0;
        }
        .form-section .section-body.open {
            max-height: 2000px;
            opacity: 1;
        }

        .photo-upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            border: 2px dashed var(--color-border);
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .photo-upload-area.dragover {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }
        .photo-upload-area .photo-preview-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--color-gold);
            box-shadow: var(--shadow-sm);
            background: var(--color-white);
            flex-shrink: 0;
        }
        .photo-upload-area .photo-preview-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-upload-area .photo-preview-wrap .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--color-text-muted);
            font-size: 2.2rem;
            background: var(--color-bg);
        }
        .photo-upload-area .photo-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            width: 100%;
        }
        .photo-upload-area .photo-controls button,
        .photo-upload-area .photo-controls label {
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            border: 1px solid var(--color-border);
            background: var(--color-white);
            color: var(--color-text-secondary);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 3px;
            min-height: 44px;
            touch-action: manipulation;
        }
        .photo-upload-area .photo-controls button:hover,
        .photo-upload-area .photo-controls label:hover {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }
        .photo-upload-area .photo-controls button:active,
        .photo-upload-area .photo-controls label:active {
            transform: scale(0.94);
        }
        .photo-upload-area .photo-controls button.danger:hover {
            background: var(--color-danger);
            border-color: var(--color-danger);
        }
        .photo-upload-area .photo-controls input[type="file"] {
            display: none;
        }
        .photo-upload-area .photo-filename {
            font-size: 0.55rem;
            color: var(--color-text-muted);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .crop-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 16px;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease;
        }
        .crop-overlay.active {
            display: flex;
        }
        .crop-modal {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: 16px;
            max-width: 460px;
            width: 100%;
            max-height: 90vh;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.25s var(--ease-spring);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .crop-modal h3 {
            font-size: 0.85rem;
            color: var(--color-text);
            margin-bottom: 6px;
            text-align: center;
        }
        .crop-modal .crop-canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background: #1a1a2e;
            border-radius: var(--radius-sm);
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }
        .crop-modal .crop-canvas-wrap:active {
            cursor: grabbing;
        }
        .crop-modal .crop-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .crop-modal .crop-canvas-wrap .crop-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            aspect-ratio: 1/1;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .crop-modal .crop-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            padding: 8px 0 4px;
        }
        .crop-modal .crop-controls label {
            font-size: 0.55rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .crop-modal .crop-controls input[type="range"] {
            width: 80px;
            accent-color: var(--color-primary);
        }
        .crop-modal .crop-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            padding-top: 8px;
            border-top: 1px solid var(--color-border);
        }
        .crop-modal .crop-actions button {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.68rem;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            border: none;
            font-family: var(--font);
            min-height: 44px;
            touch-action: manipulation;
        }
        .crop-modal .crop-actions .crop-cancel {
            background: var(--color-white);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }
        .crop-modal .crop-actions .crop-cancel:hover {
            background: var(--color-bg);
        }
        .crop-modal .crop-actions .crop-apply {
            background: var(--color-primary);
            color: #fff;
        }
        .crop-modal .crop-actions .crop-apply:hover {
            background: var(--color-primary-light);
        }
        .crop-modal .crop-actions button:active {
            transform: scale(0.94);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .form-actions button {
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.76rem;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            border: none;
            flex: 1;
            min-width: 80px;
            font-family: var(--font);
            min-height: 44px;
            touch-action: manipulation;
        }
        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-primary:active {
            transform: scale(0.94);
        }
        .btn-secondary {
            background: var(--color-white);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }
        .btn-secondary:hover {
            background: var(--color-bg);
        }
        .btn-secondary:active {
            transform: scale(0.94);
        }

        .dynamic-fields {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--color-border);
        }
        .dynamic-fields h4 {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 6px;
        }
        .dynamic-field {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .dynamic-field:hover {
            border-color: var(--color-primary-lighter);
        }
        .dynamic-field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .dynamic-field-header strong {
            font-size: 0.65rem;
            color: var(--color-text-secondary);
        }
        .dynamic-field-header .delete-field {
            background: none;
            border: none;
            color: var(--color-danger);
            font-weight: 600;
            font-size: 0.6rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s, color 0.15s, transform 0.15s;
            font-family: var(--font);
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .dynamic-field-header .delete-field:hover {
            background: var(--color-danger);
            color: #fff;
        }
        .dynamic-field-header .delete-field:active {
            transform: scale(0.92);
        }
        .add-field-btn {
            background: var(--color-white);
            border: 2px dashed var(--color-primary);
            color: var(--color-primary);
            padding: 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            font-size: 0.7rem;
            font-weight: 500;
            transition: all 0.2s var(--ease-spring);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 44px;
            touch-action: manipulation;
        }
        .add-field-btn:hover {
            background: var(--color-gold-bg);
            border-style: solid;
        }
        .add-field-btn:active {
            transform: scale(0.96);
        }

        /* ============================================================
           LIGHTBOX
           ============================================================ */
        .photo-lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            padding: 20px;
            backdrop-filter: blur(12px);
            animation: fadeIn 0.25s ease;
            cursor: pointer;
        }
        .photo-lightbox.active {
            display: flex;
        }
        .photo-lightbox .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            cursor: default;
            animation: scaleIn 0.25s var(--ease-spring);
        }
        .photo-lightbox .lightbox-content img {
            display: block;
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-xl);
            border: 2px solid rgba(255,255,255,0.1);
            object-fit: contain;
        }
        .photo-lightbox .lightbox-close {
            position: absolute;
            top: -44px;
            right: 0;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font);
            touch-action: manipulation;
        }
        .photo-lightbox .lightbox-close:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        .photo-lightbox .lightbox-close:active {
            transform: scale(0.92);
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--color-card);
            border-radius: var(--radius-md);
            padding: 20px 18px;
            max-width: 380px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: scaleIn 0.25s var(--ease-spring);
        }
        @keyframes scaleIn {
            from {
                transform: scale(0.92);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal h3 {
            font-size: 0.9rem;
            color: var(--color-text);
            margin-bottom: 4px;
        }
        .modal p {
            color: var(--color-text-secondary);
            margin-bottom: 14px;
            line-height: 1.5;
            font-size: 0.78rem;
        }
        .modal-buttons {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            border: none;
            font-family: var(--font);
            min-height: 44px;
            touch-action: manipulation;
        }
        .modal-cancel {
            background: var(--color-white);
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
        }
        .modal-cancel:hover {
            background: var(--color-bg);
        }
        .modal-cancel:active {
            transform: scale(0.94);
        }
        .modal-confirm {
            background: var(--color-danger);
            color: #fff;
        }
        .modal-confirm:hover {
            background: var(--color-danger-hover);
        }
        .modal-confirm:active {
            transform: scale(0.94);
        }

        /* ============================================================
           NOTIFICATIONS
           ============================================================ */
        .notif-container {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: none;
            max-width: 300px;
            width: calc(100% - 24px);
        }
        .notif {
            background: var(--color-text);
            color: #fff;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            pointer-events: auto;
            animation: slideRight 0.3s var(--ease-spring);
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .notif.success {
            background: var(--color-success);
        }
        .notif.error {
            background: var(--color-danger);
        }
        .notif.info {
            background: var(--color-info);
        }
        .notif .close {
            cursor: pointer;
            background: none;
            border: none;
            color: #fff;
            font-size: 0.9rem;
            padding: 0 2px;
            margin-left: auto;
            opacity: 0.7;
            transition: opacity 0.15s, transform 0.15s;
            line-height: 1;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .notif .close:hover {
            opacity: 1;
        }
        .notif .close:active {
            transform: scale(0.92);
        }
        @keyframes slideRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .app-footer {
            text-align: center;
            padding: 10px 0 4px;
            border-top: 1px solid var(--color-border);
            margin-top: 8px;
            color: var(--color-text-muted);
            font-size: 0.6rem;
        }
        .app-footer a {
            color: var(--color-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
            transition: color 0.2s, transform 0.15s;
            padding: 8px 8px;
            min-height: 44px;
            min-width: 44px;
            touch-action: manipulation;
        }
        .app-footer a:hover {
            color: var(--color-gold);
        }
        .app-footer a:active {
            transform: scale(0.94);
        }
        .app-footer a i {
            font-size: 0.8rem;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 4px;
            }
            .landing-logo {
                width: 110px;
                height: 110px;
            }
            .landing-logo svg {
                width: 76px;
                height: 76px;
            }
            .landing-title {
                font-size: 2.6rem;
            }
            .landing-stats {
                gap: 4px;
                max-width: 260px;
            }
            .landing-stat .num {
                font-size: 1.1rem;
            }
            .landing-menu {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }
            .landing-menu .menu-btn {

    <!-- ============================================================
    JAVASCRIPT — USU BISA v6.0 (Premium)
    ============================================================ -->
    <script>
        /**
         * ================================================================
         *  USU BISA — v6.0 (Premium)
         *  
         *  Semua fungsi bisnis dipertahankan.
         *  Perbaikan: micro-interactions, touch targets, spacing, aksesibilitas,
         *  performa (debounce, requestAnimationFrame), dan konsistensi UI.
         *  ================================================================
         */
        (function() {
            'use strict';

            const STORE_PREFIX = 'usu_bisa_';
            const MODULES = ['dosen', 'matkul', 'kontrak', 'tugas', 'jadwal', 'notes'];
            const MODULE_LABELS = {
                dosen: 'Dosen',
                matkul: 'Mata Kuliah',
                kontrak: 'Kontrak Kuliah',
                tugas: 'Tugas',
                jadwal: 'Jadwal',
                notes: 'Catatan'
            };
            const MODULE_ICONS = {
                dosen: 'bi-person-badge',
                matkul: 'bi-book',
                kontrak: 'bi-clipboard',
                tugas: 'bi-file-text',
                jadwal: 'bi-calendar',
                notes: 'bi-pencil-square'
            };

            const DAY_NAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

            const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const findById = (arr, id) => arr.find(item => item.id === id);
            const findIndexById = (arr, id) => arr.findIndex(item => item.id === id);
            const safeJSON = (str) => { try { return JSON.parse(str); } catch { return null; } };

            function escapeHTML(str) {
                if (!str) return '';
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#x27;',
                    '/': '&#x2F;',
                };
                return String(str).replace(/[&<>"'/]/g, s => map[s]);
            }

            function compressImage(dataUrl, maxSize = 200) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width,
                            h = img.height;
                        if (w > h) {
                            if (w > maxSize) { h = h * maxSize / w;
                                w = maxSize; }
                        } else {
                            if (h > maxSize) { w = w * maxSize / h;
                                h = maxSize; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                });
            }

            // ================================================================
            //  STORAGE
            // ================================================================
            const Storage = {
                load(module) {
                    try {
                        const raw = localStorage.getItem(STORE_PREFIX + module);
                        return raw ? safeJSON(raw) : [];
                    } catch { return []; }
                },
                save(module, data) {
                    try { localStorage.setItem(STORE_PREFIX + module, JSON.stringify(data)); } catch (e) { console.warn(
                            'Storage error:', e); }
                },
                loadAll() {
                    const result = {};
                    MODULES.forEach(m => { result[m] = this.load(m); });
                    return result;
                },
                saveAll(data) {
                    MODULES.forEach(m => { this.save(m, data[m] || []); });
                },
                loadSettings() {
                    try {
                        const raw = localStorage.getItem(STORE_PREFIX + 'settings');
                        return raw ? safeJSON(raw) : {};
                    } catch { return {}; }
                },
                saveSettings(settings) {
                    localStorage.setItem(STORE_PREFIX + 'settings', JSON.stringify(settings));
                },
                loadArchive() {
                    try {
                        const raw = localStorage.getItem(STORE_PREFIX + 'archive');
                        return raw ? safeJSON(raw) : [];
                    } catch { return []; }
                },
                saveArchive(items) {
                    localStorage.setItem(STORE_PREFIX + 'archive', JSON.stringify(items));
                }
            };

            // ================================================================
            //  TANGGAL LOKAL
            // ================================================================
            function getLocalDateString(date) {
                const d = date || new Date();
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function getLocalDate(dateStr) {
                if (!dateStr) return null;
                const parts = dateStr.split('-');
                if (parts.length !== 3) return null;
                return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            }

            function isSameDay(date1, date2) {
                return date1.getFullYear() === date2.getFullYear() &&
                    date1.getMonth() === date2.getMonth() &&
                    date1.getDate() === date2.getDate();
            }

            // ================================================================
            //  APP STATE (tidak berubah)
            // ================================================================
            class AppState {
                constructor() {
                    this.data = Storage.loadAll();
                    this.settings = Storage.loadSettings();
                    this.archive = Storage.loadArchive();
                    this.migrateAll();
                    this._autoArchiveExpired();
                }

                migrateAll() {
                    const matkuls = this.get('matkul');
                    let changed = false;
                    matkuls.forEach(m => {
                        if (!('jamMasuk' in m)) { m.jamMasuk = null;
                            changed = true; }
                        if (!('jamSelesai' in m)) { m.jamSelesai = null;
                            changed = true; }
                        if (!('hari' in m)) { m.hari = null;
                            changed = true; }
                        if (!('dosenId' in m)) { m.dosenId = null;
                            changed = true; }
                        if (m.jamMasuk && typeof m.jamMasuk === 'string' && m.jamMasuk.includes('.')) {
                            m.jamMasuk = m.jamMasuk.replace('.', ':');
                            changed = true;
                            if (m.sks) {
                                m.jamSelesai = this._calculateEndTime(m.jamMasuk, m.sks);
                            }
                        }
                        if (m.jamMasuk && m.sks && !m.jamSelesai) {
                            m.jamSelesai = this._calculateEndTime(m.jamMasuk, m.sks);
                            changed = true;
                        }
                    });
                    if (changed) {
                        this.set('matkul', matkuls);
                    }

                    const tugass = this.get('tugas');
                    let tugasChanged = false;
                    tugass.forEach(t => {
                        if (!('dosenId' in t)) {
                            t.dosenId = null;
                            tugasChanged = true;
                        }
                        if (t.dosen && !t.dosenId) {
                            const dosen = this.find('dosen', t.dosen);
                            if (dosen) {
                                t.dosenId = t.dosen;
                                tugasChanged = true;
                            }
                        }
                    });
                    if (tugasChanged) {
                        this.set('tugas', tugass);
                    }

                    const jadwals = this.get('jadwal');
                    let jadwalChanged = false;
                    jadwals.forEach(j => {
                        if (!('dosenId' in j)) {
                            j.dosenId = null;
                            jadwalChanged = true;
                        }
                        if (j.dosen && !j.dosenId) {
                            const dosen = this.find('dosen', j.dosen);
                            if (dosen) {
                                j.dosenId = j.dosen;
                                jadwalChanged = true;
                            }
                        }
                    });
                    if (jadwalChanged) {
                        this.set('jadwal', jadwals);
                    }

                    const kontraks = this.get('kontrak');
                    let kontrakChanged = false;
                    kontraks.forEach(k => {
                        if (!('dosenId' in k)) {
                            k.dosenId = null;
                            kontrakChanged = true;
                        }
                    });
                    if (kontrakChanged) {
                        this.set('kontrak', kontraks);
                    }
                }

                _autoArchiveExpired() {
                    const now = new Date();
                    const todayDateStr = getLocalDateString(now);
                    const allReminders = this._generateAllReminders(todayDateStr);
                    const archive = this.getArchive();
                    const archivedIds = new Set(archive.map(a => a.id));

                    let newArchive = [...archive];
                    let added = 0;
                    allReminders.forEach(r => {
                        if (!archivedIds.has(r.id) && r.priority > 1) {
                            newArchive.push({
                                ...r,
                                timestamp: Date.now(),
                                deleted: false
                            });
                            added++;
                        }
                    });

                    const sevenDays = 7 * 24 * 60 * 60 * 1000;
                    const filteredArchive = newArchive.filter(a => {
                        if (!a.tanggalKejadian) return true;
                        const eventDate = getLocalDate(a.tanggalKejadian);
                        if (!eventDate) return true;
                        const diff = now.getTime() - eventDate.getTime();
                        return diff < sevenDays;
                    });

                    this.setArchive(filteredArchive);
                }

                _generateAllReminders(todayDateStr) {
                    const now = new Date();
