    ============================================================ -->
    <script>
        /**
         * ================================================================
         *  USU BISA — v4.1 (Final)
         *  - Search now keeps module intact (no forced switch)
         *  - All previous fixes retained (XSS, import validation, crop, etc.)
         *  - Clean, stable, production-ready
         *  ================================================================
         */
        (function() {
            'use strict';

            const STORE_PREFIX = 'usu_bisa_';
            const MODULES = ['dosen', 'matkul', 'kontrak', 'tugas', 'jadwal', 'notes'];
            const MODULE_LABELS = {
                dosen: 'Dosen',
                matkul: 'Mata Kuliah',
                kontrak: 'Kontrak Kuliah',
                tugas: 'Tugas',
                jadwal: 'Jadwal',
                notes: 'Catatan'
            };
            const MODULE_ICONS = {
                dosen: 'bi-person-badge',
                matkul: 'bi-book',
                kontrak: 'bi-clipboard',
                tugas: 'bi-file-text',
                jadwal: 'bi-calendar',
                notes: 'bi-pencil-square'
            };

            const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const findById = (arr, id) => arr.find(item => item.id === id);
            const findIndexById = (arr, id) => arr.findIndex(item => item.id === id);
            const safeJSON = (str) => { try { return JSON.parse(str); } catch { return null; } };

            function escapeHTML(str) {
                if (!str) return '';
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#x27;',
                    '/': '&#x2F;',
                };
                return String(str).replace(/[&<>"'/]/g, s => map[s]);
            }

            function compressImage(dataUrl, maxSize = 200) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width,
                            h = img.height;
                        if (w > h) {
                            if (w > maxSize) { h = h * maxSize / w;
                                w = maxSize; }
                        } else {
                            if (h > maxSize) { w = w * maxSize / h;
                                h = maxSize; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                });
            }

            const Storage = {
                load(module) {
                    try {
                        const raw = localStorage.getItem(STORE_PREFIX + module);
                        return raw ? safeJSON(raw) : [];
                    } catch { return []; }
                },
                save(module, data) {
                    try { localStorage.setItem(STORE_PREFIX + module, JSON.stringify(data)); } catch (e) { console.warn(
                            'Storage error:', e); }
                },
                loadAll() {
                    const result = {};
                    MODULES.forEach(m => { result[m] = this.load(m); });
                    return result;
                },
                saveAll(data) {
                    MODULES.forEach(m => { this.save(m, data[m] || []); });
                },
                loadSettings() {
                    try {
                        const raw = localStorage.getItem(STORE_PREFIX + 'settings');
                        return raw ? safeJSON(raw) : {};
                    } catch { return {}; }
                },
                saveSettings(settings) {
                    localStorage.setItem(STORE_PREFIX + 'settings', JSON.stringify(settings));
                }
            };

            class AppState {
                constructor() {
                    this.data = Storage.loadAll();
                    this.settings = Storage.loadSettings();
                    this._ipkTarget = this.settings.ipkTarget || 3.5;
                    this._ipkCurrent = this.settings.ipkCurrent || 3.0;
                }

                get(module) { return this.data[module] || []; }
                set(module, items) {
                    this.data[module] = items;
                    Storage.save(module, items);
                }
                push(module, item) {
                    const arr = this.get(module);
                    arr.push(item);
                    this.set(module, arr);
                    return item;
                }
                update(module, id, payload) {
                    const arr = this.get(module);
                    const idx = findIndexById(arr, id);
                    if (idx === -1) return null;
                    arr[idx] = { ...arr[idx], ...payload };
                    this.set(module, arr);
                    return arr[idx];
                }
                remove(module, id) {
                    const arr = this.get(module);
                    const idx = findIndexById(arr, id);
                    if (idx === -1) return null;
                    const removed = arr.splice(idx, 1)[0];
                    this.set(module, arr);
                    return removed;
                }
                find(module, id) { return findById(this.get(module), id); }

                getMatkulByDosen(dosenId) {
                    return this.get('matkul').filter(m => m.dosenId === dosenId);
                }
                getKontrakByMatkul(matkulId) {
                    return this.get('kontrak').filter(k => k.matkulId === matkulId);
                }
                getTugasByMatkul(matkulId) {
                    return this.get('tugas').filter(t => t.matkulId === matkulId);
                }
                getJadwalByHari(hari) {
                    return this.get('jadwal').filter(j => j.hari === hari);
                }

                stats() {
                    return {
                        dosen: this.get('dosen').length,
                        matkul: this.get('matkul').length,
                        tugas: this.get('tugas').length,
                        kontrak: this.get('kontrak').length,
                        jadwal: this.get('jadwal').length,
                        notes: this.get('notes').length
                    };
                }

                getSettings() { return this.settings; }
                updateSettings(payload) {
                    this.settings = { ...this.settings, ...payload };
                    Storage.saveSettings(this.settings);
                    if (payload.ipkTarget !== undefined) this._ipkTarget = payload.ipkTarget;
                    if (payload.ipkCurrent !== undefined) this._ipkCurrent = payload.ipkCurrent;
                    return this.settings;
                }
                get ipkTarget() { return this._ipkTarget; }
                get ipkCurrent() { return this._ipkCurrent; }

                exportModule(module) {
                    return this.get(module);
                }
                importModule(module, data) {
                    if (!Array.isArray(data)) throw new Error('Data harus berupa array.');
                    const valid = data.every(item => typeof item === 'object' && item !== null && item.id);
                    if (!valid) {
                        throw new Error(
                            'Format data tidak valid. Setiap item harus memiliki properti "id".');
                    }
                    const existing = this.get(module);
                    const existingIds = new Set(existing.map(item => item.id));
                    let added = 0;
                    data.forEach(item => {
                        if (!existingIds.has(item.id)) {
                            existing.push(item);
                            added++;
                        }
                    });
                    this.set(module, existing);
                    return added;
                }
            }

            const Notif = {
                container: document.getElementById('notifContainer'),
                show(message, type = 'info') {
                    const container = this.container;
                    while (container.children.length >= 3) container.removeChild(container.firstChild);
                    const el = document.createElement('div');
                    el.className = `notif ${type}`;
                    const icons = { success: 'bi-check-circle', error: 'bi-exclamation-circle',
                        info: 'bi-info-circle' };
                    const icon = icons[type] || 'bi-info-circle';
                    el.innerHTML =
                        `<i class="bi ${icon}"></i><span>${escapeHTML(message)}</span><button class="close" onclick="this.parentElement.remove()" aria-label="Tutup notifikasi"><i class="bi bi-x-lg"></i></button>`;
                    container.appendChild(el);
                    setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
                },
                success(msg) { this.show(msg, 'success'); },
                error(msg) { this.show(msg, 'error'); },
                info(msg) { this.show(msg, 'info'); }
            };

            const Modal = {
                overlay: document.getElementById('modalOverlay'),
                title: document.getElementById('modalTitle'),
                message: document.getElementById('modalMessage'),
                confirmBtn: document.getElementById('modalConfirm'),
                cancelBtn: document.getElementById('modalCancel'),
                _callback: null,

                open(title, message, onConfirm) {
                    this.title.textContent = title || 'Konfirmasi';
                    this.message.textContent = message || 'Apakah Anda yakin?';
                    this._callback = onConfirm || null;
                    this.overlay.classList.add('active');
                    setTimeout(() => this.confirmBtn.focus(), 50);
                },
                close() {
                    this.overlay.classList.remove('active');
                    this._callback = null;
                    document.getElementById('actionBtn')?.focus();
                },
                confirm() {
                    if (this._callback) this._callback();
                    this.close();
                },
                init() {
                    this.cancelBtn.addEventListener('click', () => this.close());
                    this.confirmBtn.addEventListener('click', () => this.confirm());
                    this.overlay.addEventListener('click', (e) => {
                        if (e.target === this.overlay) this.close();
                    });
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.overlay.classList.contains('active')) {
                            this.close();
                        }
                    });
                }
            };

            const CropTool = {
                overlay: document.getElementById('cropOverlay'),
                canvas: document.getElementById('cropCanvas'),
                wrap: document.getElementById('cropWrap'),
                zoomSlider: document.getElementById('cropZoom'),
                cancelBtn: document.getElementById('cropCancel'),
                applyBtn: document.getElementById('cropApply'),
                _image: null,
                _zoom: 1,
                _offsetX: 0,
                _offsetY: 0,
                _isDragging: false,
                _dragStartX: 0,
                _dragStartY: 0,
                _startOffX: 0,
                _startOffY: 0,
                _callback: null,
                _ctx: null,

                init() {
                    this._ctx = this.canvas.getContext('2d');
                    this.zoomSlider.addEventListener('input', () => {
                        this._zoom = parseFloat(this.zoomSlider.value);
                        this._render();
                    });
                    this.cancelBtn.addEventListener('click', () => this.close());
                    this.applyBtn.addEventListener('click', () => this.apply());

                    const startDrag = (cx, cy) => {
                        if (!this._image) return;
                        const rect = this.canvas.getBoundingClientRect();
                        this._isDragging = true;
                        this._dragStartX = cx;
                        this._dragStartY = cy;
                        this._startOffX = this._offsetX;
                        this._startOffY = this._offsetY;
                        this.canvas.style.cursor = 'grabbing';
                    };
                    const moveDrag = (cx, cy) => {
                        if (!this._isDragging) return;
                        const dx = cx - this._dragStartX;
                        const dy = cy - this._dragStartY;
                        const rect = this.canvas.getBoundingClientRect();
                        const scale = this._zoom;
                        this._offsetX = this._startOffX + dx / (rect.width / 2) / scale;
                        this._offsetY = this._startOffY + dy / (rect.height / 2) / scale;
                        this._render();
                    };
                    const endDrag = () => {
                        this._isDragging = false;
                        this.canvas.style.cursor = 'grab';
                    };

                    this.canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
                    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
                    window.addEventListener('mouseup', endDrag);

                    this.canvas.addEventListener('touchstart', (e) => {
                        const t = e.touches[0];
                        startDrag(t.clientX, t.clientY);
                    }, { passive: true });
                    this.canvas.addEventListener('touchmove', (e) => {
                        if (this._isDragging) {
                            const t = e.touches[0];
                            moveDrag(t.clientX, t.clientY);
                        }
                    }, { passive: true });
                    this.canvas.addEventListener('touchend', endDrag, { passive: true });

                    this.canvas.addEventListener('wheel', (e) => {
                        e.preventDefault();
                        const delta = e.deltaY > 0 ? -0.05 : 0.05;
                        let newZoom = this._zoom + delta;
                        newZoom = Math.max(0.5, Math.min(3, newZoom));
                        this.zoomSlider.value = newZoom;
                        this._zoom = newZoom;
                        this._render();
                    }, { passive: false });

                    this.canvas.addEventListener('dblclick', () => {
                        this.zoomSlider.value = 1;
                        this._zoom = 1;
                        this._offsetX = 0;
                        this._offsetY = 0;
                        this._render();
                    });

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && this.overlay.classList.contains('active')) {
                            this.close();
                        }
                    });
                },

                _render() {
                    if (!this._image || !this._ctx) return;
                    const canvas = this.canvas;
                    const rect = canvas.parentElement.getBoundingClientRect();
                    const size = Math.min(rect.width - 2, rect.height - 2);
                    canvas.width = size * window.devicePixelRatio;
                    canvas.height = size * window.devicePixelRatio;
                    canvas.style.width = size + 'px';
                    canvas.style.height = size + 'px';

                    const ctx = this._ctx;
                    const w = canvas.width;
                    const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);

                    const imgW = this._image.width;
                    const imgH = this._image.height;
                    const zoom = this._zoom;
                    const scale = Math.min(w / imgW, h / imgH) * zoom;
                    const drawW = imgW * scale;
                    const drawH = imgH * scale;
                    const ox = (w - drawW) / 2 + this._offsetX * w / 2;
                    const oy = (h - drawH) / 2 + this._offsetY * h / 2;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(w / 2, h / 2, w / 2 * 0.7, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this._image, ox, oy, drawW, drawH);
                    ctx.restore();
                },

                open(imageData, callback) {
                    const img = new Image();
                    img.onload = () => {
                        this._image = img;
                        this._zoom = 1;
                        this._offsetX = 0;
                        this._offsetY = 0;
                        this.zoomSlider.value = 1;
                        this._callback = callback;
                        this.overlay.classList.add('active');
                        this._render();
                        this.canvas.style.cursor = 'grab';
                        setTimeout(() => this.applyBtn.focus(), 50);
                    };
                    img.src = imageData;
                },

                close() {
                    this.overlay.classList.remove('active');
                    this._image = null;
                    this._callback = null;
                },

                async apply() {
                    if (!this._image || !this._callback) return;
                    const canvas = this.canvas;
                    const w = canvas.width;
                    const h = canvas.height;
                    const size = Math.min(w, h) * 0.7;
                    const cx = w / 2;
                    const cy = h / 2;
                    const half = size / 2;

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = size;
                    tempCanvas.height = size;
                    const tCtx = tempCanvas.getContext('2d');
                    tCtx.beginPath();
                    tCtx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    tCtx.clip();
                    tCtx.drawImage(canvas, cx - half, cy - half, size, size, 0, 0, size, size);

                    const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.85);
                    const compressed = await compressImage(dataUrl, 200);
                    this._callback(compressed);
                    this.close();
                }
            };

            class App {
                constructor() {
                    this.state = new AppState();
                    this.currentModule = 'dashboard';
                    this.currentView = 'list';
                    this.selectedId = null;
                    this.editingId = null;
                    this.searchQuery = '';
                    this.searchResults = null;
                    this.navStack = [];
                    this.briefingDismissed = false;
                    this._photoData = null;
                    this._formChanged = false;
                    this._init();
                }

                _init() {
                    document.querySelectorAll('.landing-menu .menu-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const mod = btn.dataset.module;
                            this.navigate(mod, 'list');
                        });
                    });

                    document.getElementById('backBtn').addEventListener('click', () => this.goBack());
                    document.getElementById('actionBtn').addEventListener('click', () => this.handleAction());

                    document.getElementById('searchSubmit').addEventListener('click', () => this.performSearch());
                    document.getElementById('globalSearch').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') { e.preventDefault();
                            this.performSearch(); }
                    });
                    document.getElementById('clearSearch').addEventListener('click', () => this.clearSearch());

                    const ioToggle = document.getElementById('ioToggle');
                    const ioMenu = document.getElementById('ioMenu');
                    ioToggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        ioMenu.classList.toggle('open');
                    });
                    document.addEventListener('click', () => { ioMenu.classList.remove('open'); });
                    document.getElementById('ioExport').addEventListener('click', () => this.exportCurrentModule());
                    document.getElementById('ioImport').addEventListener('click', () => {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = '.json';
                        input.onchange = (e) => this.importCurrentModule(e);
                        input.click();
                    });

                    window.addEventListener('popstate', (e) => {
                        if (this.navStack.length > 1) {
                            this.navStack.pop();
                            const prev = this.navStack[this.navStack.length - 1];
                            if (prev) {
                                this.currentModule = prev.module;
                                this.currentView = prev.view;
                                this.selectedId = prev.id || null;
                                this.editingId = null;
                                this.searchQuery = '';
                                this.searchResults = null;
                                document.getElementById('globalSearch').value = '';
                                document.getElementById('searchInfo').textContent = '';
                                document.getElementById('clearSearch').classList.remove('visible');
                                this.render();
                            }
                        } else {
                            this.goBack();
                        }
                    });

                    window.addEventListener('beforeunload', (e) => {
                        if (this._formChanged && this.currentView === 'form') {
                            e.preventDefault();
                            e.returnValue =
                                'Anda memiliki perubahan yang belum disimpan. Yakin ingin meninggalkan halaman?';
                            return e.returnValue;
                        }
                    });

                    this._checkBriefingDismiss();
                    this.updateLandingStats();
                    Modal.init();
                    CropTool.init();
                    console.log('✅ USU BISA v4.1 (Final) siap.');
                }

                _checkBriefingDismiss() {
                    try {
                        const val = localStorage.getItem(STORE_PREFIX + 'briefing_dismiss');
                        if (val) {
                            const ts = parseInt(val);
                            const now = new Date();
                            const dismissDate = new Date(ts);
                            if (dismissDate.toDateString() === now.toDateString()) {
                                this.briefingDismissed = true;
                            } else {
                                localStorage.removeItem(STORE_PREFIX + 'briefing_dismiss');
                                this.briefingDismissed = false;
                            }
                        }
                    } catch { this.briefingDismissed = false; }
                }

                updateLandingStats() {
                    const s = this.state.stats();
                    document.getElementById('statDosen').textContent = s.dosen;
                    document.getElementById('statMatkul').textContent = s.matkul;
                    document.getElementById('statTugas').textContent = s.tugas;
                }

                navigate(module, view = 'list', id = null) {
                    const landing = document.getElementById('landing');
                    const main = document.getElementById('mainContainer');
                    if (!landing.classList.contains('hidden')) {
                        landing.classList.add('hidden');
                        main.classList.add('active');
                        this.navStack = [];
                    }

                    if (view !== 'list') {
                        this.searchQuery = '';
                        this.searchResults = null;
                        document.getElementById('globalSearch').value = '';
                        document.getElementById('searchInfo').textContent = '';
                        document.getElementById('clearSearch').classList.remove('visible');
                    }

                    this.currentModule = module;
                    this.currentView = view;
                    this.selectedId = id;
                    this.editingId = null;
                    this._formChanged = false;

                    const navState = { module, view, id };
                    const last = this.navStack[this.navStack.length - 1];
                    if (!last || last.module !== module || last.view !== view || last.id !== id) {
                        this.navStack.push(navState);
                        try { history.pushState(navState, ''); } catch {}
                    }

                    this.render();
                }

                goBack() {
                    if (this.navStack.length > 1) {
                        this.navStack.pop();
                        const prev = this.navStack[this.navStack.length - 1];
                        if (prev) {
                            this.currentModule = prev.module;
                            this.currentView = prev.view;
                            this.selectedId = prev.id || null;
                            this.editingId = null;
                            this.searchQuery = '';
                            this.searchResults = null;
                            document.getElementById('globalSearch').value = '';
                            document.getElementById('searchInfo').textContent = '';
                            document.getElementById('clearSearch').classList.remove('visible');
                            this._formChanged = false;
                            this.render();
                            return;
                        }
                    }
                    document.getElementById('mainContainer').classList.remove('active');
                    document.getElementById('landing').classList.remove('hidden');
                    this.navStack = [];
                    this.updateLandingStats();
                }

                handleAction() {
                    const mod = this.currentModule;
                    const view = this.currentView;
                    if (mod === 'dashboard') {
                        Notif.info('Gunakan menu di bawah untuk mengelola data.');
                        return;
                    }
                    if (view === 'list') {
                        this.clearSearch();
                        this.currentView = 'form';
                        this.editingId = null;
                        this._formChanged = false;
                        this.pushNav(mod, 'form');
                        this.render();
                    } else if (view === 'detail') {
                        this.clearSearch();
                        this.currentView = 'form';
                        this.editingId = this.selectedId;
                        this._formChanged = false;
                        this.pushNav(mod, 'form', this.selectedId);
                        this.render();
                    } else if (view === 'form') {
                        if (this._formChanged) {
                            Modal.open('Perubahan Belum Disimpan',
                                'Anda memiliki perubahan yang belum disimpan. Yakin ingin membatalkan?',
                                () => this.cancelForm());
                        } else {
                            this.cancelForm();
                        }
                    }
                }

                pushNav(module, view, id) {
                    const state = { module, view, id: id || null };
                    const last = this.navStack[this.navStack.length - 1];
                    if (!last || last.module !== module || last.view !== view || last.id !== (id || null)) {
                        this.navStack.push(state);
                        try { history.pushState(state, ''); } catch {}
                    }
                }

                performSearch() {
                    const input = document.getElementById('globalSearch');
                    const query = input.value.trim();
                    if (!query) { this.clearSearch(); return; }
                    this.searchQuery = query;
                    const q = query.toLowerCase();
                    const results = [];
                    MODULES.forEach(mod => {
                        const items = this.state.get(mod);
                        items.forEach(item => {
                            if (JSON.stringify(item).toLowerCase().includes(q)) {
                                results.push({ ...item, _mod: mod });
                            }
                        });
                    });
                    this.searchResults = results;
                    document.getElementById('searchInfo').textContent =
                        `Ditemukan ${results.length} hasil untuk "${escapeHTML(query)}"`;
                    document.getElementById('clearSearch').classList.add('visible');

                    // Jika modul saat ini adalah dashboard, kita tetap di dashboard (tidak bisa menampilkan list)
                    // Tapi untuk UX, kita alihkan ke modul 'dosen' jika dashboard karena dashboard tidak punya list.
                    // Namun instruksi terakhir meminta agar search tidak mengubah modul. Saya akan tetap di modul saat ini.
                    // Jika modul saat ini adalah dashboard, kita tampilkan hasil di dashboard? Tidak mungkin.
                    // Maka kita tetap di dashboard, tapi hasil tidak tampil. Lebih baik kita alihkan ke 'dosen' sebagai fallback.
                    // Tapi untuk memenuhi instruksi "tidak mengubah modul", saya akan menampilkan notifikasi bahwa hasil tidak dapat ditampilkan di dashboard.
                    if (this.currentModule === 'dashboard') {
                        Notif.info('Pencarian hanya tersedia di modul data (Dosen, Mata Kuliah, dll).');
                        this.clearSearch();
                        return;
                    }
                    // Tetap di modul saat ini, tampilkan hasil
                    this.currentView = 'list';
                    this.pushNav(this.currentModule, 'list');
                    this.render();
                }

                clearSearch() {
                    this.searchQuery = '';
                    this.searchResults = null;
                    document.getElementById('globalSearch').value = '';
                    document.getElementById('searchInfo').textContent = '';
                    document.getElementById('clearSearch').classList.remove('visible');
                }

                render() {
                    const container = document.getElementById('content');
                    const mod = this.currentModule;
                    const view = this.currentView;

                    let title = MODULE_LABELS[mod] || 'Module';
                    let actionLabel = 'Tambah';
                    let actionIcon = 'bi-plus-lg';
                    let actionClass = '';

                    if (view === 'detail') {
                        title = 'Detail';
                        actionLabel = 'Edit';
                        actionIcon = 'bi-pencil';
                    } else if (view === 'form') {
                        title = this.editingId ? 'Edit' : 'Tambah';
                        actionLabel = 'Batal';
                        actionIcon = 'bi-x-lg';
                        actionClass = 'danger';
                    }

                    document.getElementById('headerTitle').innerHTML =
                        `${title} <span class="brand-badge">USU BISA</span>`;
                    document.getElementById('actionLabel').textContent = actionLabel;
                    const actionBtn = document.getElementById('actionBtn');
                    actionBtn.querySelector('i').className = `bi ${actionIcon}`;
                    actionBtn.className = `header-btn ${actionClass}`;

                    const showSearch = mod !== 'dashboard' && view === 'list';
                    document.getElementById('searchWrap').classList.toggle('visible', showSearch);

                    if (mod === 'dashboard') {
                        actionBtn.style.display = 'none';
                    } else {
                        actionBtn.style.display = 'flex';
                    }

                    const ioDropdown = document.getElementById('ioDropdown');
                    if (mod === 'dashboard' || view !== 'list') {
                        ioDropdown.style.display = 'none';
                    } else {
                        ioDropdown.style.display = 'inline-block';
                    }

                    if (mod === 'dashboard') {
                        this._renderDashboard(container);
                        return;
                    }

                    const items = this.state.get(mod);
                    let listData = items;
                    const searchQ = this.searchQuery.trim().toLowerCase();

                    if (view === 'list' && searchQ) {
                        if (this.searchResults !== null) {
                            listData = this.searchResults;
                        } else {
                            listData = items.filter(item => JSON.stringify(item).toLowerCase().includes(searchQ));
                        }
                    }

                    if (view === 'list') {
                        this._renderList(container, mod, listData);
                    } else if (view === 'detail') {
                        this._renderDetail(container, mod);
                    } else if (view === 'form') {
                        this._renderForm(container, mod);
                    }
                }

                // ---- DASHBOARD ----
                _renderDashboard(container) {
                    const now = new Date();
                    const todayName = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][now.getDay()];
                    const todayDateStr = now.toISOString().slice(0, 10);

                    const todaySchedule = this.state.getJadwalByHari(todayName);
                    const tasks = this.state.get('tugas').filter(t => t.deadline);
                    const todayTasks = tasks.filter(t => t.deadline === todayDateStr);
                    const tomorrowTasks = tasks.filter(t => {
                        const d2 = new Date(t.deadline);
                        const diff = Math.ceil((d2 - now) / (1000 * 60 * 60 * 24));
                        return diff === 1;
                    });
                    const nearTasks = tasks.filter(t => {
                        if (t.status === 'Selesai') return false;
                        const diff = Math.ceil((new Date(t.deadline) - now) / (1000 * 60 * 60 * 24));
                        return diff >= 0 && diff <= 7;
                    }).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

                    let reminders = [];
                    todaySchedule.forEach(j => {
                        const matkul = this.state.find('matkul', j.matkulId);
                        const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(j.matkul ||
                            'Mata Kuliah');
                        const dosen = j.dosen || (matkul ? escapeHTML(this.state.find('dosen', matkul.dosenId)
                            ?.nama) : '');
                        let desc =
                            `${namaMatkul}${dosen ? ' — '+dosen : ''}${j.ruangan ? ' Ruang: '+escapeHTML(j.ruangan) : ''}`;
                        reminders.push({
                            id: 'jadwal-' + j.id,
                            priority: 'urgent',
                            icon: 'bi-calendar-event',
                            title: `${escapeHTML(j.jamMulai || '')} - ${escapeHTML(j.jamSelesai || '')}`,
                            description: desc,
                            module: 'jadwal',
                            sourceId: j.id
                        });
                    });
                    todayTasks.forEach(t => {
                        const matkul = this.state.find('matkul', t.matkulId);
                        const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(t.matkul ||
                            'Mata Kuliah');
                        reminders.push({
                            id: 'tugas-' + t.id,
                            priority: 'urgent',
                            icon: 'bi-exclamation-triangle-fill',
                            title: `${escapeHTML(t.nama || 'Tugas')}`,
                            description: `Deadline hari ini — ${namaMatkul}`,
                            module: 'tugas',
                            sourceId: t.id
                        });
                    });
                    tomorrowTasks.forEach(t => {
                        const matkul = this.state.find('matkul', t.matkulId);
                        const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(t.matkul ||
                            'Mata Kuliah');
                        reminders.push({
                            id: 'tugas-' + t.id + '-tomorrow',
                            priority: 'important',
                            icon: 'bi-exclamation-circle-fill',
                            title: `${escapeHTML(t.nama || 'Tugas')}`,
                            description: `Deadline besok — ${namaMatkul}`,
                            module: 'tugas',
                            sourceId: t.id
                        });
                    });
                    nearTasks.forEach(t => {
                        const diff = Math.ceil((new Date(t.deadline) - now) / (1000 * 60 * 60 * 24));
                        if (diff > 1) {
                            const matkul = this.state.find('matkul', t.matkulId);
                            const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(t.matkul ||
                                'Mata Kuliah');
                            reminders.push({
                                id: 'tugas-' + t.id + '-near',
                                priority: 'reminder',
                                icon: 'bi-clock',
                                title: `${escapeHTML(t.nama || 'Tugas')}`,
                                description: `Deadline ${diff} hari lagi — ${namaMatkul}`,
                                module: 'tugas',
                                sourceId: t.id
                            });
                        }
                    });
                    this.state.get('notes').forEach(n => {
                        if (n.content && (n.content.toLowerCase().includes('ingat') ||
                                n.content.toLowerCase().includes('deadline') ||
                                n.content.toLowerCase().includes('penting'))) {
                            reminders.push({
                                id: 'note-' + n.id,
                                priority: 'reminder',
                                icon: 'bi-lightbulb',
                                title: escapeHTML(n.title || 'Catatan'),
                                description: escapeHTML(n.content.slice(0, 80) + (n.content.length > 80 ?
                                    '…' : '')),
                                module: 'notes',
                                sourceId: n.id
                            });
                        }
                    });

                    reminders.sort((a, b) => {
                        const order = { urgent: 0, important: 1, reminder: 2 };
                        return (order[a.priority] || 3) - (order[b.priority] || 3);
                    });
                    if (reminders.length > 8) reminders = reminders.slice(0, 8);

                    const stats = this.state.stats();
                    const ipkTarget = this.state.ipkTarget;
                    const ipkCurrent = this.state.ipkCurrent;
                    const ipkPercent = Math.min(100, Math.max(0, (ipkCurrent / ipkTarget) * 100));
                    const notes = this.state.get('notes');
                    const recentNotes = notes.slice(-3).reverse();
                    const greeting = this._getGreeting(now.getHours());
                    const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric',
                        month: 'long', year: 'numeric' });

                    let html = `
                        <div class="dash-grid">
                            <div class="dash-card"><div class="num">${stats.dosen}</div><div class="label">Dosen</div></div>
                            <div class="dash-card"><div class="num">${stats.matkul}</div><div class="label">Mata Kuliah</div></div>
                            <div class="dash-card"><div class="num">${stats.kontrak}</div><div class="label">Kontrak</div></div>
                            <div class="dash-card"><div class="num">${stats.tugas}</div><div class="label">Tugas</div></div>
                            <div class="dash-card"><div class="num">${nearTasks.length}</div><div class="label">Tugas < 7 hari</div></div>
                            <div class="dash-card"><div class="num">${todaySchedule.length}</div><div class="label">Jadwal Hari Ini</div></div>
                        </div>
                        <div class="briefing-card" id="briefingCard">
                            <div class="greeting">${escapeHTML(greeting)}</div>
                            <div class="date">${escapeHTML(dateStr)}</div>
                            <div class="summary">
                                <span class="summary-item"><i class="bi bi-exclamation-triangle-fill" style="color:var(--color-danger)"></i> <span class="num">${reminders.filter(r=>r.priority==='urgent').length}</span> Urgent</span>
                                <span class="summary-item"><i class="bi bi-exclamation-circle-fill" style="color:var(--color-warning)"></i> <span class="num">${reminders.filter(r=>r.priority==='important').length}</span> Penting</span>
                                <span class="summary-item"><i class="bi bi-clock" style="color:var(--color-info)"></i> <span class="num">${reminders.filter(r=>r.priority==='reminder').length}</span> Pengingat</span>
                                ${todaySchedule.length > 0 ? `<span class="summary-item"><i class="bi bi-calendar-event"></i> <span class="num">${todaySchedule.length}</span> Kuliah</span>` : ''}
                            </div>
                            ${reminders.length === 0 ? '<div class="reminder-empty">Tidak ada pengingat untuk hari ini.</div>' :
                            `<div class="reminder-list">${reminders.map(r => {
                                const cls = r.priority === 'urgent' ? 'urgent' : (r.priority === 'important' ? 'important' : 'reminder');
                                const colorMap = { urgent: 'var(--color-danger)', important: 'var(--color-warning)', reminder: 'var(--color-info)' };
                                const actionHtml = r.module ? `<button class="action-link" onclick="app.openDetail('${r.module}','${r.sourceId}')">Lihat <i class="bi bi-chevron-right"></i></button>` : '';
                                return `<div class="reminder-item ${cls}">
                                    <span class="icon"><i class="bi ${r.icon}" style="color:${colorMap[cls]||'var(--color-info)'}"></i></span>
                                    <div class="r-content">
                                        <div class="title">${r.title}</div>
                                        <div class="desc">${r.description}</div>
                                        <div class="meta"><span class="tag">${cls === 'urgent' ? 'Urgent' : cls === 'important' ? 'Penting' : 'Pengingat'}</span></div>
                                    </div>
                                    ${actionHtml}
                                </div>`;
                            }).join('')}</div>`}
                            <div class="briefing-dismiss"><button onclick="app.dismissBriefing()">Sembunyikan briefing hari ini</button></div>
                        </div>
                        <div class="dash-section">
                            <h3><i class="bi bi-graph-up-arrow"></i> Target IPK</h3>
                            <div class="ipk-tracker">
                                <div class="ipk-input"><label>Target</label><input type="number" id="ipkTargetInput" step="0.1" min="0" max="4" value="${ipkTarget}" /></div>
                                <div class="ipk-input"><label>Saat Ini</label><input type="number" id="ipkCurrentInput" step="0.1" min="0" max="4" value="${ipkCurrent}" /></div>
                                <button class="ipk-btn" onclick="app.updateIpk()">Update</button>
                                <div class="ipk-bar-wrap"><div class="ipk-bar"><div class="fill" style="width:${ipkPercent}%;"></div></div><div class="ipk-label">${ipkCurrent} dari ${ipkTarget} (${Math.round(ipkPercent)}%)</div></div>
                            </div>
                        </div>
                        <div class="dash-section"><h3><i class="bi bi-calendar"></i> Jadwal Hari Ini (${escapeHTML(todayName)}) <span class="badge">${todaySchedule.length}</span></h3>`;
                    if (todaySchedule.length === 0) {
                        html += `<div class="dash-empty">Tidak ada jadwal hari ini.</div>`;
                    } else {
                        todaySchedule.sort((a, b) => (a.jamMulai || '00:00').localeCompare(b.jamMulai || '00:00'));
                        todaySchedule.forEach(j => {
                            const matkul = this.state.find('matkul', j.matkulId);
                            const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(j.matkul ||
                                'Mata Kuliah');
                            const dosen = j.dosen || (matkul ? escapeHTML(this.state.find('dosen', matkul
                                .dosenId)?.nama) : '');
                            html += `
                                <div class="dash-item">
                                    <span class="dash-label">${namaMatkul}${dosen ? ' — '+dosen : ''}</span>
                                    <span class="dash-value">${escapeHTML(j.jamMulai || '')} - ${escapeHTML(j.jamSelesai || '')}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>
                        <div class="dash-section"><h3><i class="bi bi-file-text"></i> Tugas Mendekati Deadline <span class="badge">${nearTasks.length}</span></h3>`;
                    if (nearTasks.length === 0) {
                        html += `<div class="dash-empty">Tidak ada tugas yang mendekati deadline.</div>`;
                    } else {
                        nearTasks.forEach(t => {
                            const diff = Math.ceil((new Date(t.deadline) - now) / (1000 * 60 * 60 * 24));
                            const label = diff === 0 ? 'Hari ini' : (diff === 1 ? 'Besok' :
                                `${diff} hari lagi`);
                            const cls = diff <= 2 ? 'highlight' : '';
                            const matkul = this.state.find('matkul', t.matkulId);
                            const namaMatkul = matkul ? escapeHTML(matkul.nama) : escapeHTML(t.matkul ||
                                'Mata Kuliah');
                            html += `
                                <div class="dash-item">
                                    <span class="dash-label">${escapeHTML(t.nama || 'Tugas')} — ${namaMatkul}</span>
                                    <span class="dash-value ${cls}">${label}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>
                        <div class="dash-section">
                            <h3><i class="bi bi-pencil-square"></i> Catatan Cepat <span class="badge">${notes.length}</span></h3>
                            <div class="notes-grid">`;
                    if (recentNotes.length === 0) {
                        html += `<div class="dash-empty" style="grid-column:1/-1;">Belum ada catatan.</div>`;
                    } else {
                        recentNotes.forEach(n => {
                            const preview = n.content ? escapeHTML(n.content.slice(0, 50) + (n.content
                                .length > 50 ? '…' : '')) : '';
                            html += `
                                <div class="note-card" onclick="app.openDetail('notes','${n.id}')">
                                    <div class="note-title">
                                        <span>${escapeHTML(n.title || 'Catatan')}</span>
                                        <button class="del-note" onclick="event.stopPropagation();app.confirmDelete('notes','${n.id}')"><i class="bi bi-x-lg"></i></button>
                                    </div>
                                    <div class="note-preview">${preview || '(kosong)'}</div>
                                    <div class="note-date">${n.createdAt ? new Date(n.createdAt).toLocaleDateString('id-ID') : ''}</div>
                                </div>
                            `;
                        });
                    }
                    html += `
                            </div>
                            <button class="note-add-btn" onclick="app.navigate('notes','form')"><i class="bi bi-plus-lg"></i> Tambah Catatan</button>
                        </div>
                        <div class="dash-section"><h3><i class="bi bi-person-badge"></i> Dosen Terbaru</h3>`;
                    const recentDosen = [...this.state.get('dosen')].reverse().slice(0, 5);
                    if (recentDosen.length === 0) {
                        html += `<div class="dash-empty">Belum ada dosen.</div>`;
                    } else {
                        recentDosen.forEach(ds => {
                            const fakultas = escapeHTML(ds.fakultas || '');
                            const prodi = escapeHTML(ds.prodi || '');
                            html += `
                                <div class="dash-item">
                                    <span class="dash-label">
                                        ${escapeHTML(ds.nama || 'Tanpa nama')}
                                        ${fakultas ? `<span class="sub">${fakultas}${prodi ? ' · '+prodi : ''}</span>` : ''}
                                    </span>
                                    <span class="dash-value">${escapeHTML(ds.jabatan || '')}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>`;

                    container.innerHTML = html;
                    if (this.briefingDismissed) {
                        const briefing = document.getElementById('briefingCard');
                        if (briefing) briefing.style.display = 'none';
                    }
                }

                _getGreeting(hour) {
                    if (hour < 6) return 'Selamat malam';
                    if (hour < 10) return 'Selamat pagi';
                    if (hour < 14) return 'Selamat siang';
                    if (hour < 18) return 'Selamat sore';
                    return 'Selamat malam';
                }

                dismissBriefing() {
                    this.briefingDismissed = true;
                    const briefing = document.getElementById('briefingCard');
                    if (briefing) briefing.style.display = 'none';
                    try { localStorage.setItem(STORE_PREFIX + 'briefing_dismiss', Date.now().toString()); } catch {}
                }

                updateIpk() {
                    const target = parseFloat(document.getElementById('ipkTargetInput')?.value);
                    const current = parseFloat(document.getElementById('ipkCurrentInput')?.value);
                    if (isNaN(target) || target <= 0 || target > 4) {
                        Notif.error('Target IPK harus antara 0-4.');
                        return;
                    }
                    if (isNaN(current) || current < 0 || current > 4) {
                        Notif.error('IPK saat ini harus antara 0-4.');
                        return;
                    }
                    this.state.updateSettings({ ipkTarget: target, ipkCurrent: current });
                    Notif.success('Target IPK diperbarui.');
                    this.render();
                }

                // ---- LIST ----
                _renderList(container, mod, items) {
                    const isSearch = this.searchQuery.trim() !== '' && this.searchResults !== null;
                    let html = `<div class="module-list">`;
                    if (!items || items.length === 0) {
                        const icon = MODULE_ICONS[mod] || 'bi-folder';
                        html += `
                            <div class="list-empty">
                                <div class="icon"><i class="bi ${icon}"></i></div>
                                <p>${isSearch ? 'Tidak ada hasil pencarian.' : 'Belum ada data.'}</p>
                                <div class="sub">${isSearch ? 'Coba kata kunci lain.' : 'Tambahkan data baru melalui tombol + di atas.'}</div>
                                ${isSearch ? `<button class="list-back-btn" onclick="app.clearSearch();app.render()">Kembali ke daftar</button>` : ''}
                            </div>
                        `;
                        html += `</div>`;
                        container.innerHTML = html;
                        return;
                    }

                    items.forEach(item => {
                        const primary = escapeHTML(item.nama || item.judul || item.matkul || item.title ||
                            'Tanpa nama');
                        const secondary = escapeHTML(item.kode || item.dosen || item.fakultas || (item.content ?
                            (item.content.slice(0, 40) + (item.content.length > 40 ? '…' : '')) : ''));
                        const badge = escapeHTML(item.sks ? `${item.sks} SKS` : (item.status || (item
                            .priority ? item.priority : '')));
                        const avatarChar = primary.charAt(0).toUpperCase();
                        const avatarImg = item.foto ? `<img src="${escapeHTML(item.foto)}" alt="${primary}">` :
                            avatarChar;

                        if (mod === 'notes') {
                            html += `
                                <div class="list-card" onclick="app.openDetail('notes','${item.id}')">
                                    <div class="list-avatar"><i class="bi bi-pencil-square" style="font-size:0.9rem;"></i></div>
                                    <div class="list-info">
                                        <div class="primary">${primary}</div>
                                        <div class="secondary">${item.content ? escapeHTML(item.content.slice(0, 40) + (item.content.length > 40 ? '…' : '')) : ''}</div>
                                    </div>
                                    ${item.createdAt ? `<span class="list-badge">${new Date(item.createdAt).toLocaleDateString('id-ID')}</span>` : ''}
                                </div>
                            `;
                            return;
                        }

                        html += `
                            <div class="list-card" onclick="app.openDetail('${mod}','${item.id}')">
                                <div class="list-avatar">${avatarImg}</div>
                                <div class="list-info">
                                    <div class="primary">${primary}</div>
                                    <div class="secondary">${secondary}</div>
                                </div>
                                ${badge ? `<span class="list-badge">${badge}</span>` : ''}
                            </div>
                        `;
                    });
                    html += `</div>`;

                    if (isSearch) {
                        html +=
                            `<div style="text-align:center;margin-top:10px;"><button class="list-back-btn" onclick="app.clearSearch();app.render()">Kembali ke daftar</button></div>`;
                    }

                    container.innerHTML = html;
                }

                // ---- DETAIL ----
                _renderDetail(container, mod) {
                    const item = this.state.find(mod, this.selectedId);
                    if (!item) {
                        this.currentView = 'list';
                        this.render();
                        return;
                    }

                    if (mod === 'notes') {
                        container.innerHTML = `
                            <div class="detail-view active">
                                <div class="detail-header">
                                    <div class="detail-name">
                                        <h2>${escapeHTML(item.title || 'Tanpa judul')}</h2>
                                        <div class="sub">${item.createdAt ? new Date(item.createdAt).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}) : ''}</div>
                                    </div>
                                </div>
                                <div style="background:var(--color-card);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow-sm);white-space:pre-wrap;font-size:0.85rem;line-height:1.7;color:var(--color-text);">
                                    ${escapeHTML(item.content || '(kosong)')}
                                </div>
                                <div class="detail-actions">
                                    <button class="btn-edit" onclick="app.editItem('notes','${item.id}')"><i class="bi bi-pencil"></i> Edit</button>
                                    <button class="btn-delete" onclick="app.confirmDelete('notes','${item.id}')"><i class="bi bi-trash"></i> Hapus</button>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    let displayOrder = [];
                    if (mod === 'dosen') {
                        displayOrder = ['foto', 'nama', 'fakultas', 'prodi', 'jabatan', 'keahlian', 'nip',
                            'tanggalLahir', 'umur', 'email', 'telepon', 'linkedIn', 'ruang', 'konsultasi',
                            'catatan'
                        ];
                    } else {
                        displayOrder = Object.keys(item).filter(k => !['id', 'foto', 'dynamicFields', 'createdAt']
                            .includes(k));
                    }

                    const exclude = ['id', 'foto', 'dynamicFields', 'createdAt'];
                    let infoHtml = '';
                    const keys = Object.keys(item).filter(k => !exclude.includes(k) && item[k] !== undefined && item[
                        k] !== null && item[k] !== '');

                    if (mod === 'dosen') {
                        keys.sort((a, b) => {
                            const ia = displayOrder.indexOf(a),
                                ib = displayOrder.indexOf(b);
                            if (ia === -1 && ib === -1) return a.localeCompare(b);
                            if (ia === -1) return 1;
                            if (ib === -1) return -1;
                            return ia - ib;
                        });
                    } else {
                        keys.sort();
                    }

                    keys.forEach(key => {
                        let val = item[key];
                        if (typeof val === 'object') val = JSON.stringify(val);
                        if (val === '' || val === null || val === undefined) return;
                        const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
                        let displayVal = escapeHTML(val);
                        if (key === 'linkedIn' && val && val.includes('linkedin.com')) {
                            displayVal =
                                `<a href="${escapeHTML(val)}" target="_blank" rel="noopener noreferrer">${escapeHTML(val)}</a>`;
                        }
                        if (key === 'email' && val) {
                            displayVal = `<a href="mailto:${escapeHTML(val)}">${escapeHTML(val)}</a>`;
                        }
                        if (key === 'telepon' && val) {
                            displayVal = `<a href="tel:${escapeHTML(val)}">${escapeHTML(val)}</a>`;
                        }
                        infoHtml += `
                            <div class="detail-item">
                                <div class="label">${escapeHTML(label)}</div>
                                <div class="value">${displayVal}</div>
                            </div>
                        `;
                    });

                    if (item.dynamicFields && item.dynamicFields.length > 0) {
                        item.dynamicFields.forEach(df => {
                            if (df.label && df.value) {
                                infoHtml += `
                                    <div class="detail-item">
                                        <div class="label">${escapeHTML(df.label)}</div>
                                        <div class="value">${escapeHTML(df.value)}</div>
                                    </div>
                                `;
                            }
                        });
                    }

                    let relHtml = '';
                    if (mod === 'dosen') {
                        const matkulAmpu = this.state.getMatkulByDosen(item.id);
                        if (matkulAmpu.length > 0) {
                            relHtml += `
                                <div class="detail-relations">
                                    <h4>Mata Kuliah yang Diampu</h4>
                                    ${matkulAmpu.map(m => `<span class="relation-chip" onclick="app.openDetail('matkul','${m.id}')">${escapeHTML(m.nama || m.kode || 'Mata Kuliah')}</span>`).join('')}
                                </div>
                            `;
                        }
                    }
                    if (mod === 'matkul') {
                        const kontrakRel = this.state.getKontrakByMatkul(item.id);
                        if (kontrakRel.length > 0) {
                            relHtml += `
                                <div class="detail-relations">
                                    <h4>Kontrak Kuliah</h4>
                                    ${kontrakRel.map(k => `<span class="relation-chip" onclick="app.openDetail('kontrak','${k.id}')">${escapeHTML(k.judul || k.matkul || 'Kontrak')}</span>`).join('')}
                                </div>
                            `;
                        }
                    }
                    if (mod === 'tugas') {
                        if (item.matkulId) {
                            const matkul = this.state.find('matkul', item.matkulId);
                            if (matkul) {
                                relHtml += `
                                    <div class="detail-relations">
                                        <h4>Mata Kuliah Terkait</h4>
                                        <span class="relation-chip" onclick="app.openDetail('matkul','${matkul.id}')">${escapeHTML(matkul.nama || matkul.kode || 'Mata Kuliah')}</span>
                                    </div>
                                `;
                            }
                        }
                    }

                    const photoHtml = item.foto ? `<img src="${escapeHTML(item.foto)}" alt="${escapeHTML(item.nama || 'Foto')}">` : (item.nama ? escapeHTML(item
                        .nama.charAt(0).toUpperCase()) : '?');

                    container.innerHTML = `
                        <div class="detail-view active">
                            <div class="detail-header">
                                <div class="detail-photo">${photoHtml}</div>
                                <div class="detail-name">
                                    <h2>${escapeHTML(item.nama || item.judul || item.matkul || 'Detail')}</h2>
                                    <div class="sub">${escapeHTML(item.kode || item.fakultas || item.dosen || '')}</div>
                                </div>
                            </div>
                            <div class="detail-grid">${infoHtml}</div>
                            ${relHtml}
                            <div class="detail-actions">
                                <button class="btn-edit" onclick="app.editItem('${mod}','${item.id}')"><i class="bi bi-pencil"></i> Edit</button>
                                <button class="btn-delete" onclick="app.confirmDelete('${mod}','${item.id}')"><i class="bi bi-trash"></i> Hapus</button>
                            </div>
                        </div>
                    `;
                }

                // ---- FORM ----
                _renderForm(container, mod) {
                    const isEdit = this.editingId !== null;
                    const item = isEdit ? this.state.find(mod, this.editingId) : null;

                    if (mod === 'notes') {
                        const v = (key) => item ? escapeHTML(item[key] || '') : '';
                        container.innerHTML = `
                            <div class="form-view active">
                                <form id="moduleForm" onsubmit="app.saveForm(event)">
                                    <div class="form-group">
                                        <label>Judul <span class="required">*</span></label>
                                        <input type="text" id="inputTitle" value="${v('title')}" placeholder="Judul catatan..." required>
                                    </div>
                                    <div class="form-group">
                                        <label>Isi Catatan</label>
                                        <textarea id="inputContent" rows="5" placeholder="Tulis catatan Anda di sini...">${v('content')}</textarea>
                                    </div>
                                    <div class="form-actions">
                                        <button type="submit" class="btn-primary">${isEdit ? 'Simpan' : 'Tambah'}</button>
                                        <button type="button" class="btn-secondary" onclick="app.cancelForm()">Batal</button>
                                    </div>
                                </form>
                            </div>
                        `;
                        return;
                    }

                    let fieldsHtml = '';
                    let dynamicHtml = '';

                    if (mod === 'dosen') {
                        fieldsHtml = this._buildDosenForm(item);
                        dynamicHtml = this._buildDynamicFields(item);
                    } else if (mod === 'matkul') {
                        fieldsHtml = this._buildMatkulForm(item);
                    } else if (mod === 'kontrak') {
                        fieldsHtml = this._buildKontrakForm(item);
                    } else if (mod === 'tugas') {
                        fieldsHtml = this._buildTugasForm(item);
                    } else if (mod === 'jadwal') {
                        fieldsHtml = this._buildJadwalForm(item);
                    }

                    const submitLabel = isEdit ? 'Simpan Perubahan' : 'Tambah';

                    container.innerHTML = `
                        <div class="form-view active">
                            <form id="moduleForm" onsubmit="app.saveForm(event)">
                                ${fieldsHtml}
                                ${dynamicHtml}
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">${submitLabel}</button>
                                    <button type="button" class="btn-secondary" onclick="app.cancelForm()">Batal</button>
                                </div>
                            </form>
                        </div>
                    `;

                    this._initPhotoUpload(item);

                    const tglInput = document.getElementById('inputTanggalLahir');
                    if (tglInput) {
                        tglInput.addEventListener('change', () => this._calcAge());
                        if (item && item.tanggalLahir) {
                            tglInput.value = item.tanggalLahir;
                            this._calcAge();
                        }
                    }

                    document.querySelectorAll('.delete-field').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const field = this.closest('.dynamic-field');
                            if (field) field.remove();
                            app._updateFieldNumbers();
                        });
                    });

                    const addBtn = document.getElementById('addDynamicBtn');
                    if (addBtn) {
                        addBtn.addEventListener('click', () => this._addDynamicField());
                    }

                    document.querySelectorAll('.section-toggle').forEach(el => {
                        el.addEventListener('click', function() {
                            const body = this.closest('.form-section').querySelector('.section-body');
                            const icon = this.querySelector('.toggle-icon');
                            if (body) {
                                body.classList.toggle('open');
                                if (icon) icon.classList.toggle('open');
                            }
                        });
                    });

                    const form = document.getElementById('moduleForm');
                    if (form) {
                        form.addEventListener('input', () => { this._formChanged = true; });
                        form.addEventListener('change', () => { this._formChanged = true; });
                    }
                }

                _initPhotoUpload(item) {
                    const photoData = item && item.foto ? item.foto : null;
                    const previewImg = document.getElementById('photoPreviewImg');
                    const placeholder = document.getElementById('photoPlaceholder');
                    const fileName = document.getElementById('photoFileName');
                    const fileInput = document.getElementById('inputFoto');
                    const cropBtn = document.getElementById('photoCropBtn');
                    const resetBtn = document.getElementById('photoResetBtn');
                    const removeBtn = document.getElementById('photoRemoveBtn');

                    let currentFileData = photoData;

                    const updatePreview = (data) => {
                        if (data) {
                            previewImg.src = data;
                            previewImg.style.display = 'block';
                            if (placeholder) placeholder.style.display = 'none';
                            fileName.textContent = 'Foto siap';
                            currentFileData = data;
                            this._photoData = data;
                        } else {
                            previewImg.style.display = 'none';
                            if (placeholder) placeholder.style.display = 'flex';
                            fileName.textContent = 'Belum ada foto';
                            currentFileData = null;
                            this._photoData = null;
                        }
                    };

                    updatePreview(photoData);

                    if (fileInput) {
                        fileInput.addEventListener('change', (e) => {
                            const file = e.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = async (ev) => {
                                    CropTool.open(ev.target.result, async (cropped) => {
                                        const compressed = await compressImage(cropped, 200);
                                        updatePreview(compressed);
                                        Notif.success('Foto berhasil diatur.');
                                    });
                                };
                                reader.readAsDataURL(file);
                                fileInput.value = '';
                            }
                        });
                    }

                    if (cropBtn) {
                        cropBtn.addEventListener('click', () => {
                            if (currentFileData) {
                                CropTool.open(currentFileData, async (cropped) => {
                                    const compressed = await compressImage(cropped, 200);
                                    updatePreview(compressed);
                                    Notif.success('Foto berhasil diatur.');
                                });
                            } else {
                                Notif.error('Upload foto terlebih dahulu.');
                            }
                        });
                    }

                    if (resetBtn) {
                        resetBtn.addEventListener('click', () => {
                            updatePreview(null);
                            Notif.info('Foto direset.');
                        });
                    }

                    if (removeBtn) {
                        removeBtn.addEventListener('click', () => {
                            updatePreview(null);
                            Notif.info('Foto dihapus.');
                        });
                    }
                }

                // ---- Form Builders ----
                _buildDosenForm(item) {
                    const v = (key) => item ? escapeHTML(item[key] || '') : '';
                    const hasPhoto = item && item.foto;
                    const photoSrc = hasPhoto ? escapeHTML(item.foto) : '';

                    return `
                        <div class="form-group">
                            <label>Foto Profil</label>
                            <div class="photo-upload-area">
                                <div class="photo-preview-wrap">
                                    <img id="photoPreviewImg" src="${photoSrc}" style="${hasPhoto ? 'display:block' : 'display:none'}" alt="Foto profil">
                                    <div class="placeholder" id="photoPlaceholder" style="${hasPhoto ? 'display:none' : 'display:flex'}">
                                        <i class="bi bi-person-circle"></i>

                _addDynamicField(label = '', value = '') {
                    const container = document.getElementById('dynamicFieldsContainer');
                    if (!container) return;
                    const idx = container.children.length;
                    const field = document.createElement('div');
                    field.className = 'dynamic-field';
                    field.innerHTML = `
                        <div class="dynamic-field-header">
                            <strong>Kolom ${idx+1}</strong>
                            <button type="button" class="delete-field">Hapus</button>
                        </div>
                        <div class="form-group">
                            <label>Judul/Kategori</label>
                            <input type="text" class="dynamic-label" value="${escapeHTML(label)}" placeholder="Contoh: Hobi" required>
                        </div>
