                            <label>Keterangan/Isi</label>
                            <input type="text" class="dynamic-value" value="${escapeHTML(value)}" placeholder="Isi keterangan">
                        </div>
                    `;
                    container.appendChild(field);
                    field.querySelector('.delete-field').addEventListener('click', function() {
                        field.remove();
                        app._updateFieldNumbers();
                    });
                    this._updateFieldNumbers();
                }

                _updateFieldNumbers() {
                    document.querySelectorAll('.dynamic-field').forEach((f, i) => {
                        const strong = f.querySelector('strong');
                        if (strong) strong.textContent = `Kolom ${i+1}`;
                    });
                }

                _calcAge() {
                    const birth = document.getElementById('inputTanggalLahir')?.value;
                    const umur = document.getElementById('inputUmur');
                    if (birth && umur) {
                        const b = new Date(birth);
                        const today = new Date();
                        let age = today.getFullYear() - b.getFullYear();
                        const m = today.getMonth() - b.getMonth();
                        if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
                        umur.value = age > 0 ? age + ' tahun' : '';
                    }
                }

                // ---- FORM ACTIONS ----
                saveForm(e) {
                    e.preventDefault();
                    const mod = this.currentModule;
                    const isEdit = this.editingId !== null;

                    if (mod === 'notes') {
                        const title = document.getElementById('inputTitle')?.value?.trim() || '';
                        const content = document.getElementById('inputContent')?.value || '';
                        if (!title) {
                            Notif.error('Judul catatan harus diisi.');
                            return;
                        }
                        const payload = { title, content };
                        if (isEdit) {
                            const updated = this.state.update(mod, this.editingId, payload);
                            if (updated) Notif.success('Catatan diperbarui.');
                            else { Notif.error('Gagal memperbarui.'); return; }
                        } else {
                            payload.id = uid();
                            payload.createdAt = new Date().toISOString();
                            this.state.push(mod, payload);
                            Notif.success('Catatan ditambahkan.');
                        }
                        this.clearSearch();
                        this.currentView = 'list';
                        this.editingId = null;
                        this._formChanged = false;
                        this.pushNav(mod, 'list');
                        this.render();
                        this.updateLandingStats();
                        return;
                    }

                    let payload = {};

                    if (mod === 'dosen') payload = this._collectDosenForm();
                    else if (mod === 'matkul') payload = this._collectMatkulForm();
                    else if (mod === 'kontrak') payload = this._collectKontrakForm();
                    else if (mod === 'tugas') payload = this._collectTugasForm();
                    else if (mod === 'jadwal') payload = this._collectJadwalForm();

                    if (!payload.nama && mod !== 'kontrak' && mod !== 'tugas') {
                        Notif.error('Nama harus diisi');
                        return;
                    }
                    if (mod === 'kontrak' && !payload.judul) {
                        Notif.error('Judul kontrak harus diisi');
                        return;
                    }
                    if (mod === 'tugas' && !payload.nama) {
                        Notif.error('Nama tugas harus diisi');
                        return;
                    }

                    if (mod === 'dosen' && this._photoData) {
                        payload.foto = this._photoData;
                    }

                    if (isEdit) {
                        const updated = this.state.update(mod, this.editingId, payload);
                        if (updated) {
                            Notif.success('Data berhasil diperbarui');
                        } else {
                            Notif.error('Data tidak ditemukan');
                            return;
                        }
                    } else {
                        payload.id = uid();
                        payload.createdAt = new Date().toISOString();
                        this.state.push(mod, payload);
                        Notif.success('Data berhasil ditambahkan');
                    }

                    this.clearSearch();
                    this.currentView = 'list';
                    this.editingId = null;
                    this._formChanged = false;
                    this.pushNav(mod, 'list');
                    this.render();
                    this.updateLandingStats();
                }

                cancelForm() {
                    const mod = this.currentModule;
                    this.clearSearch();
                    this.currentView = 'list';
                    this.editingId = null;
                    this._formChanged = false;
                    this.pushNav(mod, 'list');
                    this.render();
                }

                        jamSelesai: document.getElementById('inputJamSelesai')?.value || '',
                        ruangan: document.getElementById('inputRuangan')?.value || '',
                        kelas: document.getElementById('inputKelas')?.value || '',
                        catatan: document.getElementById('inputCatatan')?.value || ''
                    };
                }

                // ---- EXPORT / IMPORT ----
                exportCurrentModule() {
                    const mod = this.currentModule;
                    const data = this.state.exportModule(mod);
                    if (!data || data.length === 0) {
                        Notif.error(`Tidak ada data ${MODULE_LABELS[mod] || mod} untuk diekspor.`);
                        return;
                    }
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `usu_bisa_${mod}_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    Notif.success(`Data ${MODULE_LABELS[mod] || mod} diekspor.`);
                }

                importCurrentModule(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const content = e.target.result;
                            const data = safeJSON(content);
                            if (!Array.isArray(data)) throw new Error('Format JSON tidak valid.');
                            const mod = this.currentModule;
                            const added = this.state.importModule(mod, data);
                            Notif.success(`${added} item berhasil diimpor ke ${MODULE_LABELS[mod] || mod}.`);
                            this.render();
                            this.updateLandingStats();
                        } catch (err) {
                            Notif.error(`Gagal mengimpor: ${err.message}`);
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                }

                // ---- HELPERS ----
                openDetail(mod, id) {
                    this.currentView = 'detail';
                    this.selectedId = id;
                    this.editingId = null;
                    this._formChanged = false;
                    this.clearSearch();
                    this.pushNav(mod, 'detail', id);
                    this.render();
                }

                editItem(mod, id) {
                    this.currentView = 'form';
                    this.editingId = id;
                    this._formChanged = false;
                    this.clearSearch();
                    this.pushNav(mod, 'form', id);
                    this.render();
                }

                confirmDelete(mod, id) {
                    const item = this.state.find(mod, id);
                    const name = item?.nama || item?.judul || item?.matkul || item?.title || 'item';
                    Modal.open(
                        'Konfirmasi Hapus',
                        `Apakah Anda yakin ingin menghapus "${escapeHTML(name)}"? Tindakan ini tidak dapat dibatalkan.`,
                        () => {
                            const removed = this.state.remove(mod, id);
                            if (removed) {
                                Notif.success(`"${escapeHTML(name)}" berhasil dihapus`);
                            } else {
                                Notif.error('Gagal menghapus data');
                            }
                            this.clearSearch();
                            this.currentView = 'list';
                            this.selectedId = null;
                            this.editingId = null;
                            this._formChanged = false;
                            this.pushNav(mod, 'list');
                            this.render();
                            this.updateLandingStats();
                        }
                    );
                }
            }

            // ---- BOOT ----
            let app;
            document.addEventListener('DOMContentLoaded', () => {
                // Clean up old keys
                const oldKeys = ['usu_bisa_settings_v2', 'usu_bisa_settings_v3'];
                oldKeys.forEach(key => {
                    if (localStorage.getItem(key)) {
                        const data = safeJSON(localStorage.getItem(key));
                        if (data && Object.keys(data).length > 0) {
                            localStorage.setItem('usu_bisa_settings', JSON.stringify(data));
                        }
                        localStorage.removeItem(key);
                    }
                });

                app = new App();
                window.app = app;
                window.Notif = Notif;
                console.log('✅ USU BISA v4.1 (Final) siap digunakan.');
            });
        })();
    </script>
</body>
</html>
